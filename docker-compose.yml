      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  # Phase 0 deployment gate. This profile is invoked explicitly by the
  # promotion workflow and never runs as part of the normal stack.
  bolt-phase0-synthetics:
    profiles: [phase0-verification]
    image: ${REGISTRY_HOST:-xsystems-registry-dev.tailed40e.ts.net}/${REGISTRY_NAMESPACE:-xframework}/bolt-phase0-synthetics:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Tools/XFramework.Bolt.Phase0Synthetics/XFramework.Bolt.Phase0Synthetics.csproj
    environment:
      BOLT_SYNTHETIC_TARGET: wss://bolt-hub:8443/bolt/ws
      BOLT_SYNTHETIC_TENANT_ID: ${BOLT_SYNTHETIC_TENANT_ID:?Set BOLT_SYNTHETIC_TENANT_ID in the protected deployment env}
      BOLT_SYNTHETIC_CREDENTIAL_ID: ${BOLT_SYNTHETIC_CREDENTIAL_ID:?Set BOLT_SYNTHETIC_CREDENTIAL_ID in the protected deployment env}
      BOLT_SYNTHETIC_DEVICE_ID: ${BOLT_SYNTHETIC_DEVICE_ID:-phase0-deployment-gate}
      BOLT_SYNTHETIC_COMMUNICATIONS_TOKEN_FILE: /run/secrets/bolt-synthetic-communications-token
      BOLT_SYNTHETIC_USER_TOKEN_FILE: /run/secrets/bolt-synthetic-user-token
      BOLT_SYNTHETIC_EXPIRY_TOKEN_FILE: /run/secrets/bolt-synthetic-expiry-token
    secrets:
      - source: bolt-hub-ca
        target: /usr/local/share/ca-certificates/xframework-bolt-hub-ca.crt
        mode: 0444
      - source: bolt-synthetic-communications-token
        target: /run/secrets/bolt-synthetic-communications-token
        mode: 0400
      - source: bolt-synthetic-user-token
        target: /run/secrets/bolt-synthetic-user-token
        mode: 0400
      - source: bolt-synthetic-expiry-token
        target: /run/secrets/bolt-synthetic-expiry-token
        mode: 0400
    depends_on:
      bolt-hub:
        condition: service_healthy
      identityserver:
        condition: service_healthy
      communications:
        condition: service_healthy
    restart: "no"

  seq:
    container_name: xframework-seq
    image: datalust/seq:2025
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "${SEQ_EXPOSE_PORT:-5342}:80"
    volumes:
      - seqdata:/data

  # Jaeger (OpenTelemetry trace backend for dev)
  jaeger:
    container_name: xframework-jaeger
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_EXPOSE_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_EXPOSE_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_EXPOSE_PORT:-4318}:4318"

secrets:
  bolt-hub-ca:
    file: ${BOLT_HUB_TLS_CA_PATH:?Set BOLT_HUB_TLS_CA_PATH in .env}
  bolt-hub-tls-fullchain:
    file: ${BOLT_HUB_TLS_FULLCHAIN_PATH:?Set BOLT_HUB_TLS_FULLCHAIN_PATH in .env}
  bolt-hub-tls-private-key:
    file: ${BOLT_HUB_TLS_PRIVATE_KEY_PATH:?Set BOLT_HUB_TLS_PRIVATE_KEY_PATH in .env}
  identityserver-ca:
    file: ${IDENTITYSERVER_TLS_CA_PATH:?Set IDENTITYSERVER_TLS_CA_PATH in .env}
  identityserver-tls-fullchain:
    file: ${IDENTITYSERVER_TLS_FULLCHAIN_PATH:?Set IDENTITYSERVER_TLS_FULLCHAIN_PATH in .env}
  identityserver-tls-private-key:
    file: ${IDENTITYSERVER_TLS_PRIVATE_KEY_PATH:?Set IDENTITYSERVER_TLS_PRIVATE_KEY_PATH in .env}
  bolt-synthetic-communications-token:
    file: ${BOLT_SYNTHETIC_COMMUNICATIONS_TOKEN_PATH:?Set BOLT_SYNTHETIC_COMMUNICATIONS_TOKEN_PATH in the protected deployment env}
  bolt-synthetic-user-token:
    file: ${BOLT_SYNTHETIC_USER_TOKEN_PATH:?Set BOLT_SYNTHETIC_USER_TOKEN_PATH in the protected deployment env}
  bolt-synthetic-expiry-token:
    file: ${BOLT_SYNTHETIC_EXPIRY_TOKEN_PATH:?Set BOLT_SYNTHETIC_EXPIRY_TOKEN_PATH in the protected deployment env}

volumes:
  pgdata:
  redisdata:
  miniodata:
  seqdata:
  identity-keydata:
