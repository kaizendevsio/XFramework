# Usage:
#   Local dev (default):  podman-compose up --build
#   Staging:              ASPNETCORE_ENVIRONMENT=Staging podman-compose up --build
#   Production:           podman-compose --env-file .env.production up --build
#
# Service config lives in appsettings.Docker.json per service.
# Portal uses appsettings.dev.json for the xeon-dev admin surface.
# Only secrets and infra overrides go in env vars / .env files.

x-common-env: &common-env
  ASPNETCORE_URLS: http://+:8080
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Docker}
  DefaultDatabaseConnection: Host=${DB_HOST:-postgres};Port=${DB_PORT:-5432};Database=${DB_NAME:-XFramework};Username=${DB_USER:-dbAdmin};Password=${DB_PASSWORD:?Set DB_PASSWORD in .env}
  JwtOptions__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
  JwtOptions__ValidAudience: ${JWT_AUDIENCE:-xframework}
  JwtOptions__ValidIssuer: ${JWT_ISSUER:-xframework}
  BoltConfiguration__Signature: ${BOLT_SIGNATURE:?Set BOLT_SIGNATURE in .env}
  ServiceIdentity__Issuer: XFramework.IdentityServer
  ServiceIdentity__DevelopmentClientSecret: ${SERVICE_IDENTITY_DEVELOPMENT_SECRET:?Set SERVICE_IDENTITY_DEVELOPMENT_SECRET in .env}
  ServiceIdentity__ClientSecret: ${SERVICE_IDENTITY_DEVELOPMENT_SECRET:?Set SERVICE_IDENTITY_DEVELOPMENT_SECRET in .env}
  Seq__ApiKey: ${SEQ_API_KEY:-}
  OpenTelemetry__Sampling__Probability: ${OTEL_SAMPLING_PROBABILITY:-1.0}
  OpenTelemetry__Exporters__OTLP__Enabled: ${OTEL_OTLP_ENABLED:-true}
  OpenTelemetry__Exporters__OTLP__Endpoint: ${OTEL_OTLP_ENDPOINT:-http://jaeger:4317}

services:

  # -- PostgreSQL ----------------------------------------------
  postgres:
    container_name: xframework-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-XFramework}
      POSTGRES_USER: ${DB_USER:-dbAdmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_EXPOSE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dbAdmin} -d ${DB_NAME:-XFramework}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    container_name: xframework-redis
    image: redis:7-alpine
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -- Database Migration Runner (runs once, then exits) -------
  minio:
    container_name: xframework-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_EXPOSE_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_EXPOSE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  migrate:
    container_name: xframework-migrate
    image: ${REGISTRY_HOST:-xsystems-registry-dev.tailed40e.ts.net}/${REGISTRY_NAMESPACE:-xframework}/migrate:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Tools/XFramework.MigrationRunner/XFramework.MigrationRunner.csproj
    entrypoint: ["dotnet", "XFramework.MigrationRunner.dll"]
    environment:
      DefaultDatabaseConnection: Host=${DB_HOST:-postgres};Port=${DB_PORT:-5432};Database=${DB_NAME:-XFramework};Username=${DB_USER:-dbAdmin};Password=${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # -- Bolt Hub (must be healthy before services start) ---------
  bolt-hub:
    container_name: xframework-bolt-hub
    image: ${REGISTRY_HOST:-xsystems-registry-dev.tailed40e.ts.net}/${REGISTRY_NAMESPACE:-xframework}/bolt-hub:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Modules/XFramework.Bolt/Bolt.Hub/Bolt.Hub.csproj
    environment:
      <<: *common-env
      BoltConfiguration__Durable__RedisConnectionString: ${BOLT_REDIS_CONNECTION:-redis:6379}
    ports:
      - "${BOLT_HUB_EXPOSE_PORT:-7000}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '' http://localhost:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  # -- Identity Server -----------------------------------------
  identityserver:
    container_name: xframework-identityserver
    image: ${REGISTRY_HOST:-xsystems-registry-dev.tailed40e.ts.net}/${REGISTRY_NAMESPACE:-xframework}/identityserver:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Modules/XFramework.IdentityServer/IdentityServer.Api/IdentityServer.Api.csproj
    environment:
      <<: *common-env
    ports:
      - "${IDENTITY_EXPOSE_PORT:-8261}:8080"
    depends_on:
      bolt-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '' http://localhost:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  # -- Communications Server ----------------------------------------
  communications:
    container_name: xframework-communications
    image: ${REGISTRY_HOST:-xsystems-registry-dev.tailed40e.ts.net}/${REGISTRY_NAMESPACE:-xframework}/communications:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Modules/XFramework.Communications/Communications.Api/Communications.Api.csproj
    environment:
      <<: *common-env
    ports:
      - "${COMMUNICATIONS_EXPOSE_PORT:-5148}:8080"
    depends_on:
      bolt-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '' http://localhost:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  # -- Notifications Server ------------------------------------
  notifications:
    container_name: xframework-notifications
    image: ${REGISTRY_HOST:-xsystems-registry-dev.tailed40e.ts.net}/${REGISTRY_NAMESPACE:-xframework}/notifications:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Modules/XFramework.Notifications/Notifications.Api/Notifications.Api.csproj
    environment:
      <<: *common-env
    ports:
      - "${NOTIFICATIONS_EXPOSE_PORT:-5166}:8080"
    depends_on:
      bolt-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '' http://localhost:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  storage:
    container_name: xframework-storage
    image: ${REGISTRY_HOST:-xsystems-registry-dev.tailed40e.ts.net}/${REGISTRY_NAMESPACE:-xframework}/storage:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Modules/XFramework.Storage/Storage.Api/Storage.Api.csproj
    environment:
      <<: *common-env
      BoltConfiguration__ClientName: XFramework.Storage
      Storage__DefaultProvider: ${STORAGE_DEFAULT_PROVIDER:-S3Compatible}
      Storage__ProviderProfileName: ${STORAGE_PROVIDER_PROFILE_NAME:-default}
      Storage__BucketPrefix: ${STORAGE_BUCKET_PREFIX:-xframework-dev}
      Storage__S3__Endpoint: ${STORAGE_S3_ENDPOINT:-http://minio:9000}
      Storage__S3__Region: ${STORAGE_S3_REGION:-us-east-1}
      Storage__S3__AccessKeyId: ${STORAGE_S3_ACCESS_KEY_ID:-minioadmin}
      Storage__S3__SecretAccessKey: ${STORAGE_S3_SECRET_ACCESS_KEY:-minioadmin}
      Storage__S3__UsePathStyle: ${STORAGE_S3_USE_PATH_STYLE:-true}
      Storage__S3__PublicBaseUrl: ${STORAGE_S3_PUBLIC_BASE_URL:-http://localhost:9000}
      Storage__AzureBlob__ConnectionString: ${STORAGE_AZURE_BLOB_CONNECTION_STRING:-}
    ports:
      - "${STORAGE_EXPOSE_PORT:-5190}:8080"
    depends_on:
      bolt-hub:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '' http://localhost:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  attendance:
    container_name: xframework-attendance
    image: ${REGISTRY_HOST:-xsystems-registry-dev.tailed40e.ts.net}/${REGISTRY_NAMESPACE:-xframework}/attendance:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Modules/XFramework.Attendance/Attendance.Api/Attendance.Api.csproj
    environment:
      <<: *common-env
    ports:
      - "${ATTENDANCE_EXPOSE_PORT:-5182}:8080"
    depends_on:
      bolt-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '' http://localhost:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  # -- SMS Gateway ---------------------------------------------
  smsgateway:
    container_name: xframework-smsgateway
    image: ${REGISTRY_HOST:-xsystems-registry-dev.tailed40e.ts.net}/${REGISTRY_NAMESPACE:-xframework}/smsgateway:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Modules/XFramework.SmsGateway/SmsGateway.Api/SmsGateway.Api.csproj
    environment:
      <<: *common-env
    ports:
      - "${SMSGATEWAY_EXPOSE_PORT:-5274}:8080"
    depends_on:
      bolt-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '' http://localhost:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  # -- Wallets Server ------------------------------------------
  wallets:
    container_name: xframework-wallets
    image: ${REGISTRY_HOST:-xsystems-registry-dev.tailed40e.ts.net}/${REGISTRY_NAMESPACE:-xframework}/wallets:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Modules/XFramework.Wallets/Wallets.Api/Wallets.Api.csproj
    environment:
      <<: *common-env
    ports:
      - "${WALLETS_EXPOSE_PORT:-9696}:8080"
    depends_on:
      bolt-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '' http://localhost:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  # -- Inventario Server ---------------------------------------
  inventario:
    container_name: xframework-inventario
    image: ${REGISTRY_HOST:-xsystems-registry-dev.tailed40e.ts.net}/${REGISTRY_NAMESPACE:-xframework}/inventario:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Modules/XFramework.Inventario/Inventario.Api/Inventario.Api.csproj
    environment:
      <<: *common-env
    ports:
      - "${INVENTARIO_EXPOSE_PORT:-8105}:8080"
    depends_on:
      bolt-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '' http://localhost:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  # -- POS -----------------------------------------------------
  pos:
    container_name: xframework-pos
    image: ${REGISTRY_HOST:-xsystems-registry-dev.tailed40e.ts.net}/${REGISTRY_NAMESPACE:-xframework}/pos:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Modules/XFramework.POS/POS.Api/POS.Api.csproj
    environment:
      <<: *common-env
    ports:
      - "${POS_EXPOSE_PORT:-8115}:8080"
    depends_on:
      bolt-hub:
        condition: service_healthy
      inventario:
        condition: service_healthy
      wallets:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '' http://localhost:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  # -- Portal --------------------------------------------------
  portal:
    container_name: xframework-portal
    image: ${REGISTRY_HOST:-xsystems-registry-dev.tailed40e.ts.net}/${REGISTRY_NAMESPACE:-xframework}/portal:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Presentation/XFramework.Portal/XFramework.Portal.csproj
    environment:
      <<: *common-env
      ASPNETCORE_ENVIRONMENT: ${PORTAL_ASPNETCORE_ENVIRONMENT:-dev}
    ports:
      - "${PORTAL_EXPOSE_PORT:-5000}:8080"
    depends_on:
      bolt-hub:
        condition: service_healthy
      identityserver:
        condition: service_healthy
      communications:
        condition: service_healthy
      storage:
        condition: service_healthy
      attendance:
        condition: service_healthy
      inventario:
        condition: service_healthy
      pos:
        condition: service_healthy
      wallets:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '' http://localhost:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  # -- Seq (structured log aggregator) --------------------------
  # Operations Dashboard
  operations-dashboard:
    container_name: xframework-operations-dashboard
    image: ${REGISTRY_HOST:-xsystems-registry-dev.tailed40e.ts.net}/${REGISTRY_NAMESPACE:-xframework}/operations-dashboard:${IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Presentation/XFramework.Operations.Dashboard/XFramework.Operations.Dashboard.csproj
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${OPERATIONS_DASHBOARD_ASPNETCORE_ENVIRONMENT:-Docker}
      BoltConfiguration__ClientName: XFramework.Operations.Dashboard
      BoltConfiguration__ServerUrls__0: ws://bolt-hub:8080/bolt/ws
      BoltConfiguration__RpcTimeoutSeconds: 30
      JwtOptions__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JwtOptions__ValidAudience: ${JWT_AUDIENCE:-xframework}
      JwtOptions__ValidIssuer: ${JWT_ISSUER:-xframework}
      ServiceIdentity__Issuer: XFramework.IdentityServer
      ServiceIdentity__DevelopmentClientSecret: ${SERVICE_IDENTITY_DEVELOPMENT_SECRET:?Set SERVICE_IDENTITY_DEVELOPMENT_SECRET in .env}
      ServiceIdentity__ClientSecret: ${SERVICE_IDENTITY_DEVELOPMENT_SECRET:?Set SERVICE_IDENTITY_DEVELOPMENT_SECRET in .env}
      Seq__Url: http://seq:80
      Seq__ApiKey: ${SEQ_API_KEY:-}
      Jaeger__QueryUrl: http://jaeger:16686
      OpenTelemetry__Sampling__Probability: ${OTEL_SAMPLING_PROBABILITY:-1.0}
      OpenTelemetry__Exporters__OTLP__Enabled: ${OTEL_OTLP_ENABLED:-true}
      OpenTelemetry__Exporters__OTLP__Endpoint: ${OTEL_OTLP_ENDPOINT:-http://jaeger:4317}
    ports:
      - "${OPERATIONS_DASHBOARD_EXPOSE_PORT:-5050}:8080"
    depends_on:
      bolt-hub:
        condition: service_healthy
      seq:
        condition: service_started
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '' http://localhost:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  seq:
    container_name: xframework-seq
    image: datalust/seq:2025
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "${SEQ_EXPOSE_PORT:-5342}:80"
    volumes:
      - seqdata:/data

  # Jaeger (OpenTelemetry trace backend for dev)
  jaeger:
    container_name: xframework-jaeger
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_EXPOSE_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_EXPOSE_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_EXPOSE_PORT:-4318}:4318"

volumes:
  pgdata:
  redisdata:
  miniodata:
  seqdata:
