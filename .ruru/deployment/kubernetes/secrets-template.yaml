---
# XFramework Secrets Template
# 
# IMPORTANT: This is a template file. DO NOT commit actual secrets to version control.
# 
# Usage:
#   1. Copy this file: cp secrets-template.yaml secrets.yaml
#   2. Replace all <BASE64_ENCODED_VALUE> placeholders with actual base64-encoded values
#   3. Apply: kubectl apply -f secrets.yaml
#   4. Add secrets.yaml to .gitignore
#
# To encode a value:
#   echo -n "your-secret-value" | base64
#
# To decode a value:
#   echo "base64-encoded-value" | base64 -d

apiVersion: v1
kind: Secret
metadata:
  name: xframework-secrets
  namespace: xframework
  labels:
    app: xframework-api
type: Opaque
data:
  # Database Connection String
  # Format: Server=<host>;Database=<dbname>;User Id=<user>;Password=<password>;
  # Example (before encoding): Server=postgres.database.svc.cluster.local;Database=xframework;User Id=xfuser;Password=SecurePass123!;
  database-connection-string: <BASE64_ENCODED_DATABASE_CONNECTION_STRING>

  # Redis Connection String  
  # Format: <host>:<port>,password=<password>,ssl=<true|false>
  # Example (before encoding): redis.cache.svc.cluster.local:6379,password=RedisSecurePass123!,ssl=false
  redis-connection-string: <BASE64_ENCODED_REDIS_CONNECTION_STRING>

  # JWT Secret Key (minimum 256-bit / 32 characters for HS256)
  # Generate: openssl rand -base64 32
  # Example (before encoding): xK8mP2vQ9wR4tY6uI7oP0aS3dF5gH8jK9lM2nB4cV1xZ3
  jwt-secret-key: <BASE64_ENCODED_JWT_SECRET_KEY>

  # JWT Issuer (typically your API domain)
  # Example (before encoding): https://api.xframework.com
  jwt-issuer: <BASE64_ENCODED_JWT_ISSUER>

  # JWT Audience (typically your client applications)
  # Example (before encoding): xframework-clients
  jwt-audience: <BASE64_ENCODED_JWT_AUDIENCE>

  # OpenTelemetry Collector API Key (if using managed service)
  # Example (before encoding): otel-api-key-abc123def456
  otel-api-key: <BASE64_ENCODED_OTEL_API_KEY>

  # Email Service Credentials (if applicable)
  # SMTP Server
  smtp-server: <BASE64_ENCODED_SMTP_SERVER>
  # SMTP Port
  smtp-port: <BASE64_ENCODED_SMTP_PORT>
  # SMTP Username
  smtp-username: <BASE64_ENCODED_SMTP_USERNAME>
  # SMTP Password
  smtp-password: <BASE64_ENCODED_SMTP_PASSWORD>

  # Storage Account Keys (if using cloud storage)
  # Azure Storage Connection String
  azure-storage-connection-string: <BASE64_ENCODED_AZURE_STORAGE_CONNECTION_STRING>
  # AWS S3 Access Key
  aws-s3-access-key-id: <BASE64_ENCODED_AWS_S3_ACCESS_KEY_ID>
  # AWS S3 Secret Key
  aws-s3-secret-access-key: <BASE64_ENCODED_AWS_S3_SECRET_ACCESS_KEY>

---
# Example of how to create the secret with actual values (DO NOT COMMIT)
# 
# apiVersion: v1
# kind: Secret
# metadata:
#   name: xframework-secrets
#   namespace: xframework
# type: Opaque
# stringData:
#   database-connection-string: "Server=postgres.database.svc.cluster.local;Database=xframework;User Id=xfuser;Password=SecurePass123!;"
#   redis-connection-string: "redis.cache.svc.cluster.local:6379,password=RedisSecurePass123!,ssl=false"
#   jwt-secret-key: "xK8mP2vQ9wR4tY6uI7oP0aS3dF5gH8jK9lM2nB4cV1xZ3"
#   jwt-issuer: "https://api.xframework.com"
#   jwt-audience: "xframework-clients"
#   otel-api-key: "otel-api-key-abc123def456"
#   smtp-server: "smtp.example.com"
#   smtp-port: "587"
#   smtp-username: "noreply@xframework.com"
#   smtp-password: "EmailPassword123!"
#   azure-storage-connection-string: "DefaultEndpointsProtocol=https;AccountName=xframework;AccountKey=..."
#   aws-s3-access-key-id: "AKIAIOSFODNN7EXAMPLE"
#   aws-s3-secret-access-key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"

---
# Security Best Practices:
# 
# 1. Never commit secrets to version control
# 2. Use Sealed Secrets or External Secrets Operator for GitOps workflows
# 3. Rotate secrets regularly (every 90 days minimum)
# 4. Use different secrets for each environment (dev, staging, production)
# 5. Enable RBAC to restrict secret access
# 6. Audit secret access logs
# 7. Use Azure Key Vault, AWS Secrets Manager, or HashiCorp Vault for secret management
# 8. Encrypt secrets at rest in etcd
# 9. Use Pod Security Policies/Standards to prevent privilege escalation
# 10. Monitor for exposed secrets using tools like git-secrets or truffleHog

---
# Sealed Secrets Example (for GitOps)
# 
# Install Sealed Secrets controller:
#   kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.18.0/controller.yaml
# 
# Install kubeseal CLI:
#   brew install kubeseal  # macOS
#   # or download from https://github.com/bitnami-labs/sealed-secrets/releases
# 
# Create sealed secret:
#   kubectl create secret generic xframework-secrets \
#     --from-literal=database-connection-string="Server=..." \
#     --dry-run=client -o yaml | \
#     kubeseal -o yaml > sealed-secrets.yaml
# 
# Apply sealed secret:
#   kubectl apply -f sealed-secrets.yaml
# 
# The SealedSecret controller will automatically create the Secret