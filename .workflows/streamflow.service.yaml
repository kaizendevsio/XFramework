# ─────────────────────────────
# StreamFlow CI/CD pipeline
# ─────────────────────────────

trigger:
  - Main

pr: none

# ─── RUN-TIME CHOICES ──────────────────────────────────────────────────
parameters:
  # Choose targets when you queue the pipeline.
  - name: deployToProdOnPrem
    type: boolean
    default: false        # keep current behaviour

# ─── VARIABLES ─────────────────────────────────────────────────────────
variables:
  PublishDirectory: '$(Build.ArtifactStagingDirectory)/streamFlow'
  ProjectFilePath: 'src/Modules/XFramework.StreamFlow/StreamFlow.Stream/StreamFlow.Stream.csproj'
  ServiceExecutable: 'StreamFlow.Stream.dll'
  ServiceFilePath: '/etc/systemd/system/xframework-streamFlow.service'
  ServiceName: 'xframework-streamFlow'
  AppServiceName: 'XSystems-StreamFlow'
  BuildConfiguration: 'Release'
  BuildPlatform: 'any cpu'
  ArtifactName: 'streamFlowArtifact'
  ZipFile: 'streamFlow.zip'
  AzureStagingServiceConnection: 'STAGING_SERVICES_SERVICE_CONNECTION'
  AzureProductionServiceConnection: 'PRODUCTION_SERVICES_SERVICE_CONNECTION'

# ─── BUILD STAGE ───────────────────────────────────────────────────────
stages:
  - stage: BuildAndUpload
    displayName: 'Build and Upload'
    jobs:
      - job: PullAndClean
        displayName: 'Pull and Clean'
        pool: { name: Default-Linux }
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET SDK 9'
            inputs: { version: 9.0.x }

          - task: DotNetCoreCLI@2
            displayName: 'Clean Project'
            inputs:
              command: custom
              custom: clean
              projects: '$(System.DefaultWorkingDirectory)/$(ProjectFilePath)'
              arguments: '--configuration $(BuildConfiguration)'

      - job: BuildUpload
        dependsOn: PullAndClean
        displayName: 'Build and Upload'
        pool: { name: Default-Linux }
        steps:
          - checkout: none

          - task: UseDotNet@2
            displayName: 'Use .NET SDK 9'
            inputs: { version: 9.0.x }

          - task: DotNetCoreCLI@2
            displayName: 'Publish Project'
            inputs:
              command: publish
              publishWebProjects: false
              projects: '$(System.DefaultWorkingDirectory)/$(ProjectFilePath)'
              arguments: '--configuration $(BuildConfiguration) --output $(PublishDirectory)'
              zipAfterPublish: false
              modifyOutputPath: false

          - task: PowerShell@2
            displayName: 'Zip Published Directory'
            inputs:
              targetType: 'inline'
              script: |
                Compress-Archive -Path "$(PublishDirectory)/*" `
                                 -DestinationPath "$(Build.ArtifactStagingDirectory)/$(ZipFile)"

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/$(ZipFile)'
              artifactName: '$(ArtifactName)'
  
  # ─── DEPLOY TO VM (STAGING) ────────────────────────────────────────────
  - stage: DeployToStaging
    displayName: 'Deploy to Staging (VM)'
    condition: succeeded()
    dependsOn: BuildAndUpload
    jobs:
      - deployment: DeployStaging
        displayName: 'Deploy Staging'
        environment:
          name: 'Staging'
          tags: 'Staging'
          resourceType: 'VirtualMachine'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: $(ArtifactName)

                # ▼ Service stop, unzip, ensure, start – unchanged ▼
                - task: PowerShell@2
                  displayName: 'Stop Service'
                  inputs:
                    targetType: inline
                    script: |
                      $serviceFilePath = "$(ServiceFilePath)"
                      if (Test-Path $serviceFilePath) {
                          sudo systemctl stop $(ServiceName).service
                      }

                - task: PowerShell@2
                  displayName: 'Unzip Artifact'
                  inputs:
                    targetType: inline
                    script: |
                      $dst = "$(System.DefaultWorkingDirectory)/$(ServiceName)"
                      if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
                      Expand-Archive -Path "$(Pipeline.Workspace)/$(ArtifactName)/$(ZipFile)" -DestinationPath $dst

                - task: PowerShell@2
                  displayName: 'Ensure Service'
                  inputs:
                    targetType: inline
                    script: |
                      $serviceFilePath = "$(ServiceFilePath)"
                      if (-not (Test-Path $serviceFilePath)) {
                      @"
                      [Unit]
                      Description=$(ServiceName)
                      
                      [Service]
                      WorkingDirectory=$(System.DefaultWorkingDirectory)/$(ServiceName)
                      ExecStart=/usr/bin/dotnet $(System.DefaultWorkingDirectory)/$(ServiceName)/$(ServiceExecutable)
                      Restart=always
                      RestartSec=10
                      SyslogIdentifier=$(ServiceName)
                      Environment=ASPNETCORE_ENVIRONMENT=Staging
                      
                      [Install]
                      WantedBy=multi-user.target
                      "@ | sudo tee $serviceFilePath > /dev/null
                                            sudo systemctl daemon-reload
                                            sudo systemctl enable $(ServiceName).service
                                          }

                - task: PowerShell@2
                  displayName: 'Start Service'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $serviceFilePath = "$(ServiceFilePath)"

                      if (Test-Path -Path $serviceFilePath) {
                          sudo systemctl start $(ServiceName).service

                          if ($?) {
                              Write-Host "Service started successfully."
                          } else {
                              Write-Host "Failed to start the service."
                              exit 1
                          }
                      }

# ─── DEPLOY TO VM (PRODUCTION) ─────────────────────────────────────────
  - stage: DeployToProduction
    displayName: 'Deploy to Production (VM)'
    condition: and(succeeded(), eq(${{ parameters.deployToProdOnPrem }}, true))
    dependsOn: DeployToStaging            # keep promotion flow
    jobs:
      - deployment: DeployProduction
        displayName: 'Deploy Production'
        environment:
          name: 'Production'
          tags: 'Production'
          resourceType: 'VirtualMachine'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: $(ArtifactName)

                # ▼ identical service logic but with Production env ▼
                - task: PowerShell@2
                  displayName: 'Stop Service'
                  inputs:
                    targetType: inline
                    script: |
                      $serviceFilePath = "$(ServiceFilePath)"
                      if (Test-Path $serviceFilePath) { sudo systemctl stop $(ServiceName).service }
              
                - task: PowerShell@2
                  displayName: 'Unzip Artifact'
                  inputs:
                    targetType: inline
                    script: |
                      $dst = "$(System.DefaultWorkingDirectory)/$(ServiceName)"
                      if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
                      Expand-Archive -Path "$(Pipeline.Workspace)/$(ArtifactName)/$(ZipFile)" -DestinationPath $dst
              
                - task: PowerShell@2
                  displayName: 'Ensure Service'
                  inputs:
                    targetType: inline
                    script: |
                      $serviceFilePath = "$(ServiceFilePath)"
                      if (-not (Test-Path $serviceFilePath)) {
                        @"
                        [Unit]
                        Description=$(ServiceName)
                        
                        [Service]
                        WorkingDirectory=$(System.DefaultWorkingDirectory)/$(ServiceName)
                        ExecStart=/usr/bin/dotnet $(System.DefaultWorkingDirectory)/$(ServiceName)/$(ServiceExecutable)
                        Restart=always
                        RestartSec=10
                        SyslogIdentifier=$(ServiceName)
                        Environment=ASPNETCORE_ENVIRONMENT=Production
                        
                        [Install]
                        WantedBy=multi-user.target
                        "@ | sudo tee $serviceFilePath > /dev/null
                        sudo systemctl daemon-reload
                        sudo systemctl enable $(ServiceName).service
                        }
                  
                - task: PowerShell@2
                  displayName: 'Start Service'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $serviceFilePath = "$(ServiceFilePath)"

                      if (Test-Path -Path $serviceFilePath) {
                          sudo systemctl start $(ServiceName).service

                          if ($?) {
                              Write-Host "Service started successfully."
                          } else {
                              Write-Host "Failed to start the service."
                              exit 1
                          }
                      }
              
  # ─── DEPLOY TO APP SERVICE (PRODUCTION) ────────────────────────────────
  - stage: DeployToProductionAppSvc
    displayName: 'Deploy to Production (App Service)'
    dependsOn: DeployToStaging
    condition: succeeded()
    jobs:
      - deployment: DeployProdAppSvc
        environment:
          name: 'Production-AppService'
          resourceType: 'AzureWebApp'
          resourceName: $(AppServiceName)
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: $(ArtifactName)
                
                - task: AzureWebApp@1
                  displayName: 'Azure Web App Deploy: XSystems-StreamFlow'
                  inputs:
                    azureSubscription: $(AzureProductionServiceConnection)
                    appType:          webAppLinux
                    appName:          $(AppServiceName)
                    package:          '$(Pipeline.Workspace)/$(ArtifactName)/$(ZipFile)'
                    runtimeStack:     'DOTNETCORE|9.0'
                    startUpCommand:   'dotnet StreamFlow.Stream.dll'

