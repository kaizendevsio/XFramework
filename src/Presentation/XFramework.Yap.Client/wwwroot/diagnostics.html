<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Yap diagnostics</title><link rel="stylesheet" href="diagnostics-page.css"><script src="diagnostics.js" defer></script><script src="diagnostics-page.js" defer></script></head>
<body><main><h1>Yap diagnostics</h1><p>This page can open without loading your chats or photos.</p>
<label><input id="logging" type="checkbox"> Enable diagnostic logging</label>
<p>Enable logging, open Yap and reproduce the problem. Come back here if the app stops opening. Logs stay on this device and exclude messages, passwords and photo contents.</p>
<button id="copy">Copy logs</button> <button id="clear">Clear logs</button><p id="notice" role="status"></p>
<textarea id="logs" aria-label="Diagnostic logs" readonly rows="14"></textarea><p><a href="/settings">Back to Yap settings</a></p></main></body></html>
