<!-- These are deferred, and the runtime bootstrap sits with them instead of at the end of the body.
     Parser-blocking tags have to run before the parser can reach #app, so the splash - the only thing a
     person sees for the first second of a cold start - waited on seventeen round trips before it existed:
     measured against the published build over a 60ms link, it appeared at ~370ms and now appears at ~82ms.
     Defer keeps execution in document order, so every yap.* global is still defined before the runtime
     starts. There is no rel=preload for dotnet.native.wasm: its published name carries a content
     fingerprint, and this project does not let the SDK rewrite this file to fill one in. -->
