[package]
name = "xframework-opaque"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
opaque-ke = { version = "=4.0.1", features = ["argon2"] }
argon2 = "=0.5.3"
sha2 = "=0.10.9"
base64 = "=0.22.1"
serde_json = "1.0"
zeroize = "1.8"
rand = "=0.8.8"

[profile.release]
panic = "unwind"
strip = true
