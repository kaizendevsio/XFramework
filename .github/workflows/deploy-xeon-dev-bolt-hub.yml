name: Deploy Xeon Dev - Bolt Hub

on:
  push:
    branches: [develop]
    paths:
      - src/Modules/XFramework.Bolt/Bolt.Hub/**
      - src/Modules/XFramework.Bolt/Bolt.Domain.Shared/**
      - docker-compose.yml
      - scripts/verify-bolt-phase0-*
      - .github/workflows/deploy-xeon-dev-service.yml
      - .github/workflows/deploy-xeon-dev-bolt-hub.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-shared-changes:
    name: Detect shared deploy ownership
    runs-on: ubuntu-latest
    outputs:
      has_shared: ${{ steps.shared.outputs.has_shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Detect shared changes
        id: shared
        uses: ./.github/actions/detect-shared-deploy-changes

  deploy:
    needs: detect-shared-changes
    if: needs.detect-shared-changes.outputs.has_shared != 'true'
    uses: ./.github/workflows/deploy-xeon-dev-service.yml
    with:
      service: bolt-hub
      health_url: https://bolt-hub/health/ready
      diagnostics_services: migrate bolt-hub
    secrets: inherit
