name: Bolt Phase 0 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bolt-phase0-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Phase 0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bolt_authorization_test
          POSTGRES_USER: bolt_test
          POSTGRES_PASSWORD: bolt_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bolt_test -d bolt_authorization_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.x

      - name: Parse and actionlint workflows
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/workflow-yaml"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --disable-pip-version-check --no-cache-dir PyYAML==6.0.2
          "$venv/bin/python" - <<'PY'
          import os
          import re
          from pathlib import Path

          import yaml

          bash_directory = Path(os.environ["RUNNER_TEMP"]) / "workflow-bash"
          bash_directory.mkdir(mode=0o700)
          heredoc = re.compile(
              r"<<\s*'PY'[ \t]*\n(?P<body>.*?)(?=^PY[ \t]*(?:\n|$))",
              re.DOTALL | re.MULTILINE,
          )
          heredoc_opener = re.compile(r"<<\s*'PY'[ \t]*\n")

          def uses_bash(step, job):
              shell = step.get("shell")
              if shell is not None:
                  executable = str(shell).strip().split()[0].replace("\\", "/")
                  return executable.rsplit("/", 1)[-1] in {"bash", "bash.exe"}

              runners = job.get("runs-on", [])
              if isinstance(runners, str):
                  runners = [runners]
              return not any("windows" in str(runner).lower() for runner in runners)

          paths = sorted(Path(".github/workflows").glob("*.y*ml"))
          if not paths:
              raise SystemExit("No workflow YAML files found")
          bash_blocks = 0
          python_blocks = 0
          for path in paths:
              document = yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
              if not isinstance(document, dict):
                  raise SystemExit(f"{path}: workflow root must be a mapping")
              for job_name, job in (document.get("jobs") or {}).items():
                  if not isinstance(job, dict):
                      continue
                  for step_index, step in enumerate(job.get("steps") or []):
                      if not isinstance(step, dict) or not isinstance(step.get("run"), str):
                          continue
                      run = step["run"]
                      matches = list(heredoc.finditer(run))
                      if len(matches) != len(heredoc_opener.findall(run)):
                          raise SystemExit(
                              f"{path}:{job_name}:step-{step_index}: unterminated Python heredoc"
                          )
                      for heredoc_index, match in enumerate(matches):
                          compile(
                              match.group("body"),
                              f"{path}:{job_name}:step-{step_index}:PY-{heredoc_index}",
                              "exec",
                          )
                          python_blocks += 1
                      if uses_bash(step, job):
                          safe_job_name = re.sub(r"[^A-Za-z0-9_.-]+", "-", str(job_name))
                          script_path = bash_directory / (
                              f"{path.stem}-{safe_job_name}-{step_index:03d}.sh"
                          )
                          script_path.write_text(run + "\n", encoding="utf-8")
                          bash_blocks += 1
          print(
              f"Parsed {len(paths)} workflow files; extracted {bash_blocks} Bash blocks; "
              f"compiled {python_blocks} Python heredocs"
          )
          PY

          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find "$RUNNER_TEMP/workflow-bash" -type f -name '*.sh' -print0 | sort -z)

          version=1.7.8
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          printf '%s  %s\n' \
            'be92c2652ab7b6d08425428797ceabeb16e31a781c07bc388456b4e592f3e36a' \
            "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=

      - name: Render and verify Compose boundary
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/bolt-phase0-fixtures"
          install -d -m 0700 "$fixture_dir"
          for token in communications-transport portal-transport user-actor expiry-transport; do
            printf 'fixture-%s-token\n' "$token" >"$fixture_dir/$token-token"
            chmod 0600 "$fixture_dir/$token-token"
          done
          export BOLT_SYNTHETIC_COMMUNICATIONS_TRANSPORT_TOKEN_PATH="$fixture_dir/communications-transport-token"
          export BOLT_SYNTHETIC_PORTAL_TRANSPORT_TOKEN_PATH="$fixture_dir/portal-transport-token"
          export BOLT_SYNTHETIC_USER_ACTOR_TOKEN_PATH="$fixture_dir/user-actor-token"
          export BOLT_SYNTHETIC_EXPIRY_TRANSPORT_TOKEN_PATH="$fixture_dir/expiry-transport-token"

          compose_json="$RUNNER_TEMP/compose.json"
          serve_json="$RUNNER_TEMP/serve.json"
          docker compose --env-file .env.example -f docker-compose.yml \
            config --format json >"$compose_json"
          printf '%s\n' \
            '{"TCP":{"7000":{"HTTPS":true},"8261":{"HTTPS":true}},"Web":{"xeon-dev.example-tail.ts.net:7000":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:7000"}}},"xeon-dev.example-tail.ts.net:8261":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:8261"}}}},"AllowFunnel":{"xeon-dev.example-tail.ts.net:7000":false,"xeon-dev.example-tail.ts.net:8261":false}}' \
            >"$serve_json"
          python3 -B scripts/verify-bolt-tailscale-boundary.py \
            --serve-status-json "$serve_json" \
            --compose-json "$compose_json" \
            --magicdns-host xeon-dev.example-tail.ts.net \
            --evidence "$RUNNER_TEMP/tailscale-boundary.json"

      - name: Test retained Phase 0 helpers
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/configure-bolt-tailscale-boundary.sh
          python3 -B scripts/verify-bolt-tailscale-boundary-test.py
          python3 -B scripts/verify-bolt-phase0-diagnostic-sinks-test.py
          python3 -B scripts/refresh-bolt-phase0-synthetic-tokens-test.py

      - name: Restore and build
        run: |
          dotnet restore XFramework.slnx
          dotnet build XFramework.slnx --configuration Release --no-restore

      - name: Test complete Bolt suite
        env:
          BOLT_TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=bolt_authorization_test;Username=bolt_test;Password=bolt_test_password
          BOLT_TEST_REDIS_CONNECTION: localhost:6379,abortConnect=false
          BOLT_TEST_REDIS_REQUIRED: "true"
        run: |
          dotnet test src/Tests/Bolt.Tests/Bolt.Tests.csproj \
            --configuration Release --no-build --no-restore

      - name: Test complete Phase 0 synthetics suite
        run: |
          dotnet test src/Tests/Bolt.Phase0Synthetics.Tests/Bolt.Phase0Synthetics.Tests.csproj \
            --configuration Release --no-build --no-restore

      - name: Test focused IdentityServer and Portal contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet test src/Tests/IdentityServer.UnitTests/IdentityServer.UnitTests.csproj \
            --configuration Release --no-build --no-restore \
            --filter "FullyQualifiedName~BoltTransportTokenIssuerTests"
          dotnet test src/Tests/Portal.E2ETests/Portal.E2ETests.csproj \
            --configuration Release --no-build --no-restore \
            --filter "FullyQualifiedName~ServiceIdentityComposeContractTests"
