          while true; do
            status_json="$(ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
              "/usr/bin/timeout --foreground --kill-after=10s 30s python3 '$remote_manager' status --env-file '$XFRAMEWORK_ENV_FILE' --state-file '$REMOTE_ROTATION_STATE'")"
            remaining="$(python3 - "$status_json" <<'PY'
          import datetime, json, sys
          document = json.loads(sys.argv[1])
          expiry = datetime.datetime.fromisoformat(document["secondary_valid_until_utc"].replace("Z", "+00:00"))
          print(max(0, int((expiry - datetime.datetime.now(datetime.timezone.utc)).total_seconds())))
          PY
          )"
            if [ "$remaining" -le 0 ]; then break; fi
            ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
              "REMOTE_LEASE_MANAGER='$REMOTE_LEASE_MANAGER' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          for container in xframework-identityserver xframework-communications; do
            http_status="$(/usr/bin/timeout --foreground --kill-after=10s 30s docker exec "$container" curl -sS --connect-timeout 3 --max-time 10 \
              -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health/ready || true)"
            test "$http_status" = 200
          done
          python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$(id -u)" \
            heartbeat --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase retiring-generation-wait --mutation-began >/dev/null
          REMOTE_SCRIPT
            sleep_for=30
            if [ "$remaining" -lt "$sleep_for" ]; then sleep_for="$remaining"; fi
            sleep "$sleep_for"
          done
          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "REMOTE_MANAGER='$remote_manager' REMOTE_EVIDENCE='$remote_evidence' XFRAMEWORK_ENV_FILE='$XFRAMEWORK_ENV_FILE' REMOTE_ROTATION_STATE='$REMOTE_ROTATION_STATE' REMOTE_LEASE_MANAGER='$REMOTE_LEASE_MANAGER' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          deployment_uid="$(id -u)"
          heartbeat() {
            python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
              heartbeat --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase credential-finalization --mutation-began >/dev/null
          }
          heartbeat
          python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
            supervise --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase credential-finalization --mutation-began \
            --timeout-seconds 540 --quiet -- /usr/bin/timeout --foreground --kill-after=30s 510s \
            python3 "$REMOTE_MANAGER" finalize --env-file "$XFRAMEWORK_ENV_FILE" \
              --state-file "$REMOTE_ROTATION_STATE" > "$REMOTE_EVIDENCE.tmp"
          mv "$REMOTE_EVIDENCE.tmp" "$REMOTE_EVIDENCE"
          chmod 600 "$REMOTE_EVIDENCE"
          heartbeat
          REMOTE_SCRIPT
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST:$remote_evidence" "$evidence_dir/rotation-finalized.json"

