          retired_user="$(python3 "$ENV_PARSER" --file "$XFRAMEWORK_ENV_FILE" --key BOLT_SYNTHETIC_REJECTED_USER_TOKEN_PATH --type absolute-path)"
          python3 - "$health_dir" "$state_status" "$INPUT" "$INVENTORY" "$@" <<'PY'
          import datetime, json, os, pathlib, sys
