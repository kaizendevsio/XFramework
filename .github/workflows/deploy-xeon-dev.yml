            "${compose[@]}" up -d --no-build --no-deps --force-recreate \
            bolt-hub identityserver communications notifications storage attendance \
            smsgateway wallets inventario pos portal operations-dashboard
          for service in "${@:2}"; do
            container_id="$(/usr/bin/timeout --foreground --kill-after=10s 30s "${compose[@]}" ps --quiet "$service")"
            test -n "$container_id"
            for attempt in $(seq 1 60); do
              heartbeat
              health="$(/usr/bin/timeout --foreground --kill-after=10s 30s docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container_id")"
              if [ "$health" = healthy ]; then break; fi
              sleep 5
            done
            test "$(/usr/bin/timeout --foreground --kill-after=10s 30s docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container_id")" = healthy
          done
          python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
            supervise --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase rollback-verification --mutation-began \
            --timeout-seconds 900 -- /usr/bin/timeout --foreground --kill-after=30s 870s \
            python3 "$REMOTE_RUNTIME_VERIFIER" --compose-file "$REMOTE_COMPOSE_FILE" --compose-file "$REMOTE_PIN_OVERRIDE" \
              --env-file "$XFRAMEWORK_ENV_FILE" --project-name "$COMPOSE_PROJECT_NAME" --output "$REMOTE_RUNTIME" \
              --pins-file "$REMOTE_PINS_FILE" --services "$@"
          test -s "$REMOTE_RUN_DIR/synthetics-finalized.json"
          cp --reflink=auto --preserve=mode,timestamps "$REMOTE_RUN_DIR/synthetics-finalized.json" \
