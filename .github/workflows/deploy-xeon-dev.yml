          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" "install -d -m 700 '$REMOTE_RUN_DIR'"
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$COMPOSE_FILE_PATH" "$DEPLOY_HOST:$REMOTE_COMPOSE_FILE"
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$override_file" "$DEPLOY_HOST:$remote_override"
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$pins_file" "$DEPLOY_HOST:$remote_pins"
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$provenance_file" "$DEPLOY_HOST:$REMOTE_RUN_DIR/provenance-evidence.json"
          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "chmod 600 '$REMOTE_COMPOSE_FILE' '$remote_override' '$remote_pins' '$REMOTE_RUN_DIR/provenance-evidence.json' && rm -f '$remote_evidence'"

          service_args="$(printf '%q ' "${services[@]}")"
          remote_env="COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' REGISTRY_HOST='$REGISTRY_HOST' REGISTRY_NAMESPACE='$REGISTRY_NAMESPACE' IMAGE_TAG='$IMAGE_TAG' CREDENTIAL_GENERATION_ID='phase0-prelease-validation-g1' XFRAMEWORK_ENV_FILE='$XFRAMEWORK_ENV_FILE' ENV_PARSER='$REMOTE_ENV_PARSER' COMPOSE_VERIFIER='$REMOTE_DEPLOY_DIR/verify-bolt-phase0-compose.py' REMOTE_OVERRIDE='$remote_override' REMOTE_PINS='$remote_pins' REMOTE_PROVENANCE='$REMOTE_RUN_DIR/provenance-evidence.json' REMOTE_EVIDENCE='$remote_evidence' REMOTE_COMPOSE_FILE='$REMOTE_COMPOSE_FILE' PUBLICATION_TOPOLOGY_ATTESTATION='$PUBLICATION_TOPOLOGY_ATTESTATION' PUBLICATION_TOPOLOGY_ATTESTED_BY='$PUBLICATION_TOPOLOGY_ATTESTED_BY' PUBLICATION_TOPOLOGY_ATTESTED_BY_ID='$PUBLICATION_TOPOLOGY_ATTESTED_BY_ID' PUBLICATION_TOPOLOGY_TRIGGERING_ACTOR='$PUBLICATION_TOPOLOGY_TRIGGERING_ACTOR' PUBLICATION_TOPOLOGY_RUN_ID='$GITHUB_RUN_ID' PUBLICATION_TOPOLOGY_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT'"
          status=0
          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "$remote_env bash -s -- $service_args" <<'REMOTE_SCRIPT' || status=$?
          set -euo pipefail
          read_env() { python3 "$ENV_PARSER" --file "$XFRAMEWORK_ENV_FILE" --key "$1"; }
          ca_path="$(read_env BOLT_HUB_TLS_CA_PATH)"
          fullchain_path="$(read_env BOLT_HUB_TLS_FULLCHAIN_PATH)"
          private_key_path="$(read_env BOLT_HUB_TLS_PRIVATE_KEY_PATH)"
          published_port="$(read_env BOLT_HUB_EXPOSE_PORT)"
          public_hostname="$(read_env BOLT_HUB_PUBLIC_HOSTNAME)"
          identity_ca_path="$(read_env IDENTITYSERVER_TLS_CA_PATH)"
          identity_fullchain_path="$(read_env IDENTITYSERVER_TLS_FULLCHAIN_PATH)"
          identity_private_key_path="$(read_env IDENTITYSERVER_TLS_PRIVATE_KEY_PATH)"
          identity_published_port="$(read_env IDENTITYSERVER_PUBLIC_HTTPS_PORT)"
          identity_public_hostname="$(read_env IDENTITYSERVER_PUBLIC_HOSTNAME)"
          identity_token_path="$(read_env IDENTITYSERVER_BOLT_TRANSPORT_TOKEN_PATH)"
          authorize_args=()
          for service in "$@"; do authorize_args+=(--authorized-service "$service"); done
          python3 "$COMPOSE_VERIFIER" \
            --compose-file "$REMOTE_COMPOSE_FILE" \
            --compose-file "$REMOTE_OVERRIDE" \
            --env-file "$XFRAMEWORK_ENV_FILE" \
            --output "$REMOTE_EVIDENCE" \
            --expected-ca-path "$ca_path" \
            --expected-fullchain-path "$fullchain_path" \
            --expected-private-key-path "$private_key_path" \
            --expected-published-port "$published_port" \
            --expected-public-hostname "$public_hostname" \
            --expected-identityserver-ca-path "$identity_ca_path" \
            --expected-identityserver-fullchain-path "$identity_fullchain_path" \
            --expected-identityserver-private-key-path "$identity_private_key_path" \
            --expected-identityserver-published-port "$identity_published_port" \
            --expected-identityserver-public-hostname "$identity_public_hostname" \
            --expected-identityserver-token-path "$identity_token_path" \
            --pins-file "$REMOTE_PINS" \
            --provenance-file "$REMOTE_PROVENANCE" \
            --publication-topology-attestation "$PUBLICATION_TOPOLOGY_ATTESTATION" \
            --publication-topology-attested-by "$PUBLICATION_TOPOLOGY_ATTESTED_BY" \
            --publication-topology-attested-by-id "$PUBLICATION_TOPOLOGY_ATTESTED_BY_ID" \
            --publication-topology-triggering-actor "$PUBLICATION_TOPOLOGY_TRIGGERING_ACTOR" \
            --publication-topology-run-id "$PUBLICATION_TOPOLOGY_RUN_ID" \
            --publication-topology-run-attempt "$PUBLICATION_TOPOLOGY_RUN_ATTEMPT" \
            "${authorize_args[@]}" \
            --authorize-deployment
          REMOTE_SCRIPT
          if [ "$status" -eq 0 ]; then
            scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes \
              "$DEPLOY_HOST:$remote_evidence" "$evidence_dir/pinned-manifest-remote.json"
          else
            scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes \
              "$DEPLOY_HOST:$remote_evidence" "$evidence_dir/pinned-manifest-remote.json" || true
          fi
          exit "$status"

      - name: Pull candidate images without mutating services
        shell: bash
        env:
          DEPLOY_SSH_OPERATION_TIMEOUT_SECONDS: 2700
        run: |
          set -euo pipefail
          pull_services=(
            migrate
