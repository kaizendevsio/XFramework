name: Deploy Xeon Dev - All Services

on:
  push:
    branches: [develop]
    paths:
      - Dockerfile
      - docker-compose.yml
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - Version.props
      - XFramework.slnx
      - global.json
      - NuGet.config
      - src/Kernel/**
      - src/Infrastructure/**
      - src/Shared/**
      - src/SourceGenerators/**
      - src/Libraries/**
      - src/Tools/**
      - src/Modules/**
      - src/Presentation/**
      - scripts/configure-bolt-tailscale-boundary.sh
      - scripts/verify-bolt-tailscale-boundary.py
      - scripts/verify-bolt-phase0-diagnostic-sinks.py
      - scripts/refresh-bolt-phase0-synthetic-tokens.py
      - .github/workflows/deploy-xeon-dev.yml
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_XEON_DEV to authorize deployment from develop
        required: true
        type: string
      bootstrap_without_rollback:
        description: Allow deployment only when no XFramework runtime containers exist
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: xeon-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy all services to xeon-dev
    runs-on: [self-hosted, Linux, xeon-dev-deploy]
    timeout-minutes: 120
    env:
      COMPOSE_FILE_PATH: docker-compose.yml
      COMPOSE_PROJECT_NAME: xframework
      REGISTRY_HOST: xsystems-registry-dev.tailed40e.ts.net
      REGISTRY_NAMESPACE: xframework
      IMAGE_TAG: ${{ github.sha }}
      DEPLOY_HOST: xeon-dev
      DEPLOY_SSH_KEY: /home/xeon/.ssh/xframework_xeon_dev_ed25519
      DEPLOY_SSH_OPERATION_TIMEOUT_SECONDS: 1200
      REMOTE_DEPLOY_DIR: /home/github-runner/xframework-deploy
      REMOTE_RELEASES_DIR: /home/github-runner/xframework-deploy/releases
      REMOTE_RUN_DIR: /home/github-runner/xframework-deploy/releases/${{ github.run_id }}-${{ github.run_attempt }}
      REMOTE_COMPOSE_FILE: /home/github-runner/xframework-deploy/docker-compose.yml
      REMOTE_ACTIVE_ENV: /home/github-runner/xframework-deploy/active.env
      REMOTE_CANDIDATE_COMPOSE: /home/github-runner/xframework-deploy/releases/${{ github.run_id }}-${{ github.run_attempt }}/docker-compose.yml
      REMOTE_CANDIDATE_ENV: /home/github-runner/xframework-deploy/releases/${{ github.run_id }}-${{ github.run_attempt }}/candidate.env
      REMOTE_IMAGE_OVERRIDE: /home/github-runner/xframework-deploy/releases/${{ github.run_id }}-${{ github.run_attempt }}/images.override.json
      REMOTE_CONFIGURE_BOUNDARY: /home/github-runner/xframework-deploy/releases/${{ github.run_id }}-${{ github.run_attempt }}/configure-bolt-tailscale-boundary.sh
      REMOTE_VERIFY_BOUNDARY: /home/github-runner/xframework-deploy/releases/${{ github.run_id }}-${{ github.run_attempt }}/verify-bolt-tailscale-boundary.py
      REMOTE_VERIFY_DIAGNOSTICS: /home/github-runner/xframework-deploy/releases/${{ github.run_id }}-${{ github.run_attempt }}/verify-bolt-phase0-diagnostic-sinks.py
      REMOTE_REFRESH_TOKENS: /home/github-runner/xframework-deploy/releases/${{ github.run_id }}-${{ github.run_attempt }}/refresh-bolt-phase0-synthetic-tokens.py
      XFRAMEWORK_ENV_FILE: /opt/xframework/xeon-dev.env
      IDENTITY_PUBLIC_URL: https://xeon-dev.tailed40e.ts.net:8261
      HUB_PUBLIC_URL: https://xeon-dev.tailed40e.ts.net:7000
      OBSERVATION_SECONDS: 120
      DB_PASSWORD: compose-validation-placeholder
      USER_JWT_GENERATION_ID: compose-validation-user-jwt-g1
      BOLT_SIGNATURE: compose-validation-placeholder
      SERVICE_CREDENTIAL_GENERATION_ID: compose-validation-placeholder
      IDENTITYSERVER_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      BOLT_HUB_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      COMMUNICATIONS_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      NOTIFICATIONS_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      STORAGE_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      ATTENDANCE_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      SMSGATEWAY_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      WALLETS_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      INVENTARIO_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      POS_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      PORTAL_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      OPERATIONS_DASHBOARD_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      COMMUNICATIONS_TRUSTED_METADATA_SECRET: compose-validation-placeholder
      IDENTITY_USER_JWT_PUBLIC_KEY_PATH: /tmp/xframework-compose-identity-user-jwt-public-key.pem
      IDENTITY_USER_JWT_PRIVATE_KEY_PATH: /tmp/xframework-compose-identity-user-jwt-private-key.pem
      BOLT_SYNTHETIC_TENANT_ID: 00000000-0000-0000-0000-000000000001
      BOLT_SYNTHETIC_CREDENTIAL_ID: 00000000-0000-0000-0000-000000000002
      BOLT_SYNTHETIC_TARGET: wss://xeon-dev.tailed40e.ts.net:7000/bolt/ws
      BOLT_SYNTHETIC_COMMUNICATIONS_TRANSPORT_TOKEN_PATH: /tmp/xframework-compose-${{ github.run_id }}-${{ github.run_attempt }}-communications-transport-token
      BOLT_SYNTHETIC_COMMUNICATIONS_IDENTITY_SERVICE_TOKEN_PATH: /tmp/xframework-compose-${{ github.run_id }}-${{ github.run_attempt }}-communications-identity-service-token
      BOLT_SYNTHETIC_PORTAL_TRANSPORT_TOKEN_PATH: /tmp/xframework-compose-${{ github.run_id }}-${{ github.run_attempt }}-portal-transport-token
      BOLT_SYNTHETIC_PORTAL_IDENTITY_SERVICE_TOKEN_PATH: /tmp/xframework-compose-${{ github.run_id }}-${{ github.run_attempt }}-portal-identity-service-token
      BOLT_SYNTHETIC_USER_ACTOR_TOKEN_PATH: /tmp/xframework-compose-${{ github.run_id }}-${{ github.run_attempt }}-user-actor-token
      BOLT_SYNTHETIC_EXPIRY_TRANSPORT_TOKEN_PATH: /tmp/xframework-compose-${{ github.run_id }}-${{ github.run_attempt }}-expiry-transport-token
      ALLOW_EMPTY_HOST_BOOTSTRAP: ${{ inputs.bootstrap_without_rollback && 'true' || 'false' }}

    steps:
      - name: Authorize develop deployment
        shell: bash
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/develop
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              test "$DEPLOY_CONFIRMATION" = DEPLOY_XEON_DEV
              test "$TRIGGERING_ACTOR" = "$DEPLOY_ACTOR"
              ;;
            push)
              test -z "$DEPLOY_CONFIRMATION"
              ;;
            *) exit 1 ;;
          esac
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Configure pinned SSH trust and command bounds
        id: ssh_setup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$RUNNER_TEMP/xeon-dev-ssh"
          wrapper_dir="$ssh_dir/bin"
          config="$ssh_dir/config"
          known_hosts="$ssh_dir/known_hosts"
          source_known_hosts=.github/known_hosts/xeon-dev
          system_ssh="$(command -v ssh)"
          system_scp="$(command -v scp)"
          system_timeout="$(command -v timeout)"

          test -s "$source_known_hosts"
          test "$(grep -cve '^[[:space:]]*$' "$source_known_hosts")" -eq 1
          grep -Eq '^xeon-dev ssh-ed25519 [A-Za-z0-9+/]+={0,2}$' "$source_known_hosts"
          test -f "$DEPLOY_SSH_KEY"
          test ! -L "$DEPLOY_SSH_KEY"
          test "$(stat -Lc '%u:%a:%h' "$DEPLOY_SSH_KEY")" = "$(id -u):600:1"

          install -d -m 700 "$ssh_dir" "$wrapper_dir"
          install -m 600 "$source_known_hosts" "$known_hosts"
          cat > "$config" <<EOF
          Host xeon-dev
            HostName xeon-dev
            User github-runner
            IdentityFile $DEPLOY_SSH_KEY
            IdentitiesOnly yes
            BatchMode yes
            PreferredAuthentications publickey
            PasswordAuthentication no
            KbdInteractiveAuthentication no
            StrictHostKeyChecking yes
            UserKnownHostsFile $known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            ConnectTimeout 10
            ConnectionAttempts 2
            ServerAliveInterval 15
            ServerAliveCountMax 3
            ControlMaster no
            ClearAllForwardings yes
            RequestTTY no
          EOF
          chmod 600 "$config"

          cat > "$wrapper_dir/ssh" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          seconds="\${DEPLOY_SSH_OPERATION_TIMEOUT_SECONDS:-1200}"
          [[ "\$seconds" =~ ^[1-9][0-9]{0,4}\$ ]]
          exec "$system_timeout" --foreground --signal=TERM --kill-after=15s "\${seconds}s" \
            "$system_ssh" -F "$config" "\$@"
          EOF
          cat > "$wrapper_dir/scp" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          seconds="\${DEPLOY_SSH_OPERATION_TIMEOUT_SECONDS:-1200}"
          [[ "\$seconds" =~ ^[1-9][0-9]{0,4}\$ ]]
          exec "$system_timeout" --foreground --signal=TERM --kill-after=15s "\${seconds}s" \
            "$system_scp" -F "$config" "\$@"
          EOF
          chmod 700 "$wrapper_dir/ssh" "$wrapper_dir/scp"
          printf '%s\n' "$wrapper_dir" >> "$GITHUB_PATH"
          printf 'DEPLOY_SSH_READY=true\n' >> "$GITHUB_ENV"
          "$system_ssh" -F "$config" -G "$DEPLOY_HOST" >/dev/null

      - name: Validate deployment prerequisites
        shell: bash
        run: |
          set -euo pipefail
          docker --version
          docker compose version
          test -S /var/run/docker.sock
          timeout --foreground --kill-after=10s 30s docker info --format 'Docker daemon: {{.Name}} {{.ServerVersion}}'
          bash -n scripts/configure-bolt-tailscale-boundary.sh
          python3 -B -m py_compile scripts/verify-bolt-tailscale-boundary.py
          python3 -B -m py_compile scripts/verify-bolt-phase0-diagnostic-sinks.py

          install -m 600 /dev/null "$BOLT_SYNTHETIC_COMMUNICATIONS_TRANSPORT_TOKEN_PATH"
          install -m 600 /dev/null "$BOLT_SYNTHETIC_COMMUNICATIONS_IDENTITY_SERVICE_TOKEN_PATH"
          install -m 600 /dev/null "$BOLT_SYNTHETIC_PORTAL_TRANSPORT_TOKEN_PATH"
          install -m 600 /dev/null "$BOLT_SYNTHETIC_PORTAL_IDENTITY_SERVICE_TOKEN_PATH"
          install -m 600 /dev/null "$BOLT_SYNTHETIC_USER_ACTOR_TOKEN_PATH"
          install -m 600 /dev/null "$BOLT_SYNTHETIC_EXPIRY_TRANSPORT_TOKEN_PATH"
          install -m 600 /dev/null "$IDENTITY_USER_JWT_PUBLIC_KEY_PATH"
          install -m 600 /dev/null "$IDENTITY_USER_JWT_PRIVATE_KEY_PATH"
          timeout --foreground --kill-after=10s 60s docker compose -f "$COMPOSE_FILE_PATH" config --quiet

          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          status="$(curl -sS --connect-timeout 5 --max-time 15 -o "$headers" -w '%{http_code}' -I "https://${REGISTRY_HOST}/v2/" || true)"
          cat "$headers"
          test "$status" = 401
          grep -qi '^Docker-Distribution-Api-Version: registry/2.0' "$headers"

          ssh "$DEPLOY_HOST" "XFRAMEWORK_ENV_FILE='$XFRAMEWORK_ENV_FILE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          command -v docker
          command -v curl
          command -v python3
          command -v tailscale
          docker compose version
          test -f "$XFRAMEWORK_ENV_FILE"
          test ! -L "$XFRAMEWORK_ENV_FILE"
          test "$(readlink -e "$XFRAMEWORK_ENV_FILE")" = "$XFRAMEWORK_ENV_FILE"
          IFS=: read -r owner mode links size < <(stat -Lc '%u:%a:%h:%s' "$XFRAMEWORK_ENV_FILE")
          test "$owner" = "$(id -u)"
          test "$mode" = 600
          test "$links" = 1
          test "$size" -gt 0
          test "$size" -le 1048576
          REMOTE_SCRIPT

      - name: Login to dev registry
        shell: bash
        env:
          XSYSTEMS_DEV_REGISTRY_USERNAME: ${{ secrets.XSYSTEMS_DEV_REGISTRY_USERNAME }}
          XSYSTEMS_DEV_REGISTRY_PASSWORD: ${{ secrets.XSYSTEMS_DEV_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$XSYSTEMS_DEV_REGISTRY_PASSWORD"
          [[ "$XSYSTEMS_DEV_REGISTRY_USERNAME" =~ ^[A-Za-z0-9_.@-]+$ ]]
          printf '%s' "$XSYSTEMS_DEV_REGISTRY_PASSWORD" |
            timeout --foreground --kill-after=10s 60s docker login "$REGISTRY_HOST" \
              --username "$XSYSTEMS_DEV_REGISTRY_USERNAME" --password-stdin
          printf '%s' "$XSYSTEMS_DEV_REGISTRY_PASSWORD" |
            ssh "$DEPLOY_HOST" "docker login '$REGISTRY_HOST' --username '$XSYSTEMS_DEV_REGISTRY_USERNAME' --password-stdin"

      - name: Build images
        shell: bash
        run: |
          set -euo pipefail
          services=(
            migrate identityserver bolt-hub communications
            notifications storage attendance smsgateway wallets inventario pos
            portal operations-dashboard bolt-phase0-synthetics
          )
          for service in "${services[@]}"; do
            timeout --foreground --kill-after=30s 15m \
              docker compose -f "$COMPOSE_FILE_PATH" build "$service"
          done

      - name: Push images
        shell: bash
        run: |
          set -euo pipefail
          services=(
            migrate identityserver bolt-hub communications
            notifications storage attendance smsgateway wallets inventario pos
            portal operations-dashboard bolt-phase0-synthetics
          )
          for service in "${services[@]}"; do
            image="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/${service}:${IMAGE_TAG}"
            timeout --foreground --kill-after=30s 10m docker push "$image"
          done

      - name: Stage candidate and capture previous release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" "install -d -m 700 '$REMOTE_RELEASES_DIR' '$REMOTE_RUN_DIR'"
          scp "$COMPOSE_FILE_PATH" "$DEPLOY_HOST:$REMOTE_CANDIDATE_COMPOSE"
          scp scripts/configure-bolt-tailscale-boundary.sh "$DEPLOY_HOST:$REMOTE_CONFIGURE_BOUNDARY"
          scp scripts/verify-bolt-tailscale-boundary.py "$DEPLOY_HOST:$REMOTE_VERIFY_BOUNDARY"
          scp scripts/verify-bolt-phase0-diagnostic-sinks.py "$DEPLOY_HOST:$REMOTE_VERIFY_DIAGNOSTICS"
          scp scripts/refresh-bolt-phase0-synthetic-tokens.py "$DEPLOY_HOST:$REMOTE_REFRESH_TOKENS"

          ssh "$DEPLOY_HOST" \
            "REMOTE_DEPLOY_DIR='$REMOTE_DEPLOY_DIR' REMOTE_RELEASES_DIR='$REMOTE_RELEASES_DIR' REMOTE_RUN_DIR='$REMOTE_RUN_DIR' REMOTE_COMPOSE_FILE='$REMOTE_COMPOSE_FILE' REMOTE_ACTIVE_ENV='$REMOTE_ACTIVE_ENV' REMOTE_CANDIDATE_COMPOSE='$REMOTE_CANDIDATE_COMPOSE' REMOTE_CANDIDATE_ENV='$REMOTE_CANDIDATE_ENV' REMOTE_IMAGE_OVERRIDE='$REMOTE_IMAGE_OVERRIDE' REMOTE_CONFIGURE_BOUNDARY='$REMOTE_CONFIGURE_BOUNDARY' REMOTE_VERIFY_BOUNDARY='$REMOTE_VERIFY_BOUNDARY' REMOTE_VERIFY_DIAGNOSTICS='$REMOTE_VERIFY_DIAGNOSTICS' REMOTE_REFRESH_TOKENS='$REMOTE_REFRESH_TOKENS' XFRAMEWORK_ENV_FILE='$XFRAMEWORK_ENV_FILE' IDENTITY_PUBLIC_URL='$IDENTITY_PUBLIC_URL' HUB_PUBLIC_URL='$HUB_PUBLIC_URL' REGISTRY_HOST='$REGISTRY_HOST' REGISTRY_NAMESPACE='$REGISTRY_NAMESPACE' IMAGE_TAG='$IMAGE_TAG' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' ALLOW_EMPTY_HOST_BOOTSTRAP='$ALLOW_EMPTY_HOST_BOOTSTRAP' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          umask 077
          chmod 600 "$REMOTE_CANDIDATE_COMPOSE"
          chmod 700 "$REMOTE_CONFIGURE_BOUNDARY" "$REMOTE_VERIFY_BOUNDARY" "$REMOTE_VERIFY_DIAGNOSTICS" "$REMOTE_REFRESH_TOKENS"

          test -f "$XFRAMEWORK_ENV_FILE"
          test ! -L "$XFRAMEWORK_ENV_FILE"
          test "$(stat -Lc '%u:%a:%h' "$XFRAMEWORK_ENV_FILE")" = "$(id -u):600:1"

          token_dir="$REMOTE_RUN_DIR/synthetic-tokens"
          install -d -m 700 "$token_dir"
          install -m 600 /dev/null "$token_dir/communications-transport-token"
          install -m 600 /dev/null "$token_dir/communications-identity-service-token"
          install -m 600 /dev/null "$token_dir/portal-transport-token"
          install -m 600 /dev/null "$token_dir/portal-identity-service-token"
          install -m 600 /dev/null "$token_dir/user-actor-token"
          install -m 600 /dev/null "$token_dir/expiry-transport-token"
          python3 - "$XFRAMEWORK_ENV_FILE" "$REMOTE_CANDIDATE_ENV" "$IDENTITY_PUBLIC_URL" "$HUB_PUBLIC_URL" "$token_dir" <<'PY'
          import os
          import pathlib
          import re
          import stat
          import subprocess
          import sys

          source, destination, identity_url, hub_url, token_dir = sys.argv[1:]
          raw = pathlib.Path(source).read_bytes()
          if len(raw) > 1024 * 1024 or raw.startswith(b"\xef\xbb\xbf") or b"\0" in raw:
              raise SystemExit("protected deployment env is invalid")
          text = raw.decode("utf-8", errors="strict").replace("\r\n", "\n")
          if "\r" in text:
              raise SystemExit("protected deployment env is invalid")

          names = re.compile(r"^[A-Za-z_][A-Za-z0-9_]*$")
          values = {}
          order = []
          for number, raw_line in enumerate(text.split("\n"), 1):
              if not raw_line.strip() or raw_line.lstrip().startswith("#"):
                  continue
              name, separator, value = raw_line.partition("=")
              if (
                  not separator
                  or not names.fullmatch(name)
                  or name in values
                  or value != value.strip()
                  or any(ord(character) < 32 or ord(character) == 127 for character in value)
              ):
                  raise SystemExit(f"protected deployment env entry {number} is invalid")
              values[name] = value
              order.append(name)

          service_generation_id = values.get("SERVICE_CREDENTIAL_GENERATION_ID", "")
          if not re.fullmatch(r"[A-Za-z0-9_.:-]{1,96}", service_generation_id):
              raise SystemExit("SERVICE_CREDENTIAL_GENERATION_ID is missing or invalid")

          user_generation_id = values.get("USER_JWT_GENERATION_ID", "")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", user_generation_id):
              raise SystemExit("USER_JWT_GENERATION_ID is missing or invalid")

          key_paths = {
              "IDENTITY_USER_JWT_PRIVATE_KEY_PATH": 0o600,
              "IDENTITY_USER_JWT_PUBLIC_KEY_PATH": 0o644,
          }
          for name, maximum_mode in key_paths.items():
              value = values.get(name, "")
              path = pathlib.Path(value)
              if not value or not path.is_absolute() or path.is_symlink():
                  raise SystemExit(f"{name} must be an absolute regular file path")
              metadata = path.stat()
              if (
                  not stat.S_ISREG(metadata.st_mode)
                  or metadata.st_uid != os.getuid()
                  or stat.S_IMODE(metadata.st_mode) & ~maximum_mode
                  or metadata.st_nlink != 1
                  or metadata.st_size < 256
                  or metadata.st_size > 65536
              ):
                  raise SystemExit(f"{name} has unsafe ownership, permissions, links, or size")

          private_path = values["IDENTITY_USER_JWT_PRIVATE_KEY_PATH"]
          public_path = values["IDENTITY_USER_JWT_PUBLIC_KEY_PATH"]
          try:
              derived_public = subprocess.run(
                  ["openssl", "pkey", "-in", private_path, "-pubout"],
                  check=True,
                  capture_output=True,
              ).stdout
              private_description = subprocess.run(
                  ["openssl", "pkey", "-in", private_path, "-text", "-noout"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              normalized_public = subprocess.run(
                  ["openssl", "pkey", "-pubin", "-in", public_path, "-pubout"],
                  check=True,
                  capture_output=True,
              ).stdout
          except (OSError, subprocess.CalledProcessError) as error:
              raise SystemExit("Identity user JWT key material is not valid PEM") from error
          if derived_public != normalized_public:
              raise SystemExit("Identity user JWT public and private keys do not match")
          key_size = re.search(r"Private-Key:\s*\((\d+) bit", private_description)
          if key_size is None or int(key_size.group(1)) < 2048:
              raise SystemExit("Identity user JWT RSA key size must be at least 2048 bits")

          superseded = {
              "BOLT_HUB_TLS_CA_PATH",
              "BOLT_HUB_TLS_FULLCHAIN_PATH",
              "BOLT_HUB_TLS_PRIVATE_KEY_PATH",
              "BOLT_HUB_PUBLIC_HOSTNAME",
              "IDENTITYSERVER_TLS_CA_PATH",
              "IDENTITYSERVER_TLS_FULLCHAIN_PATH",
              "IDENTITYSERVER_TLS_PRIVATE_KEY_PATH",
              "IDENTITYSERVER_PUBLIC_HOSTNAME",
              "IDENTITYSERVER_PUBLIC_HTTPS_PORT",
              "BOLT_SYNTHETIC_IDENTITYSERVER_CA_PATH",
              "BOLT_SYNTHETIC_COMMUNICATIONS_TOKEN_PATH",
              "BOLT_SYNTHETIC_USER_TOKEN_PATH",
              "BOLT_SYNTHETIC_EXPIRY_TOKEN_PATH",
          }
          for name in superseded:
              values.pop(name, None)
          if not hub_url.startswith("https://"):
              raise SystemExit("Hub public URL must use HTTPS")
          hub_websocket_url = f"wss://{hub_url.removeprefix('https://').rstrip('/')}/bolt/ws"
          overrides = {
              "BOLT_HUB_EXPOSE_PORT": "7000",
              "IDENTITYSERVER_EXPOSE_PORT": "8261",
              "BOLT_SYNTHETIC_IDENTITYSERVER_BASE_URL": identity_url,
              "BOLT_SYNTHETIC_TARGET": hub_websocket_url,
              "BOLT_SYNTHETIC_COMMUNICATIONS_TRANSPORT_TOKEN_PATH": f"{token_dir}/communications-transport-token",
              "BOLT_SYNTHETIC_COMMUNICATIONS_IDENTITY_SERVICE_TOKEN_PATH": f"{token_dir}/communications-identity-service-token",
              "BOLT_SYNTHETIC_PORTAL_TRANSPORT_TOKEN_PATH": f"{token_dir}/portal-transport-token",
              "BOLT_SYNTHETIC_PORTAL_IDENTITY_SERVICE_TOKEN_PATH": f"{token_dir}/portal-identity-service-token",
              "BOLT_SYNTHETIC_USER_ACTOR_TOKEN_PATH": f"{token_dir}/user-actor-token",
              "BOLT_SYNTHETIC_EXPIRY_TRANSPORT_TOKEN_PATH": f"{token_dir}/expiry-transport-token",
          }
          values.update(overrides)
          rendered_order = [name for name in order if name in values]
          rendered_order.extend(name for name in overrides if name not in rendered_order)
          payload = "".join(f"{name}={values[name]}\n" for name in rendered_order).encode("utf-8")
          descriptor = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "wb") as stream:
              stream.write(payload)
              stream.flush()
              os.fsync(stream.fileno())
          PY
          test "$(stat -Lc '%u:%a:%h' "$REMOTE_CANDIDATE_ENV")" = "$(id -u):600:1"

          image_services=(
            migrate identityserver bolt-hub communications
            notifications storage attendance smsgateway wallets inventario pos
            portal operations-dashboard bolt-phase0-synthetics
          )
          python3 - "$REMOTE_IMAGE_OVERRIDE" "$REGISTRY_HOST" "$REGISTRY_NAMESPACE" "$IMAGE_TAG" "${image_services[@]}" <<'PY'
          import json
          import pathlib
          import sys

          output, registry, namespace, tag, *services = sys.argv[1:]
          document = {
              "services": {
                  service: {"image": f"{registry}/{namespace}/{service}:{tag}"}
                  for service in services
              }
          }
          pathlib.Path(output).write_text(
              json.dumps(document, ensure_ascii=True, separators=(",", ":")) + "\n",
              encoding="ascii",
          )
          PY
          chmod 600 "$REMOTE_IMAGE_OVERRIDE"
          /usr/bin/timeout --foreground --kill-after=10s 120s \
            docker compose --project-name "$COMPOSE_PROJECT_NAME" \
              --env-file "$REMOTE_CANDIDATE_ENV" \
              -f "$REMOTE_CANDIDATE_COMPOSE" -f "$REMOTE_IMAGE_OVERRIDE" config --quiet

          selected_release=""
          selected_kind=""
          runtime_snapshot="$REMOTE_RUN_DIR/pre-deployment"
          runtime_services=(
            postgres redis minio seq jaeger identityserver bolt-hub communications notifications storage attendance
            smsgateway wallets inventario pos portal operations-dashboard
          )
          runtime_snapshot_ready=false
          image_arguments=()
          if [ -f "$REMOTE_ACTIVE_ENV" ] && [ ! -L "$REMOTE_ACTIVE_ENV" ] && \
             [ -f "$REMOTE_COMPOSE_FILE" ] && [ ! -L "$REMOTE_COMPOSE_FILE" ]; then
            runtime_snapshot_ready=true
            for service in "${runtime_services[@]}"; do
              if ! image_id="$(docker inspect --format '{{.Image}}' "xframework-${service}" 2>/dev/null)" ||
                 [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] ||
                 ! docker image inspect "$image_id" >/dev/null 2>&1; then
                runtime_snapshot_ready=false
                image_arguments=()
                break
              fi
              image_arguments+=("$service" "$image_id")
            done
          fi
          if [ "$runtime_snapshot_ready" = true ]; then
            install -d -m 700 "$runtime_snapshot"
            install -m 600 "$REMOTE_COMPOSE_FILE" "$runtime_snapshot/docker-compose.yml"
            install -m 600 "$REMOTE_ACTIVE_ENV" "$runtime_snapshot/candidate.env"
            python3 - "$runtime_snapshot/images.override.json" "${image_arguments[@]}" <<'PY'
          import json
          import pathlib
          import sys

          output, *arguments = sys.argv[1:]
          if len(arguments) % 2:
              raise SystemExit("runtime image inventory is invalid")
          services = {
              arguments[index]: {"image": arguments[index + 1]}
              for index in range(0, len(arguments), 2)
          }
          pathlib.Path(output).write_text(
              json.dumps({"services": services}, ensure_ascii=True, separators=(",", ":")) + "\n",
              encoding="ascii",
          )
          PY
            chmod 600 "$runtime_snapshot/images.override.json"
            : > "$runtime_snapshot/complete"
            chmod 600 "$runtime_snapshot/complete"
            selected_release="$runtime_snapshot"
            selected_kind=normal
          fi

          bootstrap_without_rollback=false
          if [ "$ALLOW_EMPTY_HOST_BOOTSTRAP" = true ]; then
            for service in "${runtime_services[@]}"; do
              if docker inspect "xframework-${service}" >/dev/null 2>&1; then
                echo "Empty-host bootstrap refused because xframework-${service} exists." >&2
                exit 1
              fi
            done
            bootstrap_without_rollback=true
          fi

          current_pointer="$REMOTE_RELEASES_DIR/current"
          if [ "$bootstrap_without_rollback" = false ] && [ -z "$selected_release" ] && \
             [ -f "$current_pointer" ] && [ ! -L "$current_pointer" ]; then
            current_release="$(cat "$current_pointer")"
            case "$current_release" in
              "$REMOTE_RELEASES_DIR"/*)
                if [ -f "$current_release/complete" ] && \
                   [ -f "$current_release/docker-compose.yml" ] && \
                   [ -f "$current_release/images.override.json" ] && \
                   [ -f "$current_release/candidate.env" ]; then
                  selected_release="$current_release"
                  selected_kind=normal
                fi
                ;;
            esac
          fi

          legacy_pointer="$REMOTE_DEPLOY_DIR/phase0-last-known-good/current"
          if [ "$bootstrap_without_rollback" = false ] && [ -z "$selected_release" ] && \
             [ -f "$legacy_pointer" ] && [ ! -L "$legacy_pointer" ]; then
            legacy_release="$(cat "$legacy_pointer")"
            case "$legacy_release" in
              "$REMOTE_DEPLOY_DIR"/runs/*)
                if [ -f "$legacy_release/docker-compose.yml" ] && \
                   [ -f "$legacy_release/pinned-compose.override.json" ] && \
                   [ -f "$legacy_release/security-qualified" ]; then
                  selected_release="$legacy_release"
                  selected_kind=legacy
                fi
                ;;
            esac
          fi

          if [ -n "$selected_release" ]; then
            previous_compose_json="$REMOTE_RUN_DIR/previous-compose.json"
            previous_requirements="$REMOTE_RUN_DIR/previous-requirements"
            if [ "$selected_kind" = normal ]; then
              previous_env="$selected_release/candidate.env"
              previous_compose=(
                -f "$selected_release/docker-compose.yml"
                -f "$selected_release/images.override.json"
              )
            else
              previous_env="$REMOTE_RUN_DIR/legacy-previous.env"
              install -m 600 "$XFRAMEWORK_ENV_FILE" "$previous_env"
              previous_compose=(
                -f "$selected_release/docker-compose.yml"
                -f "$selected_release/pinned-compose.override.json"
              )
            fi
            /usr/bin/timeout --foreground --kill-after=10s 120s \
              docker compose --project-name "$COMPOSE_PROJECT_NAME" \
                --env-file "$previous_env" "${previous_compose[@]}" \
                config --format json > "$previous_compose_json"
            python3 - "$previous_compose_json" > "$previous_requirements" <<'PY'
          import json
          import pathlib
          import sys

          document = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          required_services = (
              "postgres", "redis", "minio", "seq", "jaeger", "identityserver", "bolt-hub",
              "communications", "notifications", "storage", "attendance", "smsgateway", "wallets",
              "inventario", "pos", "portal", "operations-dashboard",
          )
          services = document.get("services", {})
          for name in required_services:
              image = services.get(name, {}).get("image")
              if not image:
                  raise SystemExit(f"rollback service {name} has no image")
              print(f"image\t{image}")
          for secret in document.get("secrets", {}).values():
              file_path = secret.get("file") if isinstance(secret, dict) else None
              if file_path:
                  print(f"file\t{file_path}")
          PY
            while IFS=$'\t' read -r requirement value; do
              case "$requirement" in
                image)
                  docker image inspect "$value" >/dev/null ||
                    /usr/bin/timeout --foreground --kill-after=10s 10m docker pull "$value"
                  ;;
                file) test -f "$value" && test ! -L "$value" ;;
                *) echo "Unknown rollback requirement." >&2; exit 1 ;;
              esac
            done < "$previous_requirements"
            printf '%s\n' "$selected_release" > "$REMOTE_RUN_DIR/previous-release"
            printf '%s\n' "$selected_kind" > "$REMOTE_RUN_DIR/previous-release-kind"
            chmod 600 "$REMOTE_RUN_DIR/previous-release" "$REMOTE_RUN_DIR/previous-release-kind"
            echo "Captured ${selected_kind} release: ${selected_release}"
          elif [ "$bootstrap_without_rollback" = true ]; then
            : > "$REMOTE_RUN_DIR/bootstrap-without-rollback"
            chmod 600 "$REMOTE_RUN_DIR/bootstrap-without-rollback"
            echo "Authorized empty-host bootstrap; no rollback release will be available."
          else
            echo "No complete previous release is available; transition is blocked before mutation." >&2
            exit 1
          fi
          tailscale serve status --json > "$REMOTE_RUN_DIR/tailscale-serve-before.json"
          chmod 600 "$REMOTE_RUN_DIR/tailscale-serve-before.json"
          REMOTE_SCRIPT

      - name: Pull candidate images
        shell: bash
        run: |
          set -euo pipefail
          services=(
            postgres redis minio seq jaeger migrate identityserver bolt-hub communications
            notifications storage attendance smsgateway wallets inventario pos
            portal operations-dashboard bolt-phase0-synthetics
          )
          service_args="$(printf '%q ' "${services[@]}")"
          ssh "$DEPLOY_HOST" \
            "COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' XFRAMEWORK_ENV_FILE='$REMOTE_CANDIDATE_ENV' REMOTE_CANDIDATE_COMPOSE='$REMOTE_CANDIDATE_COMPOSE' REMOTE_IMAGE_OVERRIDE='$REMOTE_IMAGE_OVERRIDE' bash -s -- $service_args" <<'REMOTE_SCRIPT'
          set -euo pipefail
          /usr/bin/timeout --foreground --kill-after=30s 900s \
            docker compose --project-name "$COMPOSE_PROJECT_NAME" \
              --env-file "$XFRAMEWORK_ENV_FILE" \
              -f "$REMOTE_CANDIDATE_COMPOSE" -f "$REMOTE_IMAGE_OVERRIDE" pull "$@"
          umask 077
          python3 - "$REMOTE_IMAGE_OVERRIDE" "$XFRAMEWORK_ENV_FILE" "$REMOTE_CANDIDATE_COMPOSE" "$@" <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          path = pathlib.Path(sys.argv[1])
          env_file, compose_file, *service_names = sys.argv[2:]
          rendered = subprocess.run(
              [
                  "docker", "compose", "--profile", "phase0-verification", "--env-file", env_file,
                  "-f", compose_file, "-f", str(path), "config", "--format", "json",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          compose = json.loads(rendered.stdout)
          resolved_services = {}
          for service in service_names:
              reference = compose.get("services", {}).get(service, {}).get("image")
              if not reference:
                  raise SystemExit(f"candidate service {service} has no image")
              result = subprocess.run(
                  ["docker", "image", "inspect", "--format", "{{.Id}}", reference],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              image_id = result.stdout.strip()
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", image_id):
                  raise SystemExit(f"resolved image ID for {service} is invalid")
              resolved_services[service] = {"image": image_id}
          document = {"services": resolved_services}
          temporary = path.with_name(f".{path.name}.tmp.{os.getpid()}")
          temporary.write_text(
              json.dumps(document, ensure_ascii=True, separators=(",", ":")) + "\n",
              encoding="ascii",
          )
          os.chmod(temporary, 0o600)
          os.replace(temporary, path)
          PY
          REMOTE_SCRIPT

      - name: Verify transition prerequisites before mutation
        shell: bash
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" "REMOTE_RUN_DIR='$REMOTE_RUN_DIR' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          watchdog_active="$(systemctl is-active xframework-bolt-phase0-watchdog.timer 2>/dev/null || true)"
          watchdog_enabled="$(systemctl is-enabled xframework-bolt-phase0-watchdog.timer 2>/dev/null || true)"
          if [ "$watchdog_active" = active ] || [ "$watchdog_enabled" = enabled ]; then
            echo "Legacy Bolt watchdog must be stopped and disabled by an operator before transition." >&2
            exit 1
          fi
          watchdog_service="$(systemctl is-active xframework-bolt-phase0-watchdog.service 2>/dev/null || true)"
          case "$watchdog_service" in
            inactive|failed|unknown) ;;
            *) echo "Legacy Bolt watchdog service is still running or changing state." >&2; exit 1 ;;
          esac
          lease_state=/home/github-runner/xframework-deploy/phase0-watchdog/deployment-lease.json
          if [ -e "$lease_state" ]; then
            echo "Legacy Bolt deployment lease is still armed." >&2
            exit 1
          fi
          lease_lock=/usr/local/libexec/xframework-bolt-phase0/deployment-lease.lock
          if [ -e "$lease_lock" ]; then
            command -v flock >/dev/null
            exec 9<"$lease_lock"
            if ! flock -n 9; then
              echo "Legacy Bolt deployment controller still holds its lease lock." >&2
              exit 1
            fi
            flock -u 9
            exec 9<&-
          fi

          journal_probe="$REMOTE_RUN_DIR/tailscale-journal-preflight"
          if ! /usr/bin/timeout --foreground --kill-after=5s 30s \
            journalctl --unit=tailscaled.service --lines=1 --show-cursor --no-pager \
              --output=cat > "$journal_probe" 2>&1
          then
            rm -f "$journal_probe"
            echo "github-runner requires read-only systemd-journal membership before transition." >&2
            exit 1
          fi
          if ! grep -q '^-- cursor: ' "$journal_probe"; then
            rm -f "$journal_probe"
            echo "Tailscale journal preflight did not return a cursor." >&2
            exit 1
          fi
          rm -f "$journal_probe"
          REMOTE_SCRIPT

      - name: Stop legacy Bolt Hub for bounded transition
        shell: bash
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" "REMOTE_RUN_DIR='$REMOTE_RUN_DIR' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          : > "$REMOTE_RUN_DIR/mutation-started"
          if docker inspect xframework-bolt-hub >/dev/null 2>&1; then
            /usr/bin/timeout --foreground --kill-after=10s 60s docker stop xframework-bolt-hub
          fi
          REMOTE_SCRIPT

      - name: Run migration
        shell: bash
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" \
            "COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' XFRAMEWORK_ENV_FILE='$REMOTE_CANDIDATE_ENV' REMOTE_RUN_DIR='$REMOTE_RUN_DIR' REMOTE_CANDIDATE_COMPOSE='$REMOTE_CANDIDATE_COMPOSE' REMOTE_IMAGE_OVERRIDE='$REMOTE_IMAGE_OVERRIDE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          compose=(docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$XFRAMEWORK_ENV_FILE" -f "$REMOTE_CANDIDATE_COMPOSE" -f "$REMOTE_IMAGE_OVERRIDE")
          /usr/bin/timeout --foreground --kill-after=30s 300s \
            "${compose[@]}" up -d --no-build postgres redis minio seq jaeger
          /usr/bin/timeout --foreground --kill-after=10s 120s \
            "${compose[@]}" run --rm --no-deps minio-init
          /usr/bin/timeout --foreground --kill-after=30s 600s \
            "${compose[@]}" run --rm migrate
          REMOTE_SCRIPT

      - name: Configure and verify Tailscale Serve boundary
        shell: bash
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" \
            "COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' XFRAMEWORK_ENV_FILE='$REMOTE_CANDIDATE_ENV' REMOTE_RUN_DIR='$REMOTE_RUN_DIR' REMOTE_CANDIDATE_COMPOSE='$REMOTE_CANDIDATE_COMPOSE' REMOTE_IMAGE_OVERRIDE='$REMOTE_IMAGE_OVERRIDE' REMOTE_CONFIGURE_BOUNDARY='$REMOTE_CONFIGURE_BOUNDARY' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          compose_json="$REMOTE_RUN_DIR/compose.json"
          /usr/bin/timeout --foreground --kill-after=10s 120s \
            docker compose --project-name "$COMPOSE_PROJECT_NAME" \
              --env-file "$XFRAMEWORK_ENV_FILE" \
              -f "$REMOTE_CANDIDATE_COMPOSE" -f "$REMOTE_IMAGE_OVERRIDE" \
              config --format json > "$compose_json"
          /usr/bin/timeout --foreground --kill-after=10s 120s \
            bash "$REMOTE_CONFIGURE_BOUNDARY" \
              --compose-json "$compose_json" \
              --evidence "$REMOTE_RUN_DIR/tailscale-boundary.json"
          REMOTE_SCRIPT

      - name: Deploy IdentityServer
        shell: bash
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" \
            "COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' XFRAMEWORK_ENV_FILE='$REMOTE_CANDIDATE_ENV' REMOTE_CANDIDATE_COMPOSE='$REMOTE_CANDIDATE_COMPOSE' REMOTE_IMAGE_OVERRIDE='$REMOTE_IMAGE_OVERRIDE' IDENTITY_PUBLIC_URL='$IDENTITY_PUBLIC_URL' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          compose=(docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$XFRAMEWORK_ENV_FILE" -f "$REMOTE_CANDIDATE_COMPOSE" -f "$REMOTE_IMAGE_OVERRIDE")
          /usr/bin/timeout --foreground --kill-after=30s 300s \
            "${compose[@]}" up -d --no-build --no-deps --force-recreate identityserver
          for attempt in $(seq 1 40); do
            if curl -fsS --connect-timeout 3 --max-time 10 "$IDENTITY_PUBLIC_URL/health/ready" >/dev/null; then
              exit 0
            fi
            echo "IdentityServer not ready; attempt ${attempt}/40"
            sleep 5
          done
          exit 1
          REMOTE_SCRIPT

      - name: Deploy Bolt Hub
        shell: bash
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" \
            "COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' XFRAMEWORK_ENV_FILE='$REMOTE_CANDIDATE_ENV' REMOTE_CANDIDATE_COMPOSE='$REMOTE_CANDIDATE_COMPOSE' REMOTE_IMAGE_OVERRIDE='$REMOTE_IMAGE_OVERRIDE' HUB_PUBLIC_URL='$HUB_PUBLIC_URL' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          compose=(docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$XFRAMEWORK_ENV_FILE" -f "$REMOTE_CANDIDATE_COMPOSE" -f "$REMOTE_IMAGE_OVERRIDE")
          /usr/bin/timeout --foreground --kill-after=30s 300s \
            "${compose[@]}" up -d --no-build --no-deps --force-recreate bolt-hub
          for attempt in $(seq 1 40); do
            if curl -fsS --connect-timeout 3 --max-time 10 "$HUB_PUBLIC_URL/health/ready" >/dev/null; then
              exit 0
            fi
            echo "Bolt Hub not ready; attempt ${attempt}/40"
            sleep 5
          done
          exit 1
          REMOTE_SCRIPT

      - name: Deploy Communications
        shell: bash
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" \
            "COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' XFRAMEWORK_ENV_FILE='$REMOTE_CANDIDATE_ENV' REMOTE_CANDIDATE_COMPOSE='$REMOTE_CANDIDATE_COMPOSE' REMOTE_IMAGE_OVERRIDE='$REMOTE_IMAGE_OVERRIDE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          compose=(docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$XFRAMEWORK_ENV_FILE" -f "$REMOTE_CANDIDATE_COMPOSE" -f "$REMOTE_IMAGE_OVERRIDE")
          /usr/bin/timeout --foreground --kill-after=30s 300s \
            "${compose[@]}" up -d --no-build --no-deps --force-recreate communications
          for attempt in $(seq 1 40); do
            if curl -fsS --connect-timeout 3 --max-time 10 http://127.0.0.1:5148/health/ready >/dev/null; then
              exit 0
            fi
            echo "Communications not ready; attempt ${attempt}/40"
            sleep 5
          done
          exit 1
          REMOTE_SCRIPT

      - name: Run authenticated Bolt smoke
        shell: bash
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" \
            "COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' REMOTE_CANDIDATE_ENV='$REMOTE_CANDIDATE_ENV' REMOTE_RUN_DIR='$REMOTE_RUN_DIR' REMOTE_CANDIDATE_COMPOSE='$REMOTE_CANDIDATE_COMPOSE' REMOTE_IMAGE_OVERRIDE='$REMOTE_IMAGE_OVERRIDE' REMOTE_REFRESH_TOKENS='$REMOTE_REFRESH_TOKENS' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          umask 077
          journal_probe="$REMOTE_RUN_DIR/tailscale-journal-probe"
          if ! /usr/bin/timeout --foreground --kill-after=5s 30s \
            journalctl --unit=tailscaled.service --lines=1 --show-cursor --no-pager \
              --output=cat > "$journal_probe" 2>&1
          then
            rm -f "$journal_probe"
            echo "Tailscale journal is not safely readable; grant github-runner read-only journal access before deployment." >&2
            exit 1
          fi
          cursor="$(sed -n 's/^-- cursor: //p' "$journal_probe" | tail -n 1)"
          rm -f "$journal_probe"
          if [ -z "$cursor" ]; then
            echo "Tailscale journal did not expose a readable cursor; deployment remains blocked pending operator access." >&2
            exit 1
          fi
          python3 - "$cursor" <<'PY'
          import sys

          raw = sys.argv[1].encode("ascii", errors="strict")
          if not 1 <= len(raw) <= 2048 or any(byte < 33 or byte > 126 for byte in raw):
              raise SystemExit("Tailscale journal cursor is invalid")
          PY
          printf '%s\n' "$cursor" > "$REMOTE_RUN_DIR/tailscale-journal-cursor"
          chmod 600 "$REMOTE_RUN_DIR/tailscale-journal-cursor"
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "$REMOTE_RUN_DIR/diagnostic-window-start"
          chmod 600 "$REMOTE_RUN_DIR/diagnostic-window-start"

          env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME="${HOME:-/tmp}" \
            XFRAMEWORK_ENV_FILE="$REMOTE_CANDIDATE_ENV" \
            BOLT_SYNTHETIC_REFRESH_RECEIPT="$REMOTE_RUN_DIR/token-refresh.json" \
            BOLT_SYNTHETIC_EXPIRY_ENABLED=true \
            /usr/bin/timeout --foreground --kill-after=10s 120s \
              python3 -B "$REMOTE_REFRESH_TOKENS"
          /usr/bin/timeout --foreground --kill-after=30s 420s \
            docker compose --project-name "$COMPOSE_PROJECT_NAME" \
              --env-file "$REMOTE_CANDIDATE_ENV" \
              -f "$REMOTE_CANDIDATE_COMPOSE" -f "$REMOTE_IMAGE_OVERRIDE" \
              --profile phase0-verification run --rm --no-deps bolt-phase0-synthetics \
              | tee "$REMOTE_RUN_DIR/bolt-smoke.json"
          REMOTE_SCRIPT

      - name: Observe core services
        shell: bash
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" \
            "IDENTITY_PUBLIC_URL='$IDENTITY_PUBLIC_URL' HUB_PUBLIC_URL='$HUB_PUBLIC_URL' OBSERVATION_SECONDS='$OBSERVATION_SECONDS' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          [[ "$OBSERVATION_SECONDS" =~ ^[1-9][0-9]{1,3}$ ]]
          deadline=$((SECONDS + OBSERVATION_SECONDS))
          samples=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            curl -fsS --connect-timeout 3 --max-time 10 "$IDENTITY_PUBLIC_URL/health/live" >/dev/null
            curl -fsS --connect-timeout 3 --max-time 10 "$HUB_PUBLIC_URL/health/ready" >/dev/null
            curl -fsS --connect-timeout 3 --max-time 10 http://127.0.0.1:5148/health/ready >/dev/null
            samples=$((samples + 1))
            remaining=$((deadline - SECONDS))
            [ "$remaining" -le 0 ] && break
            [ "$remaining" -lt 15 ] && sleep "$remaining" || sleep 15
          done
          test "$samples" -ge 4
          echo "Core observation passed with ${samples} samples."
          REMOTE_SCRIPT

      - name: Verify diagnostic sink marker absence
        shell: bash
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" \
            "COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' REMOTE_CANDIDATE_ENV='$REMOTE_CANDIDATE_ENV' REMOTE_RUN_DIR='$REMOTE_RUN_DIR' REMOTE_CANDIDATE_COMPOSE='$REMOTE_CANDIDATE_COMPOSE' REMOTE_IMAGE_OVERRIDE='$REMOTE_IMAGE_OVERRIDE' REMOTE_VERIFY_DIAGNOSTICS='$REMOTE_VERIFY_DIAGNOSTICS' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          umask 077
          cursor="$(cat "$REMOTE_RUN_DIR/tailscale-journal-cursor")"
          window_start="$(cat "$REMOTE_RUN_DIR/diagnostic-window-start")"
          journal_output="$REMOTE_RUN_DIR/tailscale-journal-after-smoke.log"
          container_output="$REMOTE_RUN_DIR/container-logs-after-smoke.log"
          trap 'rm -f "$journal_output" "$container_output"' EXIT

          sleep 15
          if ! /usr/bin/timeout --foreground --kill-after=5s 60s \
            journalctl --unit=tailscaled.service --after-cursor="$cursor" --no-pager \
              --show-cursor --output=cat > "$journal_output" 2>&1
          then
            echo "Tailscale journal check could not read the bounded window; deployment remains blocked." >&2
            exit 1
          fi
          grep -q '^-- cursor: ' "$journal_output"

          compose=(docker compose --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file "$REMOTE_CANDIDATE_ENV" \
            -f "$REMOTE_CANDIDATE_COMPOSE" -f "$REMOTE_IMAGE_OVERRIDE")
          /usr/bin/timeout --foreground --kill-after=10s 90s \
            "${compose[@]}" logs --no-color --since "$window_start" > "$container_output"
          chmod 600 "$journal_output" "$container_output"

          seq_binding="$("${compose[@]}" port seq 80 | head -n 1)"
          [[ "$seq_binding" =~ :([1-9][0-9]{0,4})$ ]]
          seq_port="${BASH_REMATCH[1]}"
          jaeger_binding="$("${compose[@]}" port jaeger 16686 | head -n 1)"
          [[ "$jaeger_binding" =~ :([1-9][0-9]{0,4})$ ]]
          jaeger_port="${BASH_REMATCH[1]}"

          /usr/bin/timeout --foreground --kill-after=10s 180s \
            python3 -B "$REMOTE_VERIFY_DIAGNOSTICS" \
              --candidate-env "$REMOTE_CANDIDATE_ENV" \
              --bounded-file "$journal_output" \
              --bounded-file "$container_output" \
              --bounded-file "$REMOTE_RUN_DIR/bolt-smoke.json" \
              --window-start "$window_start" \
              --seq-base-url "http://127.0.0.1:${seq_port}" \
              --jaeger-base-url "http://127.0.0.1:${jaeger_port}" \
              --evidence "$REMOTE_RUN_DIR/diagnostic-sinks.json"
          rm -f \
            "$REMOTE_RUN_DIR/synthetic-tokens/communications-transport-token" \
            "$REMOTE_RUN_DIR/synthetic-tokens/communications-identity-service-token" \
            "$REMOTE_RUN_DIR/synthetic-tokens/portal-transport-token" \
            "$REMOTE_RUN_DIR/synthetic-tokens/portal-identity-service-token" \
            "$REMOTE_RUN_DIR/synthetic-tokens/user-actor-token" \
            "$REMOTE_RUN_DIR/synthetic-tokens/expiry-transport-token"
          rmdir "$REMOTE_RUN_DIR/synthetic-tokens"
          REMOTE_SCRIPT

      - name: Deploy remaining clients
        shell: bash
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" \
            "COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' XFRAMEWORK_ENV_FILE='$REMOTE_CANDIDATE_ENV' REMOTE_CANDIDATE_COMPOSE='$REMOTE_CANDIDATE_COMPOSE' REMOTE_IMAGE_OVERRIDE='$REMOTE_IMAGE_OVERRIDE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          clients=(notifications storage attendance smsgateway wallets inventario pos portal operations-dashboard)
          compose=(docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$XFRAMEWORK_ENV_FILE" -f "$REMOTE_CANDIDATE_COMPOSE" -f "$REMOTE_IMAGE_OVERRIDE")
          /usr/bin/timeout --foreground --kill-after=30s 600s \
            "${compose[@]}" up -d --no-build --no-deps --force-recreate "${clients[@]}"

          checks=(
            notifications=http://127.0.0.1:5166/health/ready
            storage=http://127.0.0.1:5190/health/ready
            attendance=http://127.0.0.1:5182/health/ready
            smsgateway=http://127.0.0.1:5274/health/ready
            wallets=http://127.0.0.1:9696/health/ready
            inventario=http://127.0.0.1:8105/health/ready
            pos=http://127.0.0.1:8115/health/ready
            portal=http://127.0.0.1:5000/health/ready
            operations-dashboard=http://127.0.0.1:5050/health/ready
          )
          for check in "${checks[@]}"; do
            name="${check%%=*}"
            url="${check#*=}"
            ready=0
            for attempt in $(seq 1 40); do
              if curl -fsS --connect-timeout 3 --max-time 10 "$url" >/dev/null; then
                ready=1
                break
              fi
              echo "${name} not ready; attempt ${attempt}/40"
              sleep 5
            done
            test "$ready" -eq 1
          done
          REMOTE_SCRIPT

      - name: Activate complete release
        shell: bash
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" \
            "REMOTE_RELEASES_DIR='$REMOTE_RELEASES_DIR' REMOTE_RUN_DIR='$REMOTE_RUN_DIR' REMOTE_COMPOSE_FILE='$REMOTE_COMPOSE_FILE' REMOTE_ACTIVE_ENV='$REMOTE_ACTIVE_ENV' REMOTE_CANDIDATE_COMPOSE='$REMOTE_CANDIDATE_COMPOSE' REMOTE_CANDIDATE_ENV='$REMOTE_CANDIDATE_ENV' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          umask 077
          compose_tmp="${REMOTE_COMPOSE_FILE}.tmp.$$"
          install -m 600 "$REMOTE_CANDIDATE_COMPOSE" "$compose_tmp"
          mv -f "$compose_tmp" "$REMOTE_COMPOSE_FILE"
          active_env_tmp="${REMOTE_ACTIVE_ENV}.tmp.$$"
          install -m 600 "$REMOTE_CANDIDATE_ENV" "$active_env_tmp"
          mv -f "$active_env_tmp" "$REMOTE_ACTIVE_ENV"
          token_dir="$REMOTE_RUN_DIR/synthetic-tokens"
          install -d -m 700 "$token_dir"
          install -m 600 /dev/null "$token_dir/communications-transport-token"
          install -m 600 /dev/null "$token_dir/communications-identity-service-token"
          install -m 600 /dev/null "$token_dir/portal-transport-token"
          install -m 600 /dev/null "$token_dir/portal-identity-service-token"
          install -m 600 /dev/null "$token_dir/user-actor-token"
          install -m 600 /dev/null "$token_dir/expiry-transport-token"
          printf '%s\n' "$IMAGE_TAG" > "$REMOTE_RUN_DIR/commit"
          : > "$REMOTE_RUN_DIR/complete"
          chmod 600 "$REMOTE_RUN_DIR/commit" "$REMOTE_RUN_DIR/complete"
          pointer="$REMOTE_RELEASES_DIR/.current.tmp.$$"
          printf '%s\n' "$REMOTE_RUN_DIR" > "$pointer"
          chmod 600 "$pointer"
          mv -f "$pointer" "$REMOTE_RELEASES_DIR/current"
          rm -f "$REMOTE_RUN_DIR/mutation-started" "$REMOTE_RUN_DIR/bootstrap-without-rollback"
          REMOTE_SCRIPT

      - name: Restore previous release or stop Bolt Hub
        if: ${{ (failure() || cancelled()) && steps.ssh_setup.outcome == 'success' }}
        shell: bash
        env:
          DEPLOY_SSH_OPERATION_TIMEOUT_SECONDS: 900
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" \
            "REMOTE_RELEASES_DIR='$REMOTE_RELEASES_DIR' REMOTE_RUN_DIR='$REMOTE_RUN_DIR' REMOTE_COMPOSE_FILE='$REMOTE_COMPOSE_FILE' REMOTE_ACTIVE_ENV='$REMOTE_ACTIVE_ENV' REMOTE_CONFIGURE_BOUNDARY='$REMOTE_CONFIGURE_BOUNDARY' REMOTE_CANDIDATE_COMPOSE='$REMOTE_CANDIDATE_COMPOSE' REMOTE_CANDIDATE_ENV='$REMOTE_CANDIDATE_ENV' REMOTE_IMAGE_OVERRIDE='$REMOTE_IMAGE_OVERRIDE' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cleanup_synthetic_tokens() {
            rm -f \
              "$REMOTE_RUN_DIR/synthetic-tokens/communications-transport-token" \
              "$REMOTE_RUN_DIR/synthetic-tokens/communications-identity-service-token" \
              "$REMOTE_RUN_DIR/synthetic-tokens/portal-transport-token" \
              "$REMOTE_RUN_DIR/synthetic-tokens/portal-identity-service-token" \
              "$REMOTE_RUN_DIR/synthetic-tokens/user-actor-token" \
              "$REMOTE_RUN_DIR/synthetic-tokens/expiry-transport-token"
            rmdir "$REMOTE_RUN_DIR/synthetic-tokens" 2>/dev/null || true
          }
          trap cleanup_synthetic_tokens EXIT
          if [ ! -f "$REMOTE_RUN_DIR/mutation-started" ]; then
            echo "No remote service mutation began; rollback is not required."
            exit 0
          fi

          stop_hub() {
            echo "Stopping Bolt Hub because no complete rollback could be applied." >&2
            rm -f "$REMOTE_RUN_DIR/complete"
            if [ -f "$REMOTE_RELEASES_DIR/current" ] && \
               [ "$(cat "$REMOTE_RELEASES_DIR/current")" = "$REMOTE_RUN_DIR" ]; then
              rm -f "$REMOTE_RELEASES_DIR/current"
            fi
            /usr/bin/timeout --foreground --kill-after=10s 60s docker stop xframework-bolt-hub >/dev/null 2>&1 || \
              /usr/bin/timeout --foreground --kill-after=10s 30s docker kill xframework-bolt-hub >/dev/null 2>&1 || true
          }
          trap 'stop_hub; exit 1' ERR

          if [ -f "$REMOTE_RUN_DIR/bootstrap-without-rollback" ]; then
            echo "No previous release exists; removing the failed bootstrap containers." >&2
            compose=(docker compose --project-name "$COMPOSE_PROJECT_NAME" \
              --env-file "$REMOTE_CANDIDATE_ENV" \
              -f "$REMOTE_CANDIDATE_COMPOSE" -f "$REMOTE_IMAGE_OVERRIDE")
            /usr/bin/timeout --foreground --kill-after=30s 300s \
              "${compose[@]}" down --remove-orphans
            rm -f "$REMOTE_RUN_DIR/complete" "$REMOTE_RUN_DIR/mutation-started"
            trap - ERR
            exit 0
          fi

          test -f "$REMOTE_RUN_DIR/previous-release"
          test -f "$REMOTE_RUN_DIR/previous-release-kind"
          release="$(cat "$REMOTE_RUN_DIR/previous-release")"
          kind="$(cat "$REMOTE_RUN_DIR/previous-release-kind")"
          services=(identityserver bolt-hub communications notifications storage attendance smsgateway wallets inventario pos portal operations-dashboard)

          if [ "$kind" = normal ]; then
            test -f "$release/complete"
            test -f "$release/docker-compose.yml"
            test -f "$release/images.override.json"
            test -f "$release/candidate.env"
            compose_files=(-f "$release/docker-compose.yml" -f "$release/images.override.json")
            deploy_env="$release/candidate.env"
            compose_json="$REMOTE_RUN_DIR/rollback-compose.json"
            /usr/bin/timeout --foreground --kill-after=10s 120s \
              docker compose --project-name "$COMPOSE_PROJECT_NAME" \
                --env-file "$deploy_env" "${compose_files[@]}" \
                config --format json > "$compose_json"
            /usr/bin/timeout --foreground --kill-after=10s 120s \
              bash "$REMOTE_CONFIGURE_BOUNDARY" --compose-json "$compose_json" \
                --evidence "$REMOTE_RUN_DIR/rollback-tailscale-boundary.json"
          elif [ "$kind" = legacy ]; then
            test -f "$release/security-qualified"
            test -f "$release/docker-compose.yml"
            test -f "$release/pinned-compose.override.json"
            compose_files=(-f "$release/docker-compose.yml" -f "$release/pinned-compose.override.json")
            deploy_env="$REMOTE_RUN_DIR/legacy-previous.env"
            test -f "$deploy_env"
            /usr/bin/timeout --foreground --kill-after=10s 30s tailscale serve --bg --yes --https=7000 off
            /usr/bin/timeout --foreground --kill-after=10s 30s tailscale serve --bg --yes --https=8261 off
          else
            echo "Unknown rollback release kind." >&2
            exit 1
          fi

          compose=(docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$deploy_env" "${compose_files[@]}")
          /usr/bin/timeout --foreground --kill-after=30s 300s \
            "${compose[@]}" up -d --no-build postgres redis minio seq jaeger
          for service in "${services[@]}"; do
            /usr/bin/timeout --foreground --kill-after=30s 180s \
              "${compose[@]}" up -d --no-build --no-deps --force-recreate "$service"
          done

          for service in "${services[@]}"; do
            container="xframework-${service}"
            ready=0
            for attempt in $(seq 1 40); do
              state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{if .State.Running}}running{{else}}stopped{{end}}{{end}}' "$container" 2>/dev/null || true)"
              if [ "$state" = healthy ] || [ "$state" = running ]; then
                ready=1
                break
              fi
              sleep 5
            done
            test "$ready" -eq 1
          done
          if [ "$kind" = normal ]; then
            compose_tmp="${REMOTE_COMPOSE_FILE}.tmp.$$"
            install -m 600 "$release/docker-compose.yml" "$compose_tmp"
            mv -f "$compose_tmp" "$REMOTE_COMPOSE_FILE"
          fi
          rm -f "$REMOTE_RUN_DIR/complete"
          if [ "$kind" = normal ]; then
            active_env_tmp="${REMOTE_ACTIVE_ENV}.tmp.$$"
            install -m 600 "$deploy_env" "$active_env_tmp"
            mv -f "$active_env_tmp" "$REMOTE_ACTIVE_ENV"
            case "$release" in "$REMOTE_RELEASES_DIR"/*) ;; *) exit 1 ;; esac
            pointer="$REMOTE_RELEASES_DIR/.current.rollback.$$"
            printf '%s\n' "$release" > "$pointer"
            chmod 600 "$pointer"
            mv -f "$pointer" "$REMOTE_RELEASES_DIR/current"
          else
            rm -f "$REMOTE_ACTIVE_ENV"
            rm -f "$REMOTE_RELEASES_DIR/current"
          fi
          trap - ERR
          echo "Restored ${kind} release: ${release}"
          REMOTE_SCRIPT

      - name: Deployment diagnostics
        if: ${{ (failure() || cancelled()) && steps.ssh_setup.outcome == 'success' }}
        shell: bash
        env:
          DEPLOY_SSH_OPERATION_TIMEOUT_SECONDS: 300
        run: |
          set +e
          ssh "$DEPLOY_HOST" \
            "COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' XFRAMEWORK_ENV_FILE='$REMOTE_CANDIDATE_ENV' REMOTE_CANDIDATE_COMPOSE='$REMOTE_CANDIDATE_COMPOSE' REMOTE_IMAGE_OVERRIDE='$REMOTE_IMAGE_OVERRIDE' bash -s" <<'REMOTE_SCRIPT'
          set +e
          tailscale serve status
          docker compose --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file "$XFRAMEWORK_ENV_FILE" \
            -f "$REMOTE_CANDIDATE_COMPOSE" -f "$REMOTE_IMAGE_OVERRIDE" ps
          echo "Raw container logs remain on xeon-dev and are not copied to GitHub Actions because they may contain credentials."
          REMOTE_SCRIPT

      - name: Remove local compose token placeholders
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f \
            "$BOLT_SYNTHETIC_COMMUNICATIONS_TRANSPORT_TOKEN_PATH" \
            "$BOLT_SYNTHETIC_COMMUNICATIONS_IDENTITY_SERVICE_TOKEN_PATH" \
            "$BOLT_SYNTHETIC_PORTAL_TRANSPORT_TOKEN_PATH" \
            "$BOLT_SYNTHETIC_PORTAL_IDENTITY_SERVICE_TOKEN_PATH" \
            "$BOLT_SYNTHETIC_USER_ACTOR_TOKEN_PATH" \
            "$BOLT_SYNTHETIC_EXPIRY_TRANSPORT_TOKEN_PATH"
