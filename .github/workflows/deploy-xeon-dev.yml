          heartbeat_loop & heartbeat_pid=$!
          for _ in $(seq 1 100); do
            [ -e "$heartbeat_ready" ] && break
            if [ -e "$heartbeat_failed" ] || ! kill -0 "$heartbeat_pid" >/dev/null 2>&1; then
