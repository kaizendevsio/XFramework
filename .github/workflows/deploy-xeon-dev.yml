            container_id="$(/usr/bin/timeout --foreground --kill-after=10s 30s "${compose[@]}" ps --quiet "$service")"
            for attempt in $(seq 1 60); do
              heartbeat
              health="$(/usr/bin/timeout --foreground --kill-after=10s 30s docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container_id")"
              if [ "$health" = healthy ]; then break; fi
              sleep 5
            done
            test "$(/usr/bin/timeout --foreground --kill-after=10s 30s docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container_id")" = healthy
          done
          REMOTE_SCRIPT
          bash scripts/run-bolt-phase0-synthetics.sh finalized

      - name: Prove finalized credential convergence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/bolt-phase0-evidence"
          remote_verifier="$REMOTE_DEPLOY_DIR/verify-bolt-phase0-credential-convergence.py"
          remote_input="$REMOTE_RUN_DIR/credential-convergence-finalized-input.json"
          remote_evidence="$REMOTE_RUN_DIR/credential-convergence-finalized.json"
          services=(bolt-hub identityserver communications notifications storage attendance smsgateway wallets inventario pos portal operations-dashboard)
          service_args="$(printf '%q ' "${services[@]}")"
          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' XFRAMEWORK_ENV_FILE='$XFRAMEWORK_ENV_FILE' ENV_PARSER='$REMOTE_ENV_PARSER' REMOTE_COMPOSE_FILE='$REMOTE_COMPOSE_FILE' REMOTE_PIN_OVERRIDE='$REMOTE_PIN_OVERRIDE' REMOTE_ROTATION_STATE='$REMOTE_ROTATION_STATE' REMOTE_MANAGER='$REMOTE_ROTATION_MANAGER' INPUT='$remote_input' EVIDENCE='$remote_evidence' VERIFIER='$remote_verifier' REMOTE_LEASE_MANAGER='$REMOTE_LEASE_MANAGER' RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash -s -- $service_args" <<'REMOTE_SCRIPT'
          set -euo pipefail
          umask 077
          compose=(docker compose --env-file "$XFRAMEWORK_ENV_FILE" -f "$REMOTE_COMPOSE_FILE" -f "$REMOTE_PIN_OVERRIDE" --project-name "$COMPOSE_PROJECT_NAME")
          deployment_uid="$(id -u)"
          state_status="$(/usr/bin/timeout --foreground --kill-after=10s 30s python3 "$REMOTE_MANAGER" status --env-file "$XFRAMEWORK_ENV_FILE" --state-file "$REMOTE_ROTATION_STATE")"
          health_dir="$(mktemp -d /dev/shm/bolt-phase0-convergence-finalized.XXXXXXXX)"
          trap 'rm -rf -- "$health_dir"' EXIT
          for service in "$@"; do
            python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
              heartbeat --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase finalized-convergence --mutation-began >/dev/null
            container_id="$(/usr/bin/timeout --foreground --kill-after=10s 30s "${compose[@]}" ps --quiet "$service")"
            test -n "$container_id"
            status="$(/usr/bin/timeout --foreground --kill-after=10s 30s docker exec "$container_id" curl -sS --connect-timeout 3 --max-time 10 \
              -o /tmp/phase0-credential-health.json -w '%{http_code}' http://127.0.0.1:8080/health/internal || true)"
            test "$status" = 200
            /usr/bin/timeout --foreground --kill-after=10s 30s docker cp "$container_id:/tmp/phase0-credential-health.json" "$health_dir/$service.json"
            /usr/bin/timeout --foreground --kill-after=10s 30s docker exec "$container_id" rm -f /tmp/phase0-credential-health.json
          done
          current_service="$(python3 "$ENV_PARSER" --file "$XFRAMEWORK_ENV_FILE" --key BOLT_SYNTHETIC_COMMUNICATIONS_TOKEN_PATH --type absolute-path)"
          current_user="$(python3 "$ENV_PARSER" --file "$XFRAMEWORK_ENV_FILE" --key BOLT_SYNTHETIC_USER_TOKEN_PATH --type absolute-path)"
          python3 - "$health_dir" "$state_status" "$INPUT" "$@" <<'PY'
          import datetime, json, os, pathlib, sys
          health_dir = pathlib.Path(sys.argv[1])
          state = json.loads(sys.argv[2])
          output = pathlib.Path(sys.argv[3])
          services = sys.argv[4:]
          clients = [
              "XFramework.IdentityServer", "XFramework.Portal", "XFramework.Bolt.Hub",
              "XFramework.Communications", "XFramework.Notifications", "XFramework.Storage",
              "XFramework.Attendance", "XFramework.SmsGateway", "XFramework.Wallets",
              "XFramework.Inventario", "XFramework.POS", "XFramework.Operations.Dashboard",
          ]
          document = {
              "schema": "xframework.bolt.phase0.credential-convergence-input.v1",
              "collected_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="microseconds").replace("+00:00", "Z"),
              "target_generation_id": state["target_generation_id"],
              "retiring_generation_id": state["previous_generation_id"],
              "phase": "finalized",
              "identityserver_service": "identityserver",
              "expected_services": services,
              "expected_identityserver_clients": clients,
              "services": [
                  {"name": service, "http_status": 200, "health": json.loads((health_dir / f"{service}.json").read_text(encoding="utf-8"))}
                  for service in services
              ],
          }
          output.write_text(json.dumps(document, separators=(",", ":"), sort_keys=True), encoding="utf-8")
          os.chmod(output, 0o600)
          PY
          python3 "$VERIFIER" --input "$INPUT" --output "$EVIDENCE" --maximum-health-age-seconds 30 \
            --current-jwt service "$current_service" --current-jwt jwt "$current_user"
          rm -f "$INPUT"
          REMOTE_SCRIPT
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes \
            "$DEPLOY_HOST:$remote_evidence" "$evidence_dir/credential-convergence-finalized.json"

