            --timeout-seconds 540 --quiet -- /usr/bin/timeout --foreground --kill-after=30s 510s \
            python3 "$REMOTE_MANAGER" bootstrap --env-file "$XFRAMEWORK_ENV_FILE" \
              --state-file "$REMOTE_ROTATION_STATE" > "$REMOTE_EVIDENCE.tmp"
          mv "$REMOTE_EVIDENCE.tmp" "$REMOTE_EVIDENCE"
          chmod 600 "$REMOTE_EVIDENCE"
          REMOTE_SCRIPT
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes \
            "$DEPLOY_HOST:$remote_evidence" "$evidence_dir/rotation-bootstrap.json"

      - name: Prepare bounded validation-only credential generation G+1
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/bolt-phase0-evidence"
          remote_manager="$REMOTE_ROTATION_MANAGER"
          remote_evidence="$REMOTE_RUN_DIR/rotation-prepare-evidence.json"
          minimum_remaining_seconds=$((
            MAX_JWT_LIFETIME_SECONDS +
            POST_ACTIVATION_ROLLOUT_BUDGET_SECONDS +
            POST_ACTIVATION_OBSERVATION_BUDGET_SECONDS +
            ROLLBACK_BUDGET_SECONDS
          ))
          prepare_validity_seconds=$((
            PRE_ACTIVATION_STAGING_BUDGET_SECONDS + minimum_remaining_seconds
          ))
          test "$minimum_remaining_seconds" -eq 7200
          test "$prepare_validity_seconds" -eq 14400

          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "XFRAMEWORK_ENV_FILE='$XFRAMEWORK_ENV_FILE' REMOTE_ROTATION_STATE='$REMOTE_ROTATION_STATE' REMOTE_EVIDENCE='$remote_evidence' REMOTE_MANAGER='$remote_manager' REMOTE_LEASE_MANAGER='$REMOTE_LEASE_MANAGER' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' PREPARE_VALIDITY_SECONDS='$prepare_validity_seconds' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          deployment_uid="$(id -u)"
          heartbeat() {
            python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
              heartbeat --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase credential-preparation >/dev/null
          }
          heartbeat
          if [ -e "$REMOTE_ROTATION_STATE" ] || [ -L "$REMOTE_ROTATION_STATE" ]; then
            /usr/bin/timeout --foreground --kill-after=10s 30s python3 "$REMOTE_MANAGER" status \
              --env-file "$XFRAMEWORK_ENV_FILE" \
              --state-file "$REMOTE_ROTATION_STATE" > "$REMOTE_EVIDENCE" || true
            echo "Credential preparation cannot resume implicitly; deployment is blocked." >&2
            exit 1
          fi
          python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
            supervise --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase credential-preparation \
            --timeout-seconds 540 --quiet -- /usr/bin/timeout --foreground --kill-after=30s 510s \
            python3 "$REMOTE_MANAGER" prepare --env-file "$XFRAMEWORK_ENV_FILE" \
              --state-file "$REMOTE_ROTATION_STATE" --valid-for-seconds "$PREPARE_VALIDITY_SECONDS" > "$REMOTE_EVIDENCE.tmp"
          mv "$REMOTE_EVIDENCE.tmp" "$REMOTE_EVIDENCE"
          chmod 600 "$REMOTE_EVIDENCE"
          heartbeat
          REMOTE_SCRIPT
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes \
            "$DEPLOY_HOST:$remote_evidence" "$evidence_dir/rotation-prepare.json"

      - name: Run migration before service mutation
        shell: bash
        run: |
          set -euo pipefail
          remote_env="COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' REGISTRY_HOST='$REGISTRY_HOST' REGISTRY_NAMESPACE='$REGISTRY_NAMESPACE' IMAGE_TAG='$IMAGE_TAG' XFRAMEWORK_ENV_FILE='$XFRAMEWORK_ENV_FILE' REMOTE_COMPOSE_FILE='$REMOTE_COMPOSE_FILE' REMOTE_PIN_OVERRIDE='$REMOTE_PIN_OVERRIDE' REMOTE_RUN_DIR='$REMOTE_RUN_DIR' REMOTE_LEASE_MANAGER='$REMOTE_LEASE_MANAGER' RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT'"
          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "$remote_env bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          install -d -m 700 "$REMOTE_RUN_DIR"
          : > "$REMOTE_RUN_DIR/mutation-started"
          deployment_uid="$(id -u)"
          heartbeat() {
            python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
              heartbeat --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase migration --mutation-began >/dev/null
          }
          compose=(docker compose --env-file "$XFRAMEWORK_ENV_FILE" -f "$REMOTE_COMPOSE_FILE" -f "$REMOTE_PIN_OVERRIDE")
          python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
            supervise --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase migration --mutation-began \
            --timeout-seconds 540 -- /usr/bin/timeout --foreground --kill-after=30s 510s \
            "${compose[@]}" up --no-build --no-deps --force-recreate --abort-on-container-exit --exit-code-from migrate migrate
          REMOTE_SCRIPT

      - name: Deploy Bolt Hub only
        shell: bash
        run: |
          set -euo pipefail
          remote_env="COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' REGISTRY_HOST='$REGISTRY_HOST' REGISTRY_NAMESPACE='$REGISTRY_NAMESPACE' IMAGE_TAG='$IMAGE_TAG' XFRAMEWORK_ENV_FILE='$XFRAMEWORK_ENV_FILE' REMOTE_COMPOSE_FILE='$REMOTE_COMPOSE_FILE' REMOTE_PIN_OVERRIDE='$REMOTE_PIN_OVERRIDE' REMOTE_RUN_DIR='$REMOTE_RUN_DIR' REMOTE_LEASE_MANAGER='$REMOTE_LEASE_MANAGER' RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT'"
          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "$remote_env bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          install -d -m 700 "$REMOTE_RUN_DIR"
          : > "$REMOTE_RUN_DIR/mutation-started"
          deployment_uid="$(id -u)"
          heartbeat() {
            python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
              heartbeat --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase hub-rollout --mutation-began >/dev/null
          }
          compose=(docker compose --env-file "$XFRAMEWORK_ENV_FILE" -f "$REMOTE_COMPOSE_FILE" -f "$REMOTE_PIN_OVERRIDE")
          python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
            supervise --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase hub-rollout --mutation-began \
            --timeout-seconds 540 -- /usr/bin/timeout --foreground --kill-after=30s 510s \
            "${compose[@]}" up -d --no-build --no-deps bolt-hub
          REMOTE_SCRIPT

      - name: Verify Hub TLS and plaintext boundary
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "XFRAMEWORK_ENV_FILE='$XFRAMEWORK_ENV_FILE' ENV_PARSER='$REMOTE_ENV_PARSER' REMOTE_PINS_FILE='$REMOTE_PINS_FILE' REMOTE_LEASE_MANAGER='$REMOTE_LEASE_MANAGER' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          deployment_uid="$(id -u)"
          heartbeat_parent_pid=$$
          heartbeat_failed="$(mktemp)"
          heartbeat_ready="$(mktemp)"
          rm -f "$heartbeat_failed" "$heartbeat_ready"
          heartbeat_pid=
          heartbeat() {
            python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
              heartbeat --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase hub-readiness --mutation-began >/dev/null
          }
          heartbeat_loop() {
            trap 'exit 0' TERM INT HUP
            while true; do
              if ! heartbeat; then
                : > "$heartbeat_failed"
                kill -TERM "$heartbeat_parent_pid" >/dev/null 2>&1 || true
                return 1
              fi
              : > "$heartbeat_ready"
              sleep 30 & wait $! || return 0
            done
          }
          cleanup_heartbeat() {
            status=$?
            heartbeat_was_alive=false
            trap - EXIT TERM INT HUP
            if [ -n "$heartbeat_pid" ]; then
              if kill -0 "$heartbeat_pid" >/dev/null 2>&1; then
                heartbeat_was_alive=true
                kill "$heartbeat_pid" >/dev/null 2>&1 || true
              fi
              wait "$heartbeat_pid" 2>/dev/null || true
              if [ "$status" -eq 0 ] && { [ "$heartbeat_was_alive" != true ] || [ -e "$heartbeat_failed" ]; }; then
                echo "Hub readiness lease heartbeat stopped unexpectedly" >&2
                status=1
              fi
            fi
            rm -f "$heartbeat_failed" "$heartbeat_ready"
            exit "$status"
          }
          trap cleanup_heartbeat EXIT
          trap 'exit 1' TERM INT HUP
          heartbeat_loop & heartbeat_pid=$!
          for _ in $(seq 1 100); do
            [ -e "$heartbeat_ready" ] && break
            if [ -e "$heartbeat_failed" ] || ! kill -0 "$heartbeat_pid" >/dev/null 2>&1; then
              echo "Hub readiness lease heartbeat failed to start" >&2
              exit 1
            fi
            sleep 0.1
          done
          test -e "$heartbeat_ready"
          read_env() { python3 "$ENV_PARSER" --file "$XFRAMEWORK_ENV_FILE" --key "$1"; }
          ca_path="$(read_env BOLT_HUB_TLS_CA_PATH)"
          published_port="$(read_env BOLT_HUB_EXPOSE_PORT)"
          public_hostname="$(read_env BOLT_HUB_PUBLIC_HOSTNAME)"

          for endpoint in live ready; do
            ready=0
            for attempt in $(seq 1 60); do
              status="$(curl -sS --connect-timeout 5 --max-time 15 \
                --noproxy "$public_hostname" --cacert "$ca_path" \
                -o /tmp/bolt-phase0-health.json -w '%{http_code}' \
                "https://${public_hostname}:${published_port}/health/${endpoint}" || true)"
              if [ "$status" = 200 ]; then ready=1; break; fi
              sleep 5
            done
            test "$ready" -eq 1
          done

          hub_ref="$(python3 - "$REMOTE_PINS_FILE" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["pins"]["bolt-hub"])
          PY
          )"
          network="$(/usr/bin/timeout --foreground --kill-after=10s 30s docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' xframework-bolt-hub)"
          test -n "$network"
          if /usr/bin/timeout --foreground --kill-after=10s 30s docker run --rm --network "$network" --entrypoint curl "$hub_ref" \
            -fsS --connect-timeout 3 --max-time 10 http://bolt-hub:8080/bolt/ws >/dev/null 2>&1; then
            echo "plaintext Bolt endpoint was reachable from a peer container" >&2
            exit 1
          fi
          REMOTE_SCRIPT

      - name: Verify staged runtime after Hub deployment
        shell: bash
        run: |
