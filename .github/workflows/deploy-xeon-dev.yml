          REMOTE_SCRIPT

          bash scripts/run-bolt-phase0-synthetics.sh finalized

          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' XFRAMEWORK_ENV_FILE='$XFRAMEWORK_ENV_FILE' REMOTE_COMPOSE_FILE='$REMOTE_COMPOSE_FILE' REMOTE_PIN_OVERRIDE='$REMOTE_PIN_OVERRIDE' REMOTE_PINS_FILE='$REMOTE_PINS_FILE' REMOTE_RUN_DIR='$REMOTE_RUN_DIR' REMOTE_RUNTIME='$remote_runtime' REMOTE_DRILL='$remote_drill' REMOTE_ROTATION_STATE='$REMOTE_ROTATION_STATE' REMOTE_ROTATION_MANAGER='$REMOTE_ROTATION_MANAGER' RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' SOURCE_COMMIT='$GITHUB_SHA' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          mv "$REMOTE_RUN_DIR/synthetics-finalized.json" "$REMOTE_RUN_DIR/rollback-synthetics-finalized.json"
          mv "$REMOTE_RUN_DIR/synthetics-finalized.pre-rollback.json" "$REMOTE_RUN_DIR/synthetics-finalized.json"
          generation="$(python3 "$REMOTE_ROTATION_MANAGER" status --env-file "$XFRAMEWORK_ENV_FILE" --state-file "$REMOTE_ROTATION_STATE" | python3 -c 'import json,sys; document=json.load(sys.stdin); assert document["phase"] == "finalized"; print(document["target_generation_id"])')"
          python3 - "$REMOTE_RUN_DIR" "$REMOTE_RUNTIME" "$REMOTE_DRILL" "$RUN_ID" "$RUN_ATTEMPT" "$SOURCE_COMMIT" "$COMPOSE_PROJECT_NAME" "$generation" <<'PY'
          import datetime, hashlib, json, os, pathlib, sys, tempfile
          root, runtime_text, output_text, run_id, attempt, commit, project, generation = sys.argv[1:]
          root = pathlib.Path(root)
          runtime = pathlib.Path(runtime_text)
          synthetic = root / "rollback-synthetics-finalized.json"
          def digest(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          document = {
              "schema": "xframework.bolt.phase0.rollback-drill.v1",
              "status": "passed",
              "run_id": run_id,
              "run_attempt": int(attempt),
              "source_commit": commit,
              "project_name": project,
              "started_at_utc": (root / "rollback-drill-started").read_text(encoding="utf-8").strip(),
              "completed_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="microseconds").replace("+00:00", "Z"),
              "credential_generation_id": generation,
              "manifest_sha256": digest(root / "docker-compose.yml"),
              "override_sha256": digest(root / "pinned-compose.override.json"),
              "pins_sha256": digest(root / "image-pins.json"),
              "runtime_evidence_sha256": digest(runtime),
              "synthetic_evidence_sha256": digest(synthetic),
              "checks": {
                  "restore_applied": True,
                  "full_runtime_verified": True,
                  "authenticated_finalized_synthetic": True,
                  "current_generation_preserved": True,
              },
              "errors": [],
          }
          output = pathlib.Path(output_text)
          descriptor, temporary_name = tempfile.mkstemp(prefix=f".{output.name}.", dir=output.parent)
          with os.fdopen(descriptor, "w", encoding="utf-8") as stream:
              os.fchmod(stream.fileno(), 0o600)
              json.dump(document, stream, separators=(",", ":"), sort_keys=True)
              stream.write("\n")
              stream.flush(); os.fsync(stream.fileno())
          os.replace(temporary_name, output)
          (root / "rollback-drill-started").unlink()
          PY
          REMOTE_SCRIPT
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST:$remote_runtime" "$evidence_dir/rollback-runtime-evidence.json"
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST:$REMOTE_RUN_DIR/rollback-synthetics-finalized.json" "$evidence_dir/rollback-synthetics-finalized.json"
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST:$remote_drill" "$evidence_dir/rollback-drill-evidence.json"

