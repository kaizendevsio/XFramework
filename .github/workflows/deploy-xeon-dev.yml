          remote_override="$REMOTE_PIN_OVERRIDE"
          remote_env="COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' REGISTRY_HOST='$REGISTRY_HOST' REGISTRY_NAMESPACE='$REGISTRY_NAMESPACE' IMAGE_TAG='$IMAGE_TAG' CREDENTIAL_GENERATION_ID='phase0-prelease-validation-g1'"

          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "$remote_env docker compose --env-file '$XFRAMEWORK_ENV_FILE' -f '$REMOTE_COMPOSE_FILE' -f '$remote_override' pull ${pull_services[*]}"

      - name: Arm external deployment watchdog
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/bolt-phase0-evidence"
          remote_stage="$REMOTE_RUN_DIR/manage-bolt-phase0-deployment-lease.py"
          remote_qualifier_stage="$REMOTE_QUALIFICATION_VERIFIER"
          remote_watchdog_stage="$REMOTE_RUN_DIR/run-bolt-phase0-watchdog.sh"
          remote_runtime_stage="$REMOTE_RUNTIME_VERIFIER"
          remote_service_stage="$REMOTE_RUN_DIR/xframework-bolt-phase0-watchdog.service"
          remote_timer_stage="$REMOTE_RUN_DIR/xframework-bolt-phase0-watchdog.timer"
          remote_evidence="$REMOTE_RUN_DIR/deployment-lease-arm.json"
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes \
            scripts/manage-bolt-phase0-deployment-lease.py "$DEPLOY_HOST:$remote_stage"
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes \
            scripts/verify-bolt-phase0-qualification.py "$DEPLOY_HOST:$remote_qualifier_stage"
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes \
            scripts/run-bolt-phase0-watchdog.sh "$DEPLOY_HOST:$remote_watchdog_stage"
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes \
            scripts/verify-bolt-phase0-runtime.py "$DEPLOY_HOST:$remote_runtime_stage"
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes \
            deploy/systemd/xframework-bolt-phase0-watchdog.service "$DEPLOY_HOST:$remote_service_stage"
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes \
            deploy/systemd/xframework-bolt-phase0-watchdog.timer "$DEPLOY_HOST:$remote_timer_stage"
          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "REMOTE_STAGE='$remote_stage' REMOTE_LEASE_MANAGER='$REMOTE_LEASE_MANAGER' REMOTE_QUALIFIER_STAGE='$remote_qualifier_stage' REMOTE_WATCHDOG_STAGE='$remote_watchdog_stage' REMOTE_RUNTIME_STAGE='$remote_runtime_stage' REMOTE_SERVICE_STAGE='$remote_service_stage' REMOTE_TIMER_STAGE='$remote_timer_stage' REMOTE_EVIDENCE='$remote_evidence' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          /usr/bin/bash -n "$REMOTE_WATCHDOG_STAGE"
          PYTHONPYCACHEPREFIX=/tmp/xframework-phase0-pycache python3 -m py_compile "$REMOTE_STAGE"
          PYTHONPYCACHEPREFIX=/tmp/xframework-phase0-pycache python3 -m py_compile "$REMOTE_QUALIFIER_STAGE"
          PYTHONPYCACHEPREFIX=/tmp/xframework-phase0-pycache python3 -m py_compile "$REMOTE_RUNTIME_STAGE"
          chmod 700 "$REMOTE_STAGE" "$REMOTE_QUALIFIER_STAGE" "$REMOTE_WATCHDOG_STAGE" "$REMOTE_RUNTIME_STAGE"
          chmod 600 "$REMOTE_SERVICE_STAGE" "$REMOTE_TIMER_STAGE"
          deployment_uid="$(id -u)"
          recovery_status=0
          /usr/bin/python3 "$REMOTE_LEASE_MANAGER" \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --deployment-uid "$deployment_uid" \
            arm \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --phase credential-preparation \
            --stale-timeout-seconds 600 > "$REMOTE_EVIDENCE.tmp"
          mv "$REMOTE_EVIDENCE.tmp" "$REMOTE_EVIDENCE"
          REMOTE_SCRIPT
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes \
            "$DEPLOY_HOST:$remote_evidence" "$evidence_dir/deployment-lease-arm.json"

      - name: Bootstrap current credential generation under lease
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/bolt-phase0-evidence"
          remote_manager="$REMOTE_ROTATION_MANAGER"
          remote_evidence="$REMOTE_RUN_DIR/rotation-bootstrap-evidence.json"
          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "XFRAMEWORK_ENV_FILE='$XFRAMEWORK_ENV_FILE' REMOTE_ROTATION_STATE='$REMOTE_ROTATION_STATE' REMOTE_EVIDENCE='$remote_evidence' REMOTE_MANAGER='$remote_manager' REMOTE_LEASE_MANAGER='$REMOTE_LEASE_MANAGER' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          deployment_uid="$(id -u)"
          python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
