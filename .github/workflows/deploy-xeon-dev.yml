              "XFramework.Communications", "XFramework.Notifications", "XFramework.Storage",
              "XFramework.Attendance", "XFramework.SmsGateway", "XFramework.Wallets",
              "XFramework.Inventario", "XFramework.POS", "XFramework.Operations.Dashboard",
          ]
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="microseconds").replace("+00:00", "Z")
          document = {
