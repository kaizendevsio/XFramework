          import importlib.util, json, pathlib, sys
          manifest_path, channel_image, expected_pin = sys.argv[1:]
          script = pathlib.Path("scripts/verify-bolt-phase0-image-pin.py")
          spec = importlib.util.spec_from_file_location("phase0_image_pin", script)
          if not spec or not spec.loader:
              raise SystemExit("unable to load the image-pin verifier")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          manifest = json.loads(pathlib.Path(manifest_path).read_text(encoding="utf-8"))
          digest = module.select_manifest_digest(channel_image, manifest)
          if f"{channel_image.rsplit(':', 1)[0]}@{digest}" != expected_pin:
              raise SystemExit("published channel tag does not resolve to its qualified digest")
          PY
            printf '%s\t%s\t%s\n' "$service" "$channel_image" "$pin" >> "$rows"
          done < <(python3 - "$pins_file" <<'PY'
          import json, sys
          pins = json.load(open(sys.argv[1], encoding="utf-8"))["pins"]
          for service, pin in sorted(pins.items()):
              print(f"{service}\t{pin}")
          PY
          )

          python3 - "$rows" "$evidence_dir/channel-publication.json" "$IMAGE_TAG" <<'PY'
          import datetime, json, pathlib, sys
          rows, output, commit = sys.argv[1:]
          publications = {}
          for line in pathlib.Path(rows).read_text(encoding="utf-8").splitlines():
              service, channel, pin = line.split("\t", 2)
              if service in publications:
                  raise SystemExit("duplicate channel publication evidence")
              publications[service] = {"channel": channel, "qualified_pin": pin}
          if not publications:
              raise SystemExit("no qualified channel tags were published")
          evidence = {
              "schema": "xframework.bolt.phase0.channel-publication.v1",
              "generated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "status": "passed",
              "source_commit": commit,
              "publications": publications,
          }
          pathlib.Path(output).write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Restore security-qualified deployment or stop Bolt
        if: ${{ (failure() || cancelled()) && steps.ssh_setup.outcome == 'success' }}
        shell: bash
        env:
          DEPLOY_SSH_OPERATION_TIMEOUT_SECONDS: 4500
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/bolt-phase0-evidence"
          mkdir -p "$evidence_dir"
          test "$DEPLOY_SSH_READY" = true
          test -s "$DEPLOY_SSH_CONFIG"
          test -s "$DEPLOY_KNOWN_HOSTS"
          remote_evidence="$REMOTE_DEPLOY_DIR/phase0-watchdog/workflow-recovery-evidence.json"
          status=0
          ssh -F "$DEPLOY_SSH_CONFIG" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$DEPLOY_KNOWN_HOSTS" "$DEPLOY_HOST" \
            "REMOTE_WATCHDOG_RUNNER='$REMOTE_WATCHDOG_RUNNER' REMOTE_EVIDENCE='$remote_evidence' bash -s" <<'REMOTE_SCRIPT' || status=$?
          set -euo pipefail
          recovery_status=0
          sudo -n /usr/local/sbin/xframework-bolt-phase0-root ensure-watchdog || recovery_status=$?
          if [ "$recovery_status" -eq 0 ]; then
            "$REMOTE_WATCHDOG_RUNNER" force-recovery || recovery_status=$?
          fi
          watchdog_status=0
          sudo -n /usr/local/sbin/xframework-bolt-phase0-root ensure-watchdog || watchdog_status=$?
          if [ "$watchdog_status" -ne 0 ]; then
            recovery_status="$watchdog_status"
          fi
          controller_evidence=/home/github-runner/xframework-deploy/phase0-watchdog/deployment-recovery-evidence.json
          if [ -s "$controller_evidence" ]; then
            cp --reflink=auto --preserve=mode,timestamps "$controller_evidence" "$REMOTE_EVIDENCE"
          else
            printf '%s\n' '{"schema":"xframework.bolt.phase0.workflow-recovery.v1","status":"failed","reason_code":"watchdog-bootstrap-failed"}' > "$REMOTE_EVIDENCE"
            chmod 600 "$REMOTE_EVIDENCE"
          fi
          exit "$recovery_status"
          REMOTE_SCRIPT
          scp -F "$DEPLOY_SSH_CONFIG" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$DEPLOY_KNOWN_HOSTS" \
            "$DEPLOY_HOST:$remote_evidence" "$evidence_dir/workflow-recovery-evidence.json" || true
          exit "$status"

      - name: Deployment diagnostics
        if: ${{ (failure() || cancelled()) && steps.ssh_setup.outcome == 'success' }}
        shell: bash
        run: |
          remote_env="COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' REGISTRY_HOST='$REGISTRY_HOST' REGISTRY_NAMESPACE='$REGISTRY_NAMESPACE' IMAGE_TAG='$IMAGE_TAG'"
          remote_override="$REMOTE_PIN_OVERRIDE"
          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "$remote_env docker compose --env-file '$XFRAMEWORK_ENV_FILE' -f '$REMOTE_COMPOSE_FILE' -f '$remote_override' ps" || true

      - name: Upload Phase 0 deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bolt-phase0-all-services-${{ github.run_id }}
          path: ${{ runner.temp }}/bolt-phase0-evidence
          if-no-files-found: warn
          retention-days: 30
