            "REMOTE_STARTED='$REMOTE_RUN_DIR/canary-observation-started' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          umask 077
          python3 - <<'PY' > "$REMOTE_STARTED"
          import datetime
          print(datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="microseconds").replace("+00:00", "Z"))
          PY
          REMOTE_SCRIPT
          bash scripts/run-bolt-phase0-synthetics.sh canary

      - name: Observe canary before promotion
        shell: bash
        env:
          CANARY_OBSERVATION_MINUTES: ${{ inputs.canary_observation_minutes }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/bolt-phase0-evidence"
          remote_verifier="$REMOTE_DEPLOY_DIR/verify-bolt-phase0-observation.py"
          remote_input="$REMOTE_RUN_DIR/canary-observation-input.json"
          remote_samples="$REMOTE_RUN_DIR/canary-observation-samples.jsonl"
          remote_started="$REMOTE_RUN_DIR/canary-observation-started"
          remote_output="$REMOTE_RUN_DIR/observation-evidence.json"
          minimum_duration=$((CANARY_OBSERVATION_MINUTES * 60))
          minimum_samples=$((CANARY_OBSERVATION_MINUTES * 2 + 1))
          test "$minimum_samples" -ge 11
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes \
            scripts/verify-bolt-phase0-observation.py "$DEPLOY_HOST:$remote_verifier"
          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "REMOTE_SAMPLES='$remote_samples' REMOTE_STARTED='$remote_started' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          umask 077
          : > "$REMOTE_SAMPLES"
          test -s "$REMOTE_STARTED"
          REMOTE_SCRIPT

          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "REMOTE_SAMPLES='$remote_samples' MINIMUM_SAMPLES='$minimum_samples' REMOTE_LEASE_MANAGER='$REMOTE_LEASE_MANAGER' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          umask 077
          deployment_uid="$(id -u)"
          heartbeat() {
            python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
              heartbeat --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase canary-observation --mutation-began >/dev/null
          }
          containers=(xframework-bolt-hub xframework-identityserver xframework-communications)
          services=(bolt-hub identityserver communications)
          for sample_number in $(seq 1 "$MINIMUM_SAMPLES"); do
            heartbeat
            sample_dir="$(mktemp -d /dev/shm/bolt-phase0-observation.XXXXXXXX)"
            cleanup() { rm -rf -- "$sample_dir"; }
            trap cleanup EXIT
            for index in 0 1 2; do
              status="$(/usr/bin/timeout --foreground --kill-after=10s 30s docker exec "${containers[$index]}" curl -sS --connect-timeout 3 --max-time 10 \
                -o /tmp/phase0-health.json -w '%{http_code}' http://127.0.0.1:8080/health/internal || true)"
              test "$status" = 200
              /usr/bin/timeout --foreground --kill-after=10s 30s docker cp "${containers[$index]}:/tmp/phase0-health.json" "$sample_dir/${services[$index]}.json"
              /usr/bin/timeout --foreground --kill-after=10s 30s docker exec "${containers[$index]}" rm -f /tmp/phase0-health.json
            done
            python3 - "$sample_dir" >> "$REMOTE_SAMPLES" <<'PY'
          import datetime, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          services = {}
          for service in ("bolt-hub", "identityserver", "communications"):
              health = json.loads((root / f"{service}.json").read_text(encoding="utf-8"))
              services[service] = {"http_status": 200, "health": health}
          sample = {
              "sampled_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="microseconds").replace("+00:00", "Z"),
              "services": services,
          }
          print(json.dumps(sample, separators=(",", ":"), sort_keys=True))
          PY
            cleanup
            trap - EXIT
            if [ "$sample_number" -lt "$MINIMUM_SAMPLES" ]; then sleep 30; fi
          done
          REMOTE_SCRIPT

          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "REMOTE_STARTED='$remote_started' REMOTE_SAMPLES='$remote_samples' REMOTE_INPUT='$remote_input' REMOTE_SYNTHETIC='$REMOTE_RUN_DIR/synthetics-canary.json' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          python3 - "$REMOTE_STARTED" "$REMOTE_SAMPLES" "$REMOTE_SYNTHETIC" "$REMOTE_INPUT" <<'PY'
          import datetime, json, os, pathlib, sys
          started_path, samples_path, synthetic_path, output_path = map(pathlib.Path, sys.argv[1:])
          document = {
              "schema": "xframework.bolt.phase0.observation-input.v1",
              "observation_started_at_utc": started_path.read_text(encoding="utf-8").strip(),
              "observation_completed_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="microseconds").replace("+00:00", "Z"),
              "health_samples": [json.loads(line) for line in samples_path.read_text(encoding="utf-8").splitlines()],
              "synthetic_reports": [json.loads(synthetic_path.read_text(encoding="utf-8"))],
          }
          temporary = output_path.with_suffix(".tmp")
          temporary.write_text(json.dumps(document, separators=(",", ":"), sort_keys=True), encoding="utf-8")
          os.chmod(temporary, 0o600)
          os.replace(temporary, output_path)
          PY
          REMOTE_SCRIPT

          status=0
          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "python3 '$remote_verifier' --input '$remote_input' --output '$remote_output' --minimum-duration-seconds '$minimum_duration' --minimum-samples '$minimum_samples' --maximum-sample-gap-seconds 45 --maximum-health-age-seconds 15 --pressure-persistence-samples 3 --growth-window-samples 5 --maximum-connection-count-churn 10 --maximum-estimated-reconnects 10 --latency-budget '*=5000,10000'" || status=$?
          scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes \
            "$DEPLOY_HOST:$remote_output" "$evidence_dir/observation-evidence.json" || true
          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "rm -f '$remote_input' '$remote_samples' '$remote_started'"
          exit "$status"

      - name: Promote remaining clients in bounded batches
        shell: bash
        run: |
          set -euo pipefail
          remote_env="COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' REGISTRY_HOST='$REGISTRY_HOST' REGISTRY_NAMESPACE='$REGISTRY_NAMESPACE' IMAGE_TAG='$IMAGE_TAG' XFRAMEWORK_ENV_FILE='$XFRAMEWORK_ENV_FILE' REMOTE_COMPOSE_FILE='$REMOTE_COMPOSE_FILE' REMOTE_PIN_OVERRIDE='$REMOTE_PIN_OVERRIDE' REMOTE_LEASE_MANAGER='$REMOTE_LEASE_MANAGER' RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT'"
          batches=(
            "notifications storage attendance smsgateway"
            "wallets inventario pos"
            "portal operations-dashboard"
          )
          cumulative_services=(migrate bolt-hub identityserver communications)
          remote_verifier="$REMOTE_RUNTIME_VERIFIER"
          batch_number=0
          for batch in "${batches[@]}"; do
            batch_number=$((batch_number + 1))
            ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
              "$remote_env bash -s -- $batch" <<'REMOTE_SCRIPT'
          set -euo pipefail
          deployment_uid="$(id -u)"
