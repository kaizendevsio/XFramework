              "services": [
                  {"name": service, "http_status": 200, "health": json.loads((health_dir / f"{service}.json").read_text(encoding="utf-8"))}
                  for service in services
              ],
          }
          output.write_text(json.dumps(document, separators=(",", ":"), sort_keys=True), encoding="utf-8")
          os.chmod(output, 0o600)
          inventory.write_text(json.dumps({
              "schema": "xframework.bolt.phase0.credential-generation-inventory.v1",
