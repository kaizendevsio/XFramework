      - name: Build images on buildserver
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          evidence_dir="$RUNNER_TEMP/bolt-phase0-evidence"
          build_inputs_file="$evidence_dir/build-inputs.json"
          raw_compose_config="$RUNNER_TEMP/bolt-phase0-compose-build-config.json"
          mkdir -p "$evidence_dir"
          trap 'rm -f "$raw_compose_config"' EXIT
          test "$(git rev-parse HEAD)" = "$IMAGE_TAG"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git submodule status 2>/dev/null)"
          services=(
            migrate
            bolt-phase0-synthetics
            bolt-hub
            identityserver
            communications
            notifications
            storage
            attendance
            smsgateway
            wallets
            inventario
            pos
            portal
            operations-dashboard
          )

          docker compose -f "$COMPOSE_FILE_PATH" config --format json > "$raw_compose_config"
          python3 - "$raw_compose_config" "$build_inputs_file" "$IMAGE_TAG" "${services[@]}" <<'PY'
          import json, pathlib, re, sys
          source, output, commit, *expected_services = sys.argv[1:]
          document = json.loads(pathlib.Path(source).read_text(encoding="utf-8"))
          services = document.get("services")
          if not isinstance(services, dict) or set(expected_services) - set(services):
              raise SystemExit("Compose build-input coverage is incomplete")
          root = pathlib.Path.cwd().resolve()

          def normalize_path(value):
              path = pathlib.Path(value)
              if path.is_absolute():
                  try:
                      path = path.resolve().relative_to(root)
                  except ValueError as error:
                      raise SystemExit("Compose build path escapes the reviewed repository") from error
              normalized = path.as_posix()
              return normalized or "."

          result = {}
          for service in expected_services:
              build = services[service].get("build")
              if not isinstance(build, dict):
                  raise SystemExit(f"{service}: Compose build definition is missing")
              args = build.get("args")
              if (
                  not isinstance(args, dict)
                  or set(args) != {"PROJECT_PATH"}
                  or not isinstance(args["PROJECT_PATH"], str)
                  or not re.fullmatch(r"[A-Za-z0-9._/-]+\.csproj", args["PROJECT_PATH"])
              ):
                  raise SystemExit(f"{service}: Compose build args are not the nonsecret PROJECT_PATH contract")
              context = normalize_path(build.get("context", "."))
              dockerfile = normalize_path(build.get("dockerfile", "Dockerfile"))
              target = build.get("target")
              if context != "." or dockerfile != "Dockerfile" or target is not None:
                  raise SystemExit(f"{service}: Compose build context, Dockerfile, or target is not approved")
              result[service] = {
                  "context": context,
                  "dockerfile": dockerfile,
                  "args": dict(sorted(args.items())),
                  "target": target,
              }
          evidence = {
              "schema": "xframework.bolt.phase0.build-inputs.v1",
              "source_commit": commit,
              "services": result,
          }
          pathlib.Path(output).write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          docker compose -f "$COMPOSE_FILE_PATH" build "${services[@]}"

      - name: Push images to dev registry
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/bolt-phase0-evidence"
          override_file="$evidence_dir/pinned-compose.override.json"
          pins_file="$evidence_dir/image-pins.json"
          services=(
            migrate
            bolt-phase0-synthetics
            bolt-hub
            identityserver
            communications
            notifications
            storage
            attendance
            smsgateway
            wallets
            inventario
            pos
            portal
            operations-dashboard
          )

          expected_args=()
          manifest_args=()
          for service in "${services[@]}"; do
            image="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/${service}:${IMAGE_TAG}"
            docker push "$image"
            manifest_file="$RUNNER_TEMP/bolt-phase0-manifest-${service}.json"
            docker manifest inspect --verbose "$image" > "$manifest_file"
            expected_args+=(--expected-service "$service")
            manifest_args+=(--registry-manifest "$service" "$image" "$manifest_file")
          done

          python3 scripts/verify-bolt-phase0-image-pin.py \
            --expected-image-tag "$IMAGE_TAG" \
            --approved-repository-prefix "$REGISTRY_HOST/$REGISTRY_NAMESPACE" \
            "${expected_args[@]}" \
            "${manifest_args[@]}" \
            --output-override "$override_file" \
            --output-evidence "$pins_file"

      - name: Sign and verify build provenance
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          evidence_dir="$RUNNER_TEMP/bolt-phase0-evidence"
          pins_file="$evidence_dir/image-pins.json"
          provenance_file="$evidence_dir/provenance-evidence.json"
          build_inputs_file="$evidence_dir/build-inputs.json"
          source_repository="https://github.com/${GITHUB_REPOSITORY}"
          workflow_identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          builder_id="$workflow_identity"
          workflow_invocation="${source_repository}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          sdk_base="mcr.microsoft.com/dotnet/sdk@sha256:493fca072aac81307027cbb7b7c9a82b6e87d222af315504d05dc6530e69b519"
          runtime_base="mcr.microsoft.com/dotnet/aspnet@sha256:68abecb063cf367fdce0a7f0ab5678beaa99f60c7f616df862ca2a51c387d4e7"
          record_args=()

          while IFS=$'\t' read -r service subject; do
            predicate="$evidence_dir/provenance-predicate-${service}.json"
            verification="$evidence_dir/cosign-verification-${service}.json"
            bundle="$evidence_dir/cosign-bundle-${service}.json"
            python3 - "$predicate" "$service" "$source_repository" "$workflow_identity" "$builder_id" \
              "$workflow_invocation" "$sdk_base" "$runtime_base" "$build_inputs_file" <<'PY'
          import hashlib, json, pathlib, sys
          (output, service, source_repository, workflow_identity, builder_id,
           invocation_id, sdk_base, runtime_base, build_inputs_path) = sys.argv[1:]
          dockerfile_digest = "sha256:" + hashlib.sha256(pathlib.Path("Dockerfile").read_bytes()).hexdigest()
          build_inputs = json.loads(pathlib.Path(build_inputs_path).read_text(encoding="utf-8"))
          build = build_inputs["services"].get(service)
          if not isinstance(build, dict):
              raise SystemExit(f"{service}: reviewed build input is missing")
          predicate = {
              "buildDefinition": {
                  "buildType": "https://xframework.dev/build-types/compose-dotnet-v1",
                  "externalParameters": {
                      "service": service,
                      "source_repository": source_repository,
                      "source_commit": __import__('os').environ["GITHUB_SHA"],
                      "workflow_ref": workflow_identity,
                      "dockerfile": {"path": "Dockerfile", "digest": dockerfile_digest},
                      "build": build,
                  },
                  "resolvedDependencies": [
                      {"uri": sdk_base.split("@")[0], "digest": {"sha256": sdk_base.split("sha256:", 1)[1]}},
                      {"uri": runtime_base.split("@")[0], "digest": {"sha256": runtime_base.split("sha256:", 1)[1]}},
                  ],
              },
              "runDetails": {
                  "builder": {"id": builder_id},
                  "metadata": {"invocationId": invocation_id},
              },
          }
          pathlib.Path(output).write_text(json.dumps(predicate, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

            cosign attest --yes --new-bundle-format=true --type slsaprovenance1 \
              --predicate "$predicate" --bundle "$bundle" "$subject"
            cosign verify-attestation \
              --new-bundle-format=true \
              --type slsaprovenance1 \
              --certificate-identity "$workflow_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-github-workflow-trigger "$GITHUB_EVENT_NAME" \
              "$subject" > "$verification"
            record_args+=(--provenance-record "$service" "$verification" "$bundle")
          done < <(python3 - "$pins_file" <<'PY'
          import json, sys
          pins = json.load(open(sys.argv[1], encoding="utf-8"))["pins"]
          for service, subject in sorted(pins.items()):
              print(f"{service}\t{subject}")
          PY
          )

          python3 scripts/verify-bolt-phase0-provenance.py \
            --pins-file "$pins_file" \
            --source-commit "$GITHUB_SHA" \
            --source-repository "$source_repository" \
            --dockerfile Dockerfile \
            --build-inputs-file "$build_inputs_file" \
            --expected-base-image "$sdk_base" \
            --expected-base-image "$runtime_base" \
            --trusted-builder-id "$builder_id" \
            --trusted-workflow-ref "$workflow_identity" \
            --workflow-invocation "$workflow_invocation" \
            "${record_args[@]}" \
            --output "$provenance_file"

      - name: Authorize digest-pinned deployment manifest
        shell: bash
        env:
