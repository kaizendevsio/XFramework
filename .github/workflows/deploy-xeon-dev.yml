            python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
              heartbeat --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase client-batch-rollout --mutation-began >/dev/null
          }
          compose=(docker compose --env-file "$XFRAMEWORK_ENV_FILE" -f "$REMOTE_COMPOSE_FILE" -f "$REMOTE_PIN_OVERRIDE")
          python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
            supervise --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase client-batch-rollout --mutation-began \
            --timeout-seconds 540 -- /usr/bin/timeout --foreground --kill-after=30s 510s \
            "${compose[@]}" up -d --no-build --no-deps "$@"
          for service in "$@"; do
            container_id="$(/usr/bin/timeout --foreground --kill-after=10s 30s "${compose[@]}" ps --quiet "$service")"
            test -n "$container_id"
            for attempt in $(seq 1 60); do
              heartbeat
              health="$(/usr/bin/timeout --foreground --kill-after=10s 30s docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container_id")"
              if [ "$health" = healthy ]; then break; fi
              sleep 5
            done
            test "$(/usr/bin/timeout --foreground --kill-after=10s 30s docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container_id")" = healthy
          done
          REMOTE_SCRIPT
            read -r -a promoted_services <<< "$batch"
            cumulative_services+=("${promoted_services[@]}")
            service_args="$(printf '%q ' "${cumulative_services[@]}")"
            remote_evidence="$REMOTE_RUN_DIR/runtime-staged-batch-${batch_number}.json"
            local_evidence="$RUNNER_TEMP/bolt-phase0-evidence/runtime-staged-batch-${batch_number}.json"
            ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" "rm -f '$remote_evidence'"
            status=0
            ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
              "python3 '$REMOTE_LEASE_MANAGER' --project-name '$COMPOSE_PROJECT_NAME' --deployment-uid \"\$(id -u)\" supervise --run-id '$GITHUB_RUN_ID' --run-attempt '$GITHUB_RUN_ATTEMPT' --phase runtime-staged-batch --mutation-began --timeout-seconds 540 --quiet -- /usr/bin/timeout --foreground --kill-after=30s 510s python3 '$remote_verifier' --compose-file '$REMOTE_COMPOSE_FILE' --compose-file '$REMOTE_PIN_OVERRIDE' --env-file '$XFRAMEWORK_ENV_FILE' --project-name '$COMPOSE_PROJECT_NAME' --output '$remote_evidence' --pins-file '$REMOTE_PINS_FILE' --allow-staged-inventory --services $service_args" || status=$?
            scp -i "$DEPLOY_SSH_KEY" -o BatchMode=yes \
              "$DEPLOY_HOST:$remote_evidence" "$local_evidence" || true
            test "$status" -eq 0
            bash scripts/run-bolt-phase0-synthetics.sh "batch-${batch_number}"
          done

      - name: Wait for readiness
        shell: bash
        run: |
          set -euo pipefail

          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "XFRAMEWORK_ENV_FILE='$XFRAMEWORK_ENV_FILE' ENV_PARSER='$REMOTE_ENV_PARSER' REMOTE_LEASE_MANAGER='$REMOTE_LEASE_MANAGER' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          deployment_uid="$(id -u)"
          heartbeat_parent_pid=$$
          heartbeat_failed="$(mktemp)"
          heartbeat_ready="$(mktemp)"
          rm -f "$heartbeat_failed" "$heartbeat_ready"
          heartbeat_pid=
          heartbeat() {
            python3 "$REMOTE_LEASE_MANAGER" --project-name "$COMPOSE_PROJECT_NAME" --deployment-uid "$deployment_uid" \
              heartbeat --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --phase full-readiness --mutation-began >/dev/null
          }
          heartbeat_loop() {
            trap 'exit 0' TERM INT HUP
            while true; do
              if ! heartbeat; then
                : > "$heartbeat_failed"
                kill -TERM "$heartbeat_parent_pid" >/dev/null 2>&1 || true
                return 1
              fi
              : > "$heartbeat_ready"
              sleep 30 & wait $! || return 0
            done
          }
          cleanup_heartbeat() {
            status=$?
            heartbeat_was_alive=false
            trap - EXIT TERM INT HUP
            if [ -n "$heartbeat_pid" ]; then
              if kill -0 "$heartbeat_pid" >/dev/null 2>&1; then
                heartbeat_was_alive=true
                kill "$heartbeat_pid" >/dev/null 2>&1 || true
              fi
              wait "$heartbeat_pid" 2>/dev/null || true
              if [ "$status" -eq 0 ] && { [ "$heartbeat_was_alive" != true ] || [ -e "$heartbeat_failed" ]; }; then
                echo "Full readiness lease heartbeat stopped unexpectedly" >&2
                status=1
              fi
            fi
            rm -f "$heartbeat_failed" "$heartbeat_ready"
            exit "$status"
          }
          trap cleanup_heartbeat EXIT
          trap 'exit 1' TERM INT HUP
          heartbeat_loop & heartbeat_pid=$!
          for _ in $(seq 1 100); do
            [ -e "$heartbeat_ready" ] && break
            if [ -e "$heartbeat_failed" ] || ! kill -0 "$heartbeat_pid" >/dev/null 2>&1; then
              echo "Full readiness lease heartbeat failed to start" >&2
              exit 1
            fi
            sleep 0.1
          done
          test -e "$heartbeat_ready"
          read_env() { python3 "$ENV_PARSER" --file "$XFRAMEWORK_ENV_FILE" --key "$1"; }
          BOLT_HUB_TLS_CA_PATH="$(read_env BOLT_HUB_TLS_CA_PATH)"
          BOLT_HUB_EXPOSE_PORT="$(read_env BOLT_HUB_EXPOSE_PORT)"
          BOLT_HUB_PUBLIC_HOSTNAME="$(read_env BOLT_HUB_PUBLIC_HOSTNAME)"
          IDENTITYSERVER_PUBLIC_HOSTNAME="$(read_env IDENTITYSERVER_PUBLIC_HOSTNAME)"
          IDENTITYSERVER_PUBLIC_HTTPS_PORT="$(read_env IDENTITYSERVER_PUBLIC_HTTPS_PORT)"
          IDENTITYSERVER_TLS_CA_PATH="$(read_env IDENTITYSERVER_TLS_CA_PATH)"
          for endpoint in live ready; do
            body="/tmp/xframework-bolt-hub-health-${endpoint}.json"
            ready=0
            for attempt in {1..60}; do
              status="$(curl -sS --connect-timeout 5 --max-time 15 \
                --noproxy "$BOLT_HUB_PUBLIC_HOSTNAME" --cacert "$BOLT_HUB_TLS_CA_PATH" \
                -o "$body" -w '%{http_code}' \
                "https://${BOLT_HUB_PUBLIC_HOSTNAME}:${BOLT_HUB_EXPOSE_PORT}/health/${endpoint}" || true)"
              if [ "$status" = "200" ]; then
                ready=1
                break
              fi
              echo "bolt-hub ${endpoint} not ready; attempt ${attempt}/60 returned ${status:-no response}"
              sleep 5
            done
            if [ "$ready" -ne 1 ]; then
              echo "bolt-hub failed trusted HTTPS ${endpoint} check" >&2
              cat "$body" || true
              exit 1
            fi
          done
          identity_status="$(curl -sS --connect-timeout 5 --max-time 15 \
            --noproxy "$IDENTITYSERVER_PUBLIC_HOSTNAME" --cacert "$IDENTITYSERVER_TLS_CA_PATH" \
            -o /tmp/xframework-identityserver-ready.json -w '%{http_code}' \
            "https://${IDENTITYSERVER_PUBLIC_HOSTNAME}:${IDENTITYSERVER_PUBLIC_HTTPS_PORT}/health/ready" || true)"
          test "$identity_status" = 200
          checks=(
            "communications=http://localhost:5148/health/ready"
            "notifications=http://localhost:5166/health/ready"
            "storage=http://localhost:5190/health/ready"
            "attendance=http://localhost:5182/health/ready"
            "smsgateway=http://localhost:5274/health/ready"
            "wallets=http://localhost:9696/health/ready"
            "inventario=http://localhost:8105/health/ready"
            "pos=http://localhost:8115/health/ready"
            "portal=http://localhost:5000/health/ready"
            "operations-dashboard=http://localhost:5050/health/ready"
          )

          for check in "${checks[@]}"; do
            name="${check%%=*}"
            url="${check#*=}"
            body="/tmp/xframework-${name}-health.json"
            echo "Waiting for ${name}: ${url}"

            ready=0
            for attempt in {1..60}; do
              status="$(curl -sS --connect-timeout 5 --max-time 15 -o "$body" -w '%{http_code}' "$url" || true)"
              if [ "$status" = "200" ]; then
                ready=1
                break
              fi

              echo "${name} not ready yet; attempt ${attempt}/60 returned ${status:-no response}"
              sleep 5
            done

            if [ "$ready" -ne 1 ]; then
              echo "${name} failed readiness check at ${url}" >&2
              cat "$body" || true
              exit 1
            fi
          done
          REMOTE_SCRIPT

      - name: Capture retiring generation token evidence
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-bolt-phase0-synthetics.sh pre-activation
          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "XFRAMEWORK_ENV_FILE='$XFRAMEWORK_ENV_FILE' ENV_PARSER='$REMOTE_ENV_PARSER' REMOTE_RUN_DIR='$REMOTE_RUN_DIR' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          umask 077
          read_path() { python3 "$ENV_PARSER" --file "$XFRAMEWORK_ENV_FILE" --key "$1" --type absolute-path; }
          current_service="$(read_path BOLT_SYNTHETIC_COMMUNICATIONS_TOKEN_PATH)"
          current_user="$(read_path BOLT_SYNTHETIC_USER_TOKEN_PATH)"
          retired_service="$(read_path BOLT_SYNTHETIC_REJECTED_COMMUNICATIONS_TOKEN_PATH)"
          retired_user="$(read_path BOLT_SYNTHETIC_REJECTED_USER_TOKEN_PATH)"
          retired_client_secret="$(read_path BOLT_SYNTHETIC_REJECTED_CLIENT_SECRET_PATH)"
          python3 - "$current_service" "$retired_service" "$current_user" "$retired_user" <<'PY'
          import os, pathlib, stat, sys, tempfile
          for source_text, destination_text in zip(sys.argv[1::2], sys.argv[2::2], strict=True):
              source = pathlib.Path(source_text)
              destination = pathlib.Path(destination_text)
              metadata = source.lstat()
              if source.is_symlink() or not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != os.geteuid():
                  raise SystemExit("retiring token source is not a private owned file")
              value = source.read_bytes()
              if not 32 < len(value) <= 16 * 1024:
                  raise SystemExit("retiring token source size is invalid")
              destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
              descriptor, temporary_name = tempfile.mkstemp(prefix=f".{destination.name}.", dir=destination.parent)
              try:
                  os.fchmod(descriptor, 0o600)
                  with os.fdopen(descriptor, "wb", closefd=True) as stream:
                      stream.write(value)
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.replace(temporary_name, destination)
              finally:
                  try: os.unlink(temporary_name)
                  except FileNotFoundError: pass
          PY
          python3 - "$ENV_PARSER" "$XFRAMEWORK_ENV_FILE" "$retired_client_secret" <<'PY'
          import importlib.util, os, pathlib, stat, sys, tempfile
          parser_path, env_path, destination_text = sys.argv[1:]
          spec = importlib.util.spec_from_file_location("phase0_env", parser_path)
          if spec is None or spec.loader is None:
              raise SystemExit("protected environment parser is unavailable")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          secret = module.parse_env(pathlib.Path(env_path)).get("COMMUNICATIONS_SERVICE_IDENTITY_SECRET", "")
          if len(secret) < 32 or len(secret) > 4096 or any(character.isspace() for character in secret):
              raise SystemExit("retiring client secret is invalid")
          destination = pathlib.Path(destination_text)
          destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
          descriptor, temporary_name = tempfile.mkstemp(prefix=f".{destination.name}.", dir=destination.parent)
          try:
              os.fchmod(descriptor, 0o600)
              with os.fdopen(descriptor, "w", encoding="utf-8", closefd=True) as stream:
                  stream.write(secret)
                  stream.flush()
                  os.fsync(stream.fileno())
              os.replace(temporary_name, destination)
          finally:
              try: os.unlink(temporary_name)
              except FileNotFoundError: pass
          PY
          rm -f "$REMOTE_RUN_DIR/synthetics-pre-activation.json"
          REMOTE_SCRIPT

