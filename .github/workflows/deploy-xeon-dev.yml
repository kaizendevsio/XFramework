name: Deploy Xeon Dev - All Services

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROMOTE_BOLT_PHASE0 to authorize the staged xeon-dev promotion
        required: true
        type: string
      publication_topology_confirmation:
        description: Type ATTEST_DIRECT_KESTREL_NO_INTERMEDIARY after verifying no host proxy, Tailscale Serve, load balancer, or ingress fronts Bolt Hub
        required: true
        type: string
      canary_observation_minutes:
        description: Canary observation window before the remaining services are promoted
        required: true
        default: "15"
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: xeon-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Staged Bolt Phase 0 promotion to xeon-dev
    runs-on: [self-hosted, Linux, xeon-dev-deploy]
    timeout-minutes: 480
    env:
      COMPOSE_FILE_PATH: docker-compose.yml
      COMPOSE_PROJECT_NAME: xframework
      REGISTRY_HOST: xsystems-registry-dev.tailed40e.ts.net
      REGISTRY_NAMESPACE: xframework
      IMAGE_TAG: ${{ github.sha }}
      CHANNEL_TAG: develop
      DEPLOY_HOST: github-runner@xeon-dev
      DEPLOY_SSH_KEY: /home/xeon/.ssh/xframework_xeon_dev_ed25519
      DEPLOY_SSH_OPERATION_TIMEOUT_SECONDS: 1800
      REMOTE_DEPLOY_DIR: /home/github-runner/xframework-deploy
      REMOTE_RUN_DIR: /home/github-runner/xframework-deploy/runs/${{ github.run_id }}-${{ github.run_attempt }}
      REMOTE_COMPOSE_FILE: /home/github-runner/xframework-deploy/runs/${{ github.run_id }}-${{ github.run_attempt }}/docker-compose.yml
      REMOTE_PIN_OVERRIDE: /home/github-runner/xframework-deploy/runs/${{ github.run_id }}-${{ github.run_attempt }}/pinned-compose.override.json
      REMOTE_PINS_FILE: /home/github-runner/xframework-deploy/runs/${{ github.run_id }}-${{ github.run_attempt }}/image-pins.json
      REMOTE_LKG_DIR: /home/github-runner/xframework-deploy/phase0-last-known-good
      REMOTE_ROTATION_STATE: /home/github-runner/xframework-deploy/phase0-rotation-state.json
      REMOTE_LEASE_MANAGER: /usr/local/libexec/xframework-bolt-phase0/manage-bolt-phase0-deployment-lease.py
      BOLT_PHASE0_LEASE_RUN_ID: ${{ github.run_id }}
      BOLT_PHASE0_LEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
      BOLT_PHASE0_LEASE_HEARTBEAT_SECONDS: 30
      REMOTE_ROTATION_MANAGER: /home/github-runner/xframework-deploy/runs/${{ github.run_id }}-${{ github.run_attempt }}/manage-bolt-phase0-rotation.py
      REMOTE_RUNTIME_VERIFIER: /home/github-runner/xframework-deploy/runs/${{ github.run_id }}-${{ github.run_attempt }}/verify-bolt-phase0-runtime.py
      REMOTE_ENV_PARSER: /home/github-runner/xframework-deploy/runs/${{ github.run_id }}-${{ github.run_attempt }}/verify-bolt-phase0-env.py
      REMOTE_QUALIFICATION_VERIFIER: /home/github-runner/xframework-deploy/runs/${{ github.run_id }}-${{ github.run_attempt }}/verify-bolt-phase0-qualification.py
      REMOTE_ROOT_HELPER: /usr/local/sbin/xframework-bolt-phase0-root
      REMOTE_WATCHDOG_RUNNER: /usr/local/sbin/xframework-bolt-phase0-watchdog
      XFRAMEWORK_ENV_FILE: /opt/xframework/xeon-dev.env
      DB_PASSWORD: compose-validation-placeholder
      JWT_SECRET: compose-validation-placeholder
      BOLT_SIGNATURE: compose-validation-placeholder
      CREDENTIAL_GENERATION_ID: compose-validation-g1
      IDENTITYSERVER_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      BOLT_HUB_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      COMMUNICATIONS_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      NOTIFICATIONS_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      STORAGE_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      ATTENDANCE_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      SMSGATEWAY_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      WALLETS_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      INVENTARIO_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      POS_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      PORTAL_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      OPERATIONS_DASHBOARD_SERVICE_IDENTITY_SECRET: compose-validation-placeholder
      COMMUNICATIONS_TRUSTED_METADATA_SECRET: compose-validation-placeholder
      BOLT_HUB_TLS_FULLCHAIN_PATH: /tmp/bolt-phase0-validation/fullchain.pem
      BOLT_HUB_TLS_PRIVATE_KEY_PATH: /tmp/bolt-phase0-validation/private-key.pem
      BOLT_HUB_TLS_CA_PATH: /tmp/bolt-phase0-validation/ca.crt
      BOLT_HUB_EXPOSE_PORT: 7000
      BOLT_HUB_PUBLIC_HOSTNAME: xeon-dev.tailed40e.ts.net
      IDENTITYSERVER_TLS_FULLCHAIN_PATH: /tmp/bolt-phase0-validation/identityserver-fullchain.pem
      IDENTITYSERVER_TLS_PRIVATE_KEY_PATH: /tmp/bolt-phase0-validation/identityserver-private-key.pem
      IDENTITYSERVER_TLS_CA_PATH: /tmp/bolt-phase0-validation/identityserver-ca.crt
      IDENTITYSERVER_PUBLIC_HOSTNAME: xeon-dev.tailed40e.ts.net
      IDENTITYSERVER_PUBLIC_HTTPS_PORT: 8261
      IDENTITYSERVER_BOLT_TRANSPORT_TOKEN_PATH: /api/service-identity/bolt-transport-token
      BOLT_SYNTHETIC_IDENTITYSERVER_BASE_URL: https://xeon-dev.tailed40e.ts.net:8261
      BOLT_SYNTHETIC_IDENTITYSERVER_CA_PATH: /tmp/bolt-phase0-validation/identityserver-ca.crt
      BOLT_SYNTHETIC_TENANT_ID: 00000000-0000-0000-0000-000000000001
      BOLT_SYNTHETIC_CREDENTIAL_ID: 00000000-0000-0000-0000-000000000002
      BOLT_SYNTHETIC_DEVICE_ID: phase0-compose-validation
      BOLT_SYNTHETIC_USER_USERNAME: phase0-compose-validation
      BOLT_SYNTHETIC_USER_PASSWORD: compose-validation-placeholder
      BOLT_SYNTHETIC_USER_ROLE_ID: 00000000-0000-0000-0000-000000000003
      BOLT_SYNTHETIC_USER_AUTHORIZATION_TYPE: Default
      BOLT_SYNTHETIC_MIN_TOKEN_LIFETIME_SECONDS: 60
      BOLT_SYNTHETIC_COMMUNICATIONS_TOKEN_PATH: /tmp/bolt-phase0-validation/communications-token
      BOLT_SYNTHETIC_USER_TOKEN_PATH: /tmp/bolt-phase0-validation/user-token
      BOLT_SYNTHETIC_EXPIRY_TOKEN_PATH: /tmp/bolt-phase0-validation/expiry-token
      BOLT_SYNTHETIC_REJECTED_COMMUNICATIONS_TOKEN_PATH: /tmp/bolt-phase0-validation/retired-communications-token
      BOLT_SYNTHETIC_REJECTED_USER_TOKEN_PATH: /tmp/bolt-phase0-validation/retired-user-token
      MAX_JWT_LIFETIME_SECONDS: 1800
      PRE_ACTIVATION_STAGING_BUDGET_SECONDS: 7200
      POST_ACTIVATION_ROLLOUT_BUDGET_SECONDS: 2700
      POST_ACTIVATION_OBSERVATION_BUDGET_SECONDS: 900
      ROLLBACK_BUDGET_SECONDS: 1800

    steps:
      - name: Authorize manual Phase 0 promotion
        shell: bash
        env:
          PROMOTION_CONFIRMATION: ${{ inputs.confirmation }}
          PUBLICATION_TOPOLOGY_CONFIRMATION: ${{ inputs.publication_topology_confirmation }}
          CANARY_OBSERVATION_MINUTES: ${{ inputs.canary_observation_minutes }}
          PROMOTION_ACTOR: ${{ github.actor }}
          PROMOTION_ACTOR_ID: ${{ github.actor_id }}
          PROMOTION_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PROMOTION_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$PROMOTION_CONFIRMATION" = "PROMOTE_BOLT_PHASE0"
          test "$PUBLICATION_TOPOLOGY_CONFIRMATION" = "ATTEST_DIRECT_KESTREL_NO_INTERMEDIARY"
          test "$GITHUB_REF" = "refs/heads/develop"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PROMOTION_ACTOR" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]
          [[ "$PROMOTION_ACTOR_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          test "$PROMOTION_TRIGGERING_ACTOR" = "$PROMOTION_ACTOR"
          test "$PROMOTION_RUN_ATTEMPT" = 1
          case "$CANARY_OBSERVATION_MINUTES" in
            ''|*[!0-9]*) echo "canary observation minutes must be an integer" >&2; exit 1 ;;
          esac
          test "$CANARY_OBSERVATION_MINUTES" -ge 5
          test "$CANARY_OBSERVATION_MINUTES" -le 60

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Configure pinned SSH trust and operation bounds
        id: ssh_setup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$RUNNER_TEMP/bolt-phase0-ssh"
          deploy_ssh_config="$ssh_dir/config"
          known_hosts="$ssh_dir/known_hosts"
          wrapper_dir="$ssh_dir/bin"
          source_known_hosts=".github/known_hosts/xeon-dev"
          runner_home="/home/xeon"
          runner_ssh_dir="$runner_home/.ssh"
          expected_deploy_ssh_key="$runner_ssh_dir/xframework_xeon_dev_ed25519"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          system_ssh="$(command -v ssh)"
          system_scp="$(command -v scp)"
          system_timeout="$(command -v timeout)"

          test -s "$source_known_hosts"
          test "$(grep -cve '^[[:space:]]*$' "$source_known_hosts")" -eq 1
          grep -Eq '^xeon-dev ssh-ed25519 [A-Za-z0-9+/]+={0,2}$' "$source_known_hosts"
          test "$DEPLOY_SSH_KEY" = "$expected_deploy_ssh_key"
          test -d "$runner_home"
          test ! -L "$runner_home"
          test "$(readlink -e -- "$runner_home")" = "$runner_home"
          test -d "$runner_ssh_dir"
          test ! -L "$runner_ssh_dir"
          test "$(readlink -e -- "$runner_ssh_dir")" = "$runner_ssh_dir"
          IFS=: read -r ssh_dir_uid ssh_dir_gid ssh_dir_mode < <(
            stat -Lc '%u:%g:%a' -- "$runner_ssh_dir"
          )
          test "$ssh_dir_uid" = "$runner_uid"
          test "$ssh_dir_gid" = "$runner_gid"
          test "$ssh_dir_mode" = 700
          test ! -L "$DEPLOY_SSH_KEY"
          test "$(readlink -e -- "$DEPLOY_SSH_KEY")" = "$DEPLOY_SSH_KEY"
          exec {deploy_key_fd}< "$DEPLOY_SSH_KEY"
          deploy_key_fd_path="/proc/$$/fd/$deploy_key_fd"
          test -f "$deploy_key_fd_path"
          test "$(stat -Lc '%d:%i' -- "$DEPLOY_SSH_KEY")" = "$(stat -Lc '%d:%i' -- "$deploy_key_fd_path")"
          IFS=: read -r key_uid key_gid key_mode key_nlink key_size < <(
            stat -Lc '%u:%g:%a:%h:%s' -- "$deploy_key_fd_path"
          )
          test "$key_uid" = "$runner_uid"
          test "$key_gid" = "$runner_gid"
          test "$key_mode" = 600
          test "$key_nlink" = 1
          test "$key_size" -gt 0
          exec {deploy_key_fd}<&-

          install -d -m 700 "$ssh_dir" "$wrapper_dir"
          install -m 600 "$source_known_hosts" "$known_hosts"
          cat > "$deploy_ssh_config" <<EOF
          Host xeon-dev
            HostName xeon-dev
            User github-runner
            IdentityFile $DEPLOY_SSH_KEY
            IdentitiesOnly yes
            BatchMode yes
            PreferredAuthentications publickey
            PasswordAuthentication no
            KbdInteractiveAuthentication no
            StrictHostKeyChecking yes
            UserKnownHostsFile $known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            ConnectTimeout 10
            ConnectionAttempts 2
            ServerAliveInterval 15
            ServerAliveCountMax 3
            ControlMaster no
            ClearAllForwardings yes
            RequestTTY no
          EOF
          chmod 600 "$deploy_ssh_config"

          cat > "$wrapper_dir/ssh" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          duration="\${DEPLOY_SSH_OPERATION_TIMEOUT_SECONDS:-1800}"
          case "\$duration" in ''|*[!0-9]*) exit 64 ;; esac
          exec "$system_timeout" --foreground --signal=TERM --kill-after=15s "\${duration}s" \
            "$system_ssh" -F "$deploy_ssh_config" "\$@"
          EOF
          cat > "$wrapper_dir/scp" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          duration="\${DEPLOY_SSH_OPERATION_TIMEOUT_SECONDS:-1800}"
          case "\$duration" in ''|*[!0-9]*) exit 64 ;; esac
          exec "$system_timeout" --foreground --signal=TERM --kill-after=15s "\${duration}s" \
            "$system_scp" -F "$deploy_ssh_config" "\$@"
          EOF
          chmod 700 "$wrapper_dir/ssh" "$wrapper_dir/scp"
          printf '%s\n' "$wrapper_dir" >> "$GITHUB_PATH"
          printf 'DEPLOY_SSH_CONFIG=%s\n' "$deploy_ssh_config" >> "$GITHUB_ENV"
          printf 'DEPLOY_KNOWN_HOSTS=%s\n' "$known_hosts" >> "$GITHUB_ENV"
          printf 'DEPLOY_SSH_READY=true\n' >> "$GITHUB_ENV"

          "$system_ssh" -F "$deploy_ssh_config" -G xeon-dev >/dev/null

      - name: Verify build runner, Docker, registry, and deploy host
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner host: $(hostname)"
          uname -a
          docker --version
          docker compose version
          curl --version
          test -S /var/run/docker.sock
          docker info --format 'Docker daemon: {{.Name}} {{.ServerVersion}}'

          registry_headers="$(mktemp)"
          registry_status="$(curl -sS --connect-timeout 5 --max-time 15 \
            -o "$registry_headers" -w "%{http_code}" -I "https://${REGISTRY_HOST}/v2/" || true)"
          cat "$registry_headers"
          test "$registry_status" = "401"
          grep -qi '^Docker-Distribution-Api-Version: registry/2.0' "$registry_headers"

          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "test -r '$XFRAMEWORK_ENV_FILE' && docker --version && docker compose version && curl -sSI --connect-timeout 5 --max-time 15 'https://${REGISTRY_HOST}/v2/' | sed -n '1,8p'"

      - name: Validate Phase 0 Compose semantics
        shell: bash
        run: |
          set -euo pipefail
          local_tls_root="$RUNNER_TEMP/bolt-phase0-local-tls"
          test -d "$RUNNER_TEMP"
          test ! -L "$RUNNER_TEMP"
          test "$(readlink -e -- "$RUNNER_TEMP")" = "$RUNNER_TEMP"
          test ! -e "$local_tls_root"
          test ! -L "$local_tls_root"
          install -d -m 700 "$local_tls_root"
          python3 - "$local_tls_root" <<'PY'
          import os
          import stat
          import sys

          root = sys.argv[1]
          names = (
              "bolt-hub-ca.crt",
              "bolt-hub-fullchain.pem",
              "bolt-hub-private-key.pem",
              "identityserver-ca.crt",
              "identityserver-fullchain.pem",
              "identityserver-private-key.pem",
          )
          directory_flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
          directory = os.open(root, directory_flags)
          try:
              parent = os.fstat(directory)
              if (
                  not stat.S_ISDIR(parent.st_mode)
                  or parent.st_uid != os.geteuid()
                  or parent.st_gid != os.getegid()
                  or stat.S_IMODE(parent.st_mode) != 0o700
              ):
                  raise SystemExit("local TLS fixture directory metadata is invalid")
              identities = set()
              for name in names:
                  descriptor = os.open(
                      name,
                      os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC,
                      0o600,
                      dir_fd=directory,
                  )
                  try:
                      opened = os.fstat(descriptor)
                      current = os.stat(name, dir_fd=directory, follow_symlinks=False)
                      identity = (opened.st_dev, opened.st_ino)
                      if (
                          not stat.S_ISREG(opened.st_mode)
                          or opened.st_nlink != 1
                          or opened.st_uid != os.geteuid()
                          or opened.st_gid != os.getegid()
                          or stat.S_IMODE(opened.st_mode) != 0o600
                          or opened.st_size != 0
                          or identity != (current.st_dev, current.st_ino)
                      ):
                          raise SystemExit("local TLS fixture metadata is invalid")
                      identities.add(identity)
                  finally:
                      os.close(descriptor)
              if len(identities) != len(names):
                  raise SystemExit("local TLS fixtures must have distinct file identities")
          finally:
              os.close(directory)
          PY
          BOLT_HUB_TLS_CA_PATH="$local_tls_root/bolt-hub-ca.crt"
          BOLT_HUB_TLS_FULLCHAIN_PATH="$local_tls_root/bolt-hub-fullchain.pem"
          BOLT_HUB_TLS_PRIVATE_KEY_PATH="$local_tls_root/bolt-hub-private-key.pem"
          IDENTITYSERVER_TLS_CA_PATH="$local_tls_root/identityserver-ca.crt"
          IDENTITYSERVER_TLS_FULLCHAIN_PATH="$local_tls_root/identityserver-fullchain.pem"
          IDENTITYSERVER_TLS_PRIVATE_KEY_PATH="$local_tls_root/identityserver-private-key.pem"
          export BOLT_HUB_TLS_CA_PATH BOLT_HUB_TLS_FULLCHAIN_PATH BOLT_HUB_TLS_PRIVATE_KEY_PATH
          export IDENTITYSERVER_TLS_CA_PATH IDENTITYSERVER_TLS_FULLCHAIN_PATH IDENTITYSERVER_TLS_PRIVATE_KEY_PATH
          {
            printf 'BOLT_HUB_TLS_CA_PATH=%s\n' "$BOLT_HUB_TLS_CA_PATH"
            printf 'BOLT_HUB_TLS_FULLCHAIN_PATH=%s\n' "$BOLT_HUB_TLS_FULLCHAIN_PATH"
            printf 'BOLT_HUB_TLS_PRIVATE_KEY_PATH=%s\n' "$BOLT_HUB_TLS_PRIVATE_KEY_PATH"
            printf 'IDENTITYSERVER_TLS_CA_PATH=%s\n' "$IDENTITYSERVER_TLS_CA_PATH"
            printf 'IDENTITYSERVER_TLS_FULLCHAIN_PATH=%s\n' "$IDENTITYSERVER_TLS_FULLCHAIN_PATH"
            printf 'IDENTITYSERVER_TLS_PRIVATE_KEY_PATH=%s\n' "$IDENTITYSERVER_TLS_PRIVATE_KEY_PATH"
          } >> "$GITHUB_ENV"
          evidence_dir="$RUNNER_TEMP/bolt-phase0-evidence"
          mkdir -p "$evidence_dir"
          rm -f "$evidence_dir"/*.json
          python3 scripts/verify-bolt-phase0-compose.py \
            --compose-file "$COMPOSE_FILE_PATH" \
            --output "$evidence_dir/local-compose.json" \
            --expected-ca-path "$BOLT_HUB_TLS_CA_PATH" \
            --expected-fullchain-path "$BOLT_HUB_TLS_FULLCHAIN_PATH" \
            --expected-private-key-path "$BOLT_HUB_TLS_PRIVATE_KEY_PATH" \
            --expected-published-port "$BOLT_HUB_EXPOSE_PORT" \
            --expected-public-hostname "$BOLT_HUB_PUBLIC_HOSTNAME" \
            --expected-identityserver-ca-path "$IDENTITYSERVER_TLS_CA_PATH" \
            --expected-identityserver-fullchain-path "$IDENTITYSERVER_TLS_FULLCHAIN_PATH" \
            --expected-identityserver-private-key-path "$IDENTITYSERVER_TLS_PRIVATE_KEY_PATH" \
            --expected-identityserver-published-port "$IDENTITYSERVER_PUBLIC_HTTPS_PORT" \
            --expected-identityserver-public-hostname "$IDENTITYSERVER_PUBLIC_HOSTNAME" \
            --expected-identityserver-token-path "$IDENTITYSERVER_BOLT_TRANSPORT_TOKEN_PATH"

      - name: Validate protected deployment inputs without mutation
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            JWT_SECRET
            JWT_ISSUER
            JWT_AUDIENCE
            BOLT_SIGNATURE
            IDENTITYSERVER_SERVICE_IDENTITY_SECRET
            BOLT_HUB_SERVICE_IDENTITY_SECRET
            COMMUNICATIONS_SERVICE_IDENTITY_SECRET
            NOTIFICATIONS_SERVICE_IDENTITY_SECRET
            STORAGE_SERVICE_IDENTITY_SECRET
            ATTENDANCE_SERVICE_IDENTITY_SECRET
            SMSGATEWAY_SERVICE_IDENTITY_SECRET
            WALLETS_SERVICE_IDENTITY_SECRET
            INVENTARIO_SERVICE_IDENTITY_SECRET
            POS_SERVICE_IDENTITY_SECRET
            PORTAL_SERVICE_IDENTITY_SECRET
            OPERATIONS_DASHBOARD_SERVICE_IDENTITY_SECRET
            BOLT_HUB_TLS_FULLCHAIN_PATH
            BOLT_HUB_TLS_PRIVATE_KEY_PATH
            BOLT_HUB_TLS_CA_PATH
            BOLT_HUB_EXPOSE_PORT
            BOLT_HUB_PUBLIC_HOSTNAME
            IDENTITYSERVER_TLS_FULLCHAIN_PATH
            IDENTITYSERVER_TLS_PRIVATE_KEY_PATH
            IDENTITYSERVER_TLS_CA_PATH
            IDENTITYSERVER_PUBLIC_HOSTNAME
            IDENTITYSERVER_PUBLIC_HTTPS_PORT
            IDENTITYSERVER_BOLT_TRANSPORT_TOKEN_PATH
            BOLT_SYNTHETIC_IDENTITYSERVER_BASE_URL
            BOLT_SYNTHETIC_IDENTITYSERVER_CA_PATH
            BOLT_SYNTHETIC_TENANT_ID
            BOLT_SYNTHETIC_CREDENTIAL_ID
            BOLT_SYNTHETIC_DEVICE_ID
            BOLT_SYNTHETIC_USER_USERNAME
            BOLT_SYNTHETIC_USER_PASSWORD
            BOLT_SYNTHETIC_USER_ROLE_ID
            BOLT_SYNTHETIC_USER_AUTHORIZATION_TYPE
            BOLT_SYNTHETIC_MIN_TOKEN_LIFETIME_SECONDS
            BOLT_SYNTHETIC_TOKEN_REFRESH_COMMAND_PATH
            BOLT_SYNTHETIC_PROXY_MARKER_SCAN_COMMAND_PATH
            BOLT_SYNTHETIC_SEQ_MARKER_SCAN_COMMAND_PATH
            BOLT_SYNTHETIC_TRACE_MARKER_SCAN_COMMAND_PATH
            BOLT_SYNTHETIC_PLAINTEXT_REJECTION_COMMAND_PATH
            BOLT_SYNTHETIC_REDIS_INTERRUPTION_COMMAND_PATH
            BOLT_SYNTHETIC_OLD_GENERATION_REJECTION_COMMAND_PATH
            BOLT_SYNTHETIC_COMPOSE_PROJECT_NAME
            BOLT_SYNTHETIC_PLAINTEXT_PEER_SERVICE
            BOLT_SYNTHETIC_PROXY_MODE
            BOLT_SYNTHETIC_SEQ_API_URL
            BOLT_SYNTHETIC_SEQ_API_KEY
            BOLT_SYNTHETIC_JAEGER_QUERY_API_URL
            BOLT_SYNTHETIC_REDIS_POST_RECOVERY_COMMAND_PATH
            BOLT_PHASE0_RECOVERY_SYNTHETIC_COMMAND_PATH
            BOLT_SYNTHETIC_REJECTED_CLIENT_SECRET_PATH
            BOLT_SYNTHETIC_COMMUNICATIONS_TOKEN_PATH
            BOLT_SYNTHETIC_USER_TOKEN_PATH
            BOLT_SYNTHETIC_EXPIRY_TOKEN_PATH
            BOLT_SYNTHETIC_REJECTED_COMMUNICATIONS_TOKEN_PATH
            BOLT_SYNTHETIC_REJECTED_USER_TOKEN_PATH
          )

          quoted_vars="$(printf '%q ' "${required_vars[@]}")"

          ssh -i "$DEPLOY_SSH_KEY" -o BatchMode=yes "$DEPLOY_HOST" \
            "XFRAMEWORK_ENV_FILE='$XFRAMEWORK_ENV_FILE' bash -s -- $quoted_vars" <<'REMOTE_SCRIPT'
          set -euo pipefail
          python3 - "$XFRAMEWORK_ENV_FILE" "$@" <<'PY'
          import errno
          import os
          import re
          import stat
          import sys

          env_path = sys.argv[1]
          required_names = sys.argv[2:]
          if len(required_names) != 58 or len(set(required_names)) != 58:
              raise SystemExit("protected deployment variable inventory must contain exactly 58 unique names")
          required = set(required_names)
          maximum_protected_env_bytes = 1024 * 1024

          for flag_name in ("O_NOFOLLOW", "O_CLOEXEC", "O_NONBLOCK"):
              if not hasattr(os, flag_name):
                  raise SystemExit(f"protected deployment preflight requires {flag_name}")

          def metadata_fingerprint(metadata):
              return (
                  metadata.st_dev,
                  metadata.st_ino,
                  metadata.st_mode,
                  metadata.st_uid,
                  metadata.st_gid,
                  metadata.st_nlink,
                  metadata.st_size,
                  metadata.st_mtime_ns,
                  metadata.st_ctime_ns,
              )

          def validate_metadata(metadata):
              if not stat.S_ISREG(metadata.st_mode):
                  raise SystemExit("protected deployment env file must be a regular file")
              if metadata.st_nlink != 1:
                  raise SystemExit("protected deployment env file must have exactly one link")
              if metadata.st_size > maximum_protected_env_bytes:
                  raise SystemExit("protected deployment env file exceeds the size limit")
              if stat.S_IMODE(metadata.st_mode) & 0o077:
                  raise SystemExit("protected deployment env file must not be group/world accessible")

          def path_metadata():
              try:
                  metadata = os.stat(env_path, follow_symlinks=False)
              except FileNotFoundError:
                  raise SystemExit("protected deployment env file is missing") from None
              except OSError:
                  raise SystemExit("protected deployment env file metadata cannot be read safely") from None
              validate_metadata(metadata)
              return metadata

          def read_opened_file(descriptor):
              os.lseek(descriptor, 0, os.SEEK_SET)
              chunks = []
              total = 0
              while True:
                  try:
                      chunk = os.read(descriptor, 64 * 1024)
                  except InterruptedError:
                      continue
                  if not chunk:
                      return b"".join(chunks)
                  total += len(chunk)
                  if total > maximum_protected_env_bytes:
                      raise SystemExit("protected deployment env file exceeds the size limit")
                  chunks.append(chunk)

          flags = os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC | os.O_NONBLOCK
          try:
              descriptor = os.open(env_path, flags)
          except FileNotFoundError:
              raise SystemExit("protected deployment env file is missing") from None
          except OSError as error:
              if error.errno == errno.ELOOP:
                  raise SystemExit("protected deployment env file must not be a symlink") from None
              raise SystemExit("protected deployment env file cannot be opened safely") from None

          try:
              opened = os.fstat(descriptor)
              validate_metadata(opened)
              before_path = path_metadata()
              if (opened.st_dev, opened.st_ino) != (before_path.st_dev, before_path.st_ino):
                  raise SystemExit("protected deployment env path does not identify the opened file")
              if metadata_fingerprint(opened) != metadata_fingerprint(before_path):
                  raise SystemExit("protected deployment env metadata changed before validation")

              first_content = read_opened_file(descriptor)
              between_reads = os.fstat(descriptor)
              second_content = read_opened_file(descriptor)
              after_opened = os.fstat(descriptor)
              after_path = path_metadata()
              expected_metadata = metadata_fingerprint(opened)
              if (
                  metadata_fingerprint(between_reads) != expected_metadata
                  or metadata_fingerprint(after_opened) != expected_metadata
                  or metadata_fingerprint(after_path) != expected_metadata
                  or first_content != second_content
                  or len(first_content) != opened.st_size
              ):
                  raise SystemExit("protected deployment env file changed during validation")
          finally:
              os.close(descriptor)

          if first_content.startswith(b"\xef\xbb\xbf") or b"\x00" in first_content:
              raise SystemExit("protected deployment env file must not contain a UTF-8 BOM or NUL")
          try:
              content = first_content.decode("utf-8")
          except UnicodeDecodeError:
              raise SystemExit("protected deployment env file must be valid UTF-8") from None

          names = re.compile(r"^[A-Za-z_][A-Za-z0-9_]*$")
          values = {}
          for number, raw in enumerate(content.splitlines(), 1):
              if not raw.strip() or raw.lstrip().startswith("#"):
                  continue
              name, separator, value = raw.partition("=")
              if not separator or not names.fullmatch(name) or name in values:
                  raise SystemExit(f"invalid or duplicate env entry on line {number}")
              values[name] = value
          missing = sorted(name for name in required if not values.get(name))
          if missing:
              raise SystemExit("missing protected deployment variables: " + ", ".join(missing))
          for name in required:
              value = values[name]
              if "change-me" in value.lower() or "placeholder" in value.lower():
                  raise SystemExit(f"protected deployment variable {name} contains a placeholder")

          proxy_mode = values["BOLT_SYNTHETIC_PROXY_MODE"]
          if proxy_mode != "direct-kestrel":
              raise SystemExit("BOLT_SYNTHETIC_PROXY_MODE must be exactly direct-kestrel for Phase 0 promotion")
          if "BOLT_SYNTHETIC_PROXY_LOG_PATHS" in values:
              raise SystemExit("BOLT_SYNTHETIC_PROXY_LOG_PATHS must be absent in direct-kestrel mode")
          PY
          REMOTE_SCRIPT

