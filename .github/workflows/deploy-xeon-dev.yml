            --expected-identityserver-private-key-path "$IDENTITYSERVER_TLS_PRIVATE_KEY_PATH" \
            --expected-identityserver-published-port "$IDENTITYSERVER_PUBLIC_HTTPS_PORT" \
            --expected-identityserver-public-hostname "$IDENTITYSERVER_PUBLIC_HOSTNAME" \
            --expected-identityserver-token-path "$IDENTITYSERVER_BOLT_TRANSPORT_TOKEN_PATH" \
            --pins-file "$pins_file" \
