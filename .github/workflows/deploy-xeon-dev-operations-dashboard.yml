name: Deploy Xeon Dev - Operations Dashboard

on:
  push:
    branches: [develop]
    paths:
      - src/Presentation/XFramework.Operations.Dashboard/**
      - src/Infrastructure/XFramework.Integration/**
      - src/Kernel/XFramework.Core/**
      - src/Modules/XFramework.Bolt/Bolt.Domain.Shared/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-shared-changes:
    name: Detect shared deploy ownership
    runs-on: ubuntu-latest
    outputs:
      has_shared: ${{ steps.shared.outputs.has_shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect shared changes
        id: shared
        uses: ./.github/actions/detect-shared-deploy-changes

  deploy:
    needs: detect-shared-changes
    if: needs.detect-shared-changes.outputs.has_shared != 'true'
    uses: ./.github/workflows/deploy-xeon-dev-service.yml
    with:
      service: operations-dashboard
      health_url: http://localhost:5050/health/ready
      diagnostics_services: bolt-hub seq jaeger operations-dashboard
    secrets: inherit
