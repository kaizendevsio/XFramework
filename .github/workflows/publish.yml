name: Publish NuGet Packages

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build XFramework.slnx -c Release

      - name: Test (unit tests only)
        run: dotnet test src/Tests/XFramework.Core.Tests/ -c Release --no-build
        continue-on-error: true

      - name: Pack
        run: bash scripts/pack-all.sh Release

      - name: Publish to NuGet
        run: dotnet nuget push ./nupkgs/*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ./nupkgs/
